{% extends "templates/base.html" %}

{% block title %}Keks Trace Terminal{% endblock %}
{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block style %}
<style>
	/* Farben angelehnt an FOBIS: hellblauer Grund, blaue Titelleiste, gelbe Felder, orange Tabellenköpfe */
	:root {
		--bg: #dce8f6;
		--panel: #fbeaa8;
		--panel2: #e9f1fb;
		--rand: #9db9dd;
		--text: #1b1f24;
		--muted: #5a6573;
		--gruen: #2f9a3a;
		--rot: #d23a3a;
		--orange: #f0a030;
		--blau: #2a7bdc;
		--titel: linear-gradient(#4d9cf0, #1f6dd0);
		--kopfzeile: linear-gradient(#fcd27a, #f2a83c);
	}
	html, body { background: var(--bg) !important; color: var(--text); margin: 0; }
	body { font: 20px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	#kt { position: fixed; inset: 0 0 64px 0; overflow-y: auto; background: var(--bg); color: var(--text); padding: 0 max(16px, calc((100vw - 1280px) / 2)) 40px; box-sizing: border-box; z-index: 10; }
	#kt h1, #kt p { color: inherit; }
	#kt .fehlt, #kt label, #kt .klein { color: var(--muted); }
	#kt .ok { color: var(--gruen); }
	.kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px max(16px, calc((100vw - 1280px) / 2)); margin: 0 calc(-1 * max(16px, calc((100vw - 1280px) / 2))) 14px;
		background: var(--titel); color: #fff; position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
	.kopf h1 { font-size: 28px; margin: 0; font-weight: 500; color: #fff !important; }
	#kt .kopf .klein, #kt .kopf .link { color: #e3efff; }
	.link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 16px; cursor: pointer; padding: 6px; }
	.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
	.knopf { display: block; width: 100%; min-height: 84px; border: 1px solid var(--rand); border-radius: 6px; background: linear-gradient(#fbfdff, #d9e7f7); color: var(--text); font-size: 22px; font-weight: 600; padding: 14px; cursor: pointer; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
	.knopf small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 4px; }
	.knopf:active { transform: scale(0.98); background: #c9dcf3; }
	.knopf.gruen { background: linear-gradient(#5cc061, #2f9a3a); border-color: #2a7f33; color: #fff; }
	.knopf.blau { background: linear-gradient(#fff7d8, #f6dc84); border-color: #d6b24a; }
	.knopf.rot { background: linear-gradient(#ea6b6b, #c93030); border-color: #a82828; color: #fff; }
	.knopf.gruen small, .knopf.rot small { color: #eefbe9; }
	.knopf.klein { min-height: 52px; font-size: 18px; width: auto; display: inline-block; padding: 10px 18px; }
	.feld { width: 100%; box-sizing: border-box; font-size: 26px; padding: 12px 14px; border-radius: 4px; border: 1px solid var(--rand); background: #fff; color: var(--text); }
	.feld:focus { outline: none; border: 2px solid var(--blau); background: #fffef2; }
	label { display: block; color: var(--muted); font-size: 17px; margin: 14px 0 6px; }
	/* Hinweis unter einem Feld (Datum: Format bzw. erkanntes Datum) */
	.feld-hinweis { display: block; font-size: 16px; margin: 6px 0 0; color: var(--muted); }
	.feld-hinweis.ok { color: var(--gruen); font-weight: 600; }
	.feld-hinweis.falsch { color: var(--rot); font-weight: 600; }
	.feld.falsch { border-color: var(--rot); box-shadow: 0 0 0 2px rgba(210,58,58,.25); }
	.panel { background: var(--panel); border: 1px solid #dfc56a; border-radius: 6px; padding: 12px 16px; margin: 14px 0; }
	.zeile { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e8d38a; }
	.zeile:last-child { border-bottom: none; }
	.zeile .rechts { text-align: right; white-space: nowrap; }
	.ok { color: var(--gruen); }
	.fehlt { color: var(--muted); }
	.meldung { border-radius: 6px; padding: 14px 18px; margin: 14px 0; font-size: 22px; font-weight: 600; }
	.meldung.rot { background: var(--rot); color: #fff; }
	.meldung.gruen { background: var(--gruen); color: #fff; }
	.meldung.orange { background: var(--orange); color: #111; }
	.meldung small { display: block; font-weight: 400; font-size: 17px; margin-top: 6px; }
	#druckhinweis { position: fixed; left: 16px; right: 16px; top: 8px; z-index: 60; max-width: 900px; margin: 0 auto; }
	#druckhinweis .meldung { box-shadow: 0 4px 16px rgba(0,0,0,.35); margin: 0; }
	#druckhinweis .reihe { margin-top: 10px; }
	.gross { font-size: 34px; font-weight: 700; letter-spacing: 0.5px; word-break: break-all; }
	.reihe { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
	.reihe > * { flex: 1 1 220px; }
	.x { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; padding: 0 8px; }
	.dialog { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
	.dialog .panel { max-width: 520px; width: 100%; }
	#tasten { display: none; position: fixed; left: 0; right: 0; bottom: 64px; z-index: 50; gap: 8px; padding: 10px max(12px, calc((100vw - 1280px) / 2)) 14px;
		background: #e9f1fb; border-top: 1px solid var(--rand); box-shadow: 0 -4px 12px rgba(0,0,0,.2); }
	#tasten.zahl { grid-template-columns: repeat(4, minmax(0, 150px)); justify-content: center; }
	#tasten.text { grid-template-columns: repeat(10, 1fr); }
	#tasten button { min-height: 60px; border: 1px solid #d8bd62; border-radius: 4px; background: linear-gradient(#fffbea, #f9e7a4); color: var(--text); font-size: 28px; font-weight: 500; cursor: pointer; touch-action: manipulation; padding: 0; }
	#tasten.text button { min-height: 52px; font-size: 21px; }
	#tasten button:active { background: #f2d470; }
	#tasten .ok { background: linear-gradient(#5cc061, #2f9a3a); color: #fff; border-color: #2a7f33; }
	#tasten.zahl .ok { grid-row: span 2; }
	#tasten .weg { background: linear-gradient(#f1f6fc, #d5e3f4); border-color: var(--rand); font-size: 20px; }
	/* Breiter Bildschirm: Ziffernblock fest rechts wie bei FOBIS, Inhalt rückt nach links */
	@media (min-width: 1000px) {
		#tasten.zahl { left: auto; right: 16px; bottom: 76px; width: 360px; padding: 12px; grid-template-columns: repeat(4, 1fr);
			border: 1px solid var(--rand); border-radius: 6px; }
		#tasten.zahl button { min-height: 74px; }
		#kt.blockrechts > *:not(.kopf) { max-width: calc(100% - 384px); }
	}
	/* Arbeitsmaske wie bei FOBIS: links Positionen und die gewählte groß, rechts Herkunft, Ziel und Eingabe.
	   Der Ziffernblock dockt unten rechts an (wie bei FOBIS); darüber bleibt die rechte Spalte frei scrollbar. */
	.maske { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
	.m-links { min-width: 0; }
	.m-rechts { position: sticky; top: 72px; }
	.m-gruppe { border: 1px solid var(--rand); border-radius: 6px; background: var(--panel2); padding: 4px 12px 10px; margin: 0 0 12px; min-width: 0; }
	.m-gruppe legend { color: var(--blau); font-size: 16px; padding: 0 6px; }
	.m-gruppe .zeile { padding: 6px 0; font-size: 18px; }
	.m-gruppe .knopf { min-height: 56px; font-size: 19px; margin-top: 8px; }
	.m-gruppe label { margin-top: 8px; }
	.m-detail { background: var(--panel); border: 1px solid var(--rand); border-radius: 6px; padding: 10px 14px; margin: 0 0 14px; }
	.m-detail .titel { display: flex; justify-content: space-between; gap: 12px; font-size: 22px; }
	.m-detail .titel small { color: var(--muted); font-size: 16px; display: block; }
	.gross3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
	.gross3 small { display: block; color: var(--blau); font-size: 16px; }
	.gross3 b { font-size: 42px; font-weight: 500; font-variant-numeric: tabular-nums; }
	.gross3 i { font-style: normal; font-size: 20px; color: var(--muted); margin-left: 4px; }
	.tab tr.gewaehlt td { background: #f8d98a !important; }
	.tab tr[data-a] td { cursor: pointer; }
	@media (min-width: 1000px) {
		#kt.blockrechts > div.maske { max-width: none; }
		#kt.blockrechts .m-rechts { padding-bottom: 380px; }
	}
	@media (max-width: 999px) { .maske { grid-template-columns: 1fr; } .m-rechts { position: static; } }
	/* Statusleiste unten wie bei FOBIS: Start, letzte Meldung, Zurück */
	#status { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 60; display: flex; align-items: center; gap: 14px; padding: 0 16px;
		background: linear-gradient(#e8f1fc, #bcd5f2); border-top: 1px solid var(--rand); color: var(--text); box-sizing: border-box; }
	#status button { border: 1px solid var(--rand); background: linear-gradient(#fff, #dbe8f8); border-radius: 6px; font-size: 26px; min-width: 64px; height: 50px; cursor: pointer; }
	#status .text { flex: 1; font-size: 20px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
	#status .text b { display: inline-block; width: 30px; height: 30px; border-radius: 50%; background: var(--blau); color: #fff; text-align: center; font: 700 20px/30px serif; margin-right: 8px; }
	#status.rot { background: linear-gradient(#ffd9d9, #f19c9c); } #status.rot .text b { background: var(--rot); }
	#status.gruen { background: linear-gradient(#e2f7df, #a9dea4); } #status.gruen .text b { background: var(--gruen); }
	#status.orange .text b { background: var(--orange); }
	#status .info { text-align: right; font-size: 15px; line-height: 1.3; white-space: nowrap; color: var(--text); }
	#status .info .uhr { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
	#status .info .punkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gruen); margin-right: 5px; vertical-align: middle; }
	#status .info .punkt.weg { background: var(--rot); }
	#status .info .offline { color: var(--rot); font-weight: 700; }
	#status .info .pr.rot { color: var(--rot); font-weight: 700; } #status .info .pr.orange { color: #b86b00; font-weight: 700; }
	@media (max-width: 800px) { #status .info .zweit { display: none; } }
	#alert-container { display: none !important; } /* englische Frappe-Hinweise; das Terminal meldet selbst */
	/* Tabellen wie bei FOBIS: orange Kopfzeile, angetippte Zeile gelb */
	.tab { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--rand); font-size: 19px; margin: 8px 0 14px; }
	.tab th { background: var(--kopfzeile); text-align: left; padding: 8px 10px; font-weight: 700; border-right: 1px solid #e3a24a; white-space: nowrap; }
	.tab td { padding: 10px; border-top: 1px solid #e4e9f0; }
	.tab tr[data-a] { cursor: pointer; }
	.tab tr[data-a]:active, .tab tr.an { background: #f8d98a; }
	.tab .z { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
	.tab a, .tab .code { color: #1a55c4; text-decoration: underline; }
	/* Einwaage wie bei FOBIS: Bestellt / Erledigt / ToDo je Zutat */
	.einwaage { overflow-x: auto; }
	.einwaage .tab { margin-top: 0; font-size: 18px; }
	.einwaage .tab th, .einwaage .tab td { padding: 8px; }
	.einwaage td { vertical-align: top; }
	.einwaage tr.fertig td { background: #e6f4ea; }
	.einwaage tr.ueber td { background: #fde6c2; }
	.einwaage td small { display: block; font-size: 15px; color: var(--muted); }
	.einwaage .todo { font-weight: 700; }
	.einwaage .knopf.klein { min-height: 44px; margin-top: 6px; }
	.position { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: var(--panel); border: 1px solid #dfc56a; border-radius: 6px; padding: 12px 16px; margin: 14px 0; }
	.position .titel { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 22px; }
	.position .wert { color: #1a55c4; font-size: 17px; }
	.position .wert div { color: var(--text); font-size: 46px; font-weight: 500; line-height: 1.1; }
	.reiter { display: flex; gap: 4px; margin-top: 14px; }
	.reiter button { border: 1px solid var(--rand); border-bottom: none; border-radius: 8px 8px 0 0; background: linear-gradient(#fbfdff, #d9e7f7); padding: 8px 18px; font-size: 17px; cursor: pointer; }
	.reiter button.an { background: var(--panel); border-color: #dfc56a; font-weight: 700; }
	#tasten .breit { grid-column: span 2; }
	.einheiten { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
	.einheiten button { flex: 1 1 120px; min-height: 56px; border: 1px solid #d8bd62; border-radius: 6px; background: linear-gradient(#fffbea, #f9e7a4); color: var(--text); font-size: 20px; cursor: pointer; }
	.einheiten button.an { border: 2px solid #b8860b; background: linear-gradient(#fcd27a, #f2a83c); font-weight: 700; }
	.mitknopf { display: flex; gap: 10px; }
	.mitknopf .feld { flex: 1; }
	.mitknopf .knopf { width: auto; min-height: 0; flex: 0 0 auto; font-size: 18px; padding: 0 18px; }
	.nve { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
	.nve small { font-size: 18px; color: var(--muted); font-weight: 400; }
	.pos { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--rand); color: var(--text); border-radius: 6px; padding: 12px 14px; margin: 8px 0; font-size: 19px; cursor: pointer; }
	.pos small { display: block; color: var(--muted); font-size: 15px; }
	.marke { display: inline-block; font-size: 15px; padding: 2px 10px; border-radius: 20px; background: #d9e7f7; margin-left: 8px; vertical-align: middle; }
	/* Hinweis vom Büro am Auftrag: groß und gelb, nicht zu übersehen */
	.hinweis-buero { background: #fff3c4; border: 2px solid #e0a800; border-left-width: 10px; border-radius: 6px; padding: 12px 16px; margin: 10px 0; font-size: 24px; font-weight: 700; }
	.hinweis-buero small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-bottom: 2px; }
	.balken { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; margin-top: 4px; min-width: 80px; }
	.balken div { height: 100%; background: var(--blau); }
	.marke.gruen { background: var(--gruen); color: #fff; } .marke.orange { background: var(--orange); color: #111; } .marke.rot { background: var(--rot); color: #fff; }
	@media (max-width: 600px) {
		body { font-size: 18px; }
		.knopf { min-height: 72px; font-size: 20px; }
		.gross { font-size: 26px; }
		#tasten button { min-height: 50px; font-size: 22px; }
		#tasten.text button { min-height: 42px; font-size: 17px; }
	}
</style>
{% endblock %}

{% block content %}
<div id="kt" data-csrf="{{ kt_csrf }}"><p style="padding:24px">Lädt …</p></div>
<div id="status"><button type="button" id="status-start" title="Startseite">⌂</button><div class="text"><b>i</b><span id="status-text">Bereit.</span></div><div class="info" id="status-info"></div><button type="button" id="status-zurueck" title="Zurück">←</button></div>
{% endblock %}

{% block script %}
<script src="/assets/keks_trace/js/akte_ansicht.js"></script>
<script>
{% raw %}
(function () {
	"use strict";
	const API = "/api/method/keks_trace.terminal.";
	const app = document.getElementById("kt");
	const zustand = { station: null, typ: null };

	// ------------------------------------------------------------------ Hilfen
	function esc(t) {
		return String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	}
	function zahl(t) {
		const n = parseFloat(String(t || "").replace(",", "."));
		return isNaN(n) ? 0 : n;
	}
	function rund(n, s) { const f = Math.pow(10, s == null ? 3 : s); return Math.round(n * f) / f; }
	function kg(n) { return rund(n).toLocaleString("de-DE") + " kg"; }
	function stk(n, e) { return rund(n).toLocaleString("de-DE") + " " + (e || ""); }
	function ein(e) { return !e || e === "Kg" ? "kg" : e === "Nos" ? "Stk" : e; }
	function mg(n, e) { return !e || e === "Kg" ? kg(n) : stk(n, ein(e)); }
	// Menge (Lagereinheit) in gemischten Einheiten: „3 Paletten + 5 Karton“ (wie palette.zerlegen)
	function zerlegen(einheiten, menge) {
		const stufen = (einheiten || []).filter((e) => e.einheit !== "Lage");
		if (!stufen.length) return kg(menge);
		const mz = { Palette: "Paletten", Lage: "Lagen" };
		const n = (x, e) => rund(x).toLocaleString("de-DE") + " " + (rund(x) !== 1 && mz[e] ? mz[e] : e);
		if (menge <= 1e-6) return "0 " + (stufen.find((e) => e.einheit !== "Palette") || stufen[0]).einheit;
		const teile = [];
		for (let i = 0; i < stufen.length; i++) {
			const e = stufen[i];
			const letzte = i === stufen.length - 1 || (stufen[i + 1].faktor === 1 && e.faktor !== 1);
			if (letzte) { const x = Math.round((menge / e.faktor) * 100) / 100; if (x >= 0.05) teile.push(n(x, e.einheit)); break; }
			const x = Math.floor(menge / e.faktor + 1e-6);
			if (x) { teile.push(n(x, e.einheit)); menge = rund(menge - x * e.faktor, 6); }
			if (menge <= 1e-6) break;
		}
		return teile.join(" + ") || "0 " + (stufen.find((e) => e.einheit !== "Palette") || stufen[0]).einheit;
	}
	function textAus(html) {
		const d = document.createElement("div");
		d.innerHTML = html;
		return d.textContent || d.innerText || "";
	}
	let audio;
	function ton(ok) {
		try {
			audio = audio || new (window.AudioContext || window.webkitAudioContext)();
			const o = audio.createOscillator(), g = audio.createGain();
			o.frequency.value = ok ? 880 : 220;
			o.connect(g); g.connect(audio.destination);
			g.gain.value = 0.15;
			o.start(); o.stop(audio.currentTime + (ok ? 0.12 : 0.5));
		} catch (e) { /* kein Ton */ }
		if (navigator.vibrate) navigator.vibrate(ok ? 60 : [200, 80, 200]);
	}
	function speichern(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* privat */ } }
	function laden(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

	const BUCHUNGEN = /^(herstellen|linie_|palette|pruefung_erfassen|umlagern|lieferung|paket_lieferung|anbrechen|wareneingang|rework_erfassen|rework_linie$|silo_leer|behaelter_)/;
	// Anfrage-ID nur für Methoden, die der Server mit @einmalig schützt (terminal.py); Test test_anfrage_liste
	const MIT_ANFRAGE_ID = new Set(["anbrechen", "behaelter_reinigung", "etikett_drucken", "etikett_vormerken", "herstellen", "karton_abnehmen", "karton_auf_palette", "lieferung", "linie_beenden", "linie_lose", "linie_palette", "linie_rueckgabe", "linie_zufuehren", "paket_karton", "paket_lieferung", "palette_beladen", "palette_neu", "palette_umpacken", "palette_versandbereit", "pruefung_erfassen", "rework_erfassen", "rework_linie", "silo_leer", "umlagern", "wareneingang"]);
	async function api(methode, args) {
		let r;
		try {
			r = await apiRoh(methode, args);
		} catch (e) {
			if (e.name !== "TypeError") throw e; // fachlicher Fehler vom Server
			// Netzwerk weg (WLAN, Server): sichtbar machen
			kopfInfo.online = false;
			kopfZeigen();
			throw new Error("Keine Verbindung zum Server. Bitte auf dem Papierformular notieren und später nachbuchen.");
		}
		if (!kopfInfo.online) { kopfInfo.online = true; kopfZeigen(); }
		if (methode !== "kopfdaten" && BUCHUNGEN.test(methode)) setTimeout(kopfLaden, 400);
		return r;
	}
	// Doppelbuchung verhindern: eine Buchung behält ihre Anfrage-ID, bis sie geklappt hat. Geht die Antwort
	// unterwegs verloren und es wird nochmal getippt, liefert der Server das erste Ergebnis (anfrage.py).
	let anfrageId = null;
	function neueId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2); }
	async function apiRoh(methode, args) {
		const buchung = MIT_ANFRAGE_ID.has(methode);
		if (buchung && !anfrageId) anfrageId = neueId();
		const r = await fetch(API + methode, {
			method: "POST",
			headers: {
				"Content-Type": "application/json",
				Accept: "application/json",
				"X-Frappe-CSRF-Token": app.dataset.csrf || (window.frappe && frappe.csrf_token) || "",
				...(buchung ? { "X-KT-Anfrage": anfrageId } : {}),
			},
			body: JSON.stringify(args || {}),
		});
		if (buchung && r.ok) anfrageId = null;
		let daten = {};

	// Etiketten: auf den Netzwerkdrucker, der an der Terminal Station eingetragen ist (Abschnitt
	// „Etikettendrucker“), sonst wie bisher über den Browser. Geht der Drucker nicht: Meldung und Browserdruck.
	function browserDruck(url) { window.open(url, "_blank"); }
	let druckTimer;
	function druckHinweis(art, text, imBrowser) {
		let el = document.getElementById("druckhinweis");
		if (!el) { el = document.createElement("div"); el.id = "druckhinweis"; document.body.appendChild(el); }
		clearTimeout(druckTimer);
		el.innerHTML = art ? `<div class="meldung ${art}">${esc(text)}${imBrowser ? `<div class="reihe"><button class="knopf" data-d="browser">Im Browser drucken</button><button class="knopf" data-d="zu">Schließen</button></div>` : ""}</div>` : "";
		el.querySelectorAll("[data-d]").forEach((b) => b.addEventListener("click", () => { el.innerHTML = ""; if (b.dataset.d === "browser") imBrowser(); }));
		if (art === "rot") ton(false);
		else if (art) druckTimer = setTimeout(() => { el.innerHTML = ""; }, art === "gruen" ? 5000 : 20000);
	}
	// Nachdruck ohne Anlass (gleicher Inhalt, nicht Teil einer Buchung): das System fragt nach dem Grund.
	// Jeder Druck steht mit Grund im Protokoll „Etikettendruck“ (druckprotokoll.py).
	function grundFragen(r) {
		return new Promise((fertig) => {
			const d = document.createElement("div");
			d.className = "dialog";
			d.innerHTML = `<div class="panel"><h2>Warum nochmal drucken?</h2>
				<p class="fehlt">Dieses Etikett wurde schon gedruckt. Der Nachdruck wird mit Grund protokolliert.</p>
				<div class="reihe">${r.gruende.map((g) => `<button class="knopf" data-g="${esc(g.wert)}">${esc(g.text)}</button>`).join("")}</div>
				<div class="reihe"><button class="knopf" data-g="">Abbrechen</button></div></div>`;
			d.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => { d.remove(); fertig(b.dataset.g || null); }));
			document.body.appendChild(d);
		});
	}
	// grund: "ablauf" = Druck gehört zur Buchung; null = Nachdruck per Knopf (Server fragt ggf. nach dem Grund)
	async function druckeEtikett(art, args, url, grund) {
		const drucker = (zustand.drucker || {})[art];
		const daten = Object.assign({ station: zustand.station, art }, args, grund ? { grund } : {});
		const nochmal = async (r) => {
			druckHinweis("", "");
			const g = await grundFragen(r);
			return g ? druckeEtikett(art, args, url, g) : false;
		};
		const imBrowser = async () => {
			try {
				const v = await api("etikett_vormerken", daten);
				if (v.grund_noetig) return nochmal(v);
				browserDruck(url);
			} catch (e) { druckHinweis("rot", e.message); }
			return false;
		};
		if (!drucker) return imBrowser();
		druckHinweis("orange", "Druckt auf " + drucker + " …");
		try {
			const r = await api("etikett_drucken", daten);
			if (r.grund_noetig) return nochmal(r);
			druckHinweis("gruen", (r.etiketten > 1 ? r.etiketten + " Etiketten" : "Etikett") + " an " + r.drucker + " geschickt.");
			return true;
		} catch (e) {
			druckHinweis("rot", e.message, imBrowser);
			return false;
		}
	}
	function etikettDrucken(nve, grund = "ablauf", geprueft) {
		return druckeEtikett("palette", Object.assign({ nve }, geprueft !== undefined ? { geprueft } : {}), "/nve_etikett?nve=" + encodeURIComponent(nve) + "&druck=1", grund);
	}
	function etikettNachdrucken(nve) { return etikettDrucken(nve, null); }
	function kartonDrucken(anzahl) {
		druckeEtikett("karton", { anzahl }, "/karton_etikett?druck=1&station=" + encodeURIComponent(zustand.station) + "&anzahl=" + anzahl);
	}
	function gebindeDrucken(codes, grund = "ablauf") {
		const liste = [].concat(codes).join(",");
		return druckeEtikett("gebinde", { codes: liste }, "/gebinde_etikett?druck=1&codes=" + encodeURIComponent(liste), grund);
	}

	const UEBERSICHT = ["uebersicht", "Tagesübersicht", "Aufträge des Tages je Linie: Status, Fortschritt, Hinweise"];
	// Knöpfe aus den Funktionen der Station (in ERPNext unter Terminal Station einstellbar)
	function menue() {
		const f = zustand.funktionen || [];
		if (zustand.typ === "Verpackungs-PC") return [
			["vpc", "Linie verpacken", "Verpackungsauftrag der Backstraße: Karton auf Palette und lose Ware buchen"],
			["vpc_lose", "Lose Ware verpacken", "erst das Linienlager leer, sonst nach Bedarf aus dem Lager in Beutel / Karton"],
			["paletten", "Paletten", "Neue Palette, Etikett, umpacken"],
			["info", "Info-Scan", "Charge, Behälter oder Palette"],
			UEBERSICHT,
		];
		if (zustand.typ === "Paletten-Terminal") return [
			["einwickeln", "Palette einwickeln", "abschließen, NVE-Etikett, versandbereit ins Lager"],
			["paletten", "Paletten", "Neue Palette, Etikett, umpacken"],
			["info", "Info-Scan", "Charge, Behälter oder Palette"],
			UEBERSICHT,
		];
		const fw = zustand.nur_fertigware;
		const m = [];
		const kneter = f.includes("herstellen") && f.includes("linie");
		if (kneter) m.push(["herstellen", "Kneten", "Grundteig-Kübel und Zutaten → Teig direkt in den Former"]);
		else if (f.includes("herstellen")) m.push(["herstellen", fw ? "Verpacken" : "Herstellen", fw ? "Los mit MHD, nach Kundenauftrag, auf Palette" : (zustand.stufen || []).join(", ")]);
		if (f.includes("wareneingang")) m.push(["wareneingang", "Wareneingang", "Anlieferung buchen, ins Silo oder als Gebinde"]);
		if (f.includes("lieferung") && zustand.typ === "Herzen Verpackung") m.push(["dhl", "Lieferung (DHL)", "Pakete packen, wiegen, Lieferschein, Sendungsnummer"]);
		else if (f.includes("lieferung")) m.push(["lieferung", "Lieferung", "Paletten und Kartons an einen Kunden"]);
		if (f.includes("umlagern")) m.push(["umlagern", "Umlagern", zustand.umlager_ziel ? "in den Lagerverkauf oder zurück ins Lager" : "in ein anderes Lager oder in den Lagerverkauf"]);
		if (f.includes("paletten")) m.push(["paletten", "Paletten", "Neue Palette, Etikett, anbrechen, umpacken"]);
		if (f.includes("rework")) m.push(["rework", "Rework", "Behälter von der Linie wiegen: Sorte, kg, Etikett"]);
		if (zustand.vorraete) m.push(["anbrechen", "Karton anbrechen", "Neue Rolle / neuer Karton an den Tisch (Folie, Etikett, Schleife)"]);
		if (f.includes("silo")) m.push(["silo", zustand.vorraete ? "Leer melden" : "Silo leer melden", zustand.vorraete ? "Behälter oder Vorrat ist leer" : "Silo oder Tank ist leergefahren"]);
		if (f.includes("linie") && !kneter) m.push(["linie", "An die Linie", "Kübel einkippen, Füllung, Glasur, Schokolade nachfüllen"]);
		if (f.includes("packstation")) m.push(["packstation", "Packstation", "Auftrag, Anlage, Los, MHD, Kartonlabel"]);
		if (f.includes("palette_fertig")) m.push(["palette_fertig", "Palette fertig", "Kartons zählen, buchen, Palettenlabel"]);
		m.push(["info", "Info-Scan", "Charge, Behälter, Silo oder Palette"]);
		m.push(UEBERSICHT);
		return m;
	}

	// ------------------------------------------------------------------ Prüfungen (CP/CCP)
	function kennzeichenMarken(liste) {
		return (liste || []).map((k) => `<span class="marke ${k === "Bio" ? "gruen" : ""}">${esc(k === "Bio" ? "BIO" : k)}</span>`).join("");
	}
	function pruefFelder(plaene, praefix) {
		return (plaene || []).map((p, i) => {
			const id = praefix + i;
			let html = `<div class="panel" style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
				<b>${esc(p.frage)}</b><span class="marke ${p.lenkung === "CCP" ? "rot" : "orange"}">${esc(p.lenkung)}</span></div>
				<div class="fehlt" style="font-size:16px">Grenzwert: ${esc(p.grenzwert)}</div>`;
			if (p.art === "Messwert") html += zahlFeld(id, "Messwert" + (p.einheit ? " (" + esc(p.einheit) + ")" : ""));
			else if (p.art === "Ja/Nein") html += `<div class="einheiten" data-pw="${id}"><button type="button" data-pwv="1">✔ in Ordnung</button><button type="button" data-pwv="0">✖ nicht in Ordnung</button></div>`;
			else html += p.pruefkoerper.map((k, j) => `<div class="zeile"><div>${esc(k)}</div>
				<div class="einheiten" data-pw="${id}-${j}" style="margin:0;flex:0 0 440px"><button type="button" data-pwv="1">✔ erkannt</button><button type="button" data-pwv="0">✖ nicht erkannt</button></div></div>`).join("");
			return html + "</div>";
		}).join("");
	}
	app.addEventListener("click", (e) => {
		const b = e.target.closest("[data-pwv]");
		if (!b) return;
		const box = b.closest("[data-pw]");
		box.dataset.wert = b.dataset.pwv;
		box.querySelectorAll("button").forEach((x) => { x.classList.toggle("an", x === b); x.style.background = x === b && b.dataset.pwv === "0" ? "var(--rot)" : ""; });
	});
	function pruefWerte(plaene, praefix) {
		const out = {};
		(plaene || []).forEach((p, i) => {
			const id = praefix + i;
			if (p.art === "Messwert") {
				const f = document.getElementById(id);
				if (f && f.value !== "") out[p.pruefplan] = { wert: f.value };
			} else if (p.art === "Ja/Nein") {
				const b = app.querySelector(`[data-pw="${id}"]`);
				if (b && b.dataset.wert !== undefined) out[p.pruefplan] = { ok: b.dataset.wert === "1" };
			} else {
				const k = {};
				let alle = true;
				p.pruefkoerper.forEach((name, j) => {
					const b = app.querySelector(`[data-pw="${id}-${j}"]`);
					if (b && b.dataset.wert !== undefined) k[name] = b.dataset.wert === "1"; else alle = false;
				});
				if (alle) out[p.pruefplan] = { koerper: k };
			}
		});
		return out;
	}

	async function pruefLeiste() {
		const el = document.getElementById("pruef-leiste");
		if (!el) return;
		let liste = [];
		try { liste = await api("pruefungen_faellig", { station: zustand.station }); } catch (e) { return; }
		if (!liste.length) { el.innerHTML = ""; return; }
		const faellig = liste.filter((p) => p.faellig);
		el.innerHTML = faellig.map((p) => {
			const i = liste.indexOf(p);
			return `<button class="knopf ${p.sperrt ? "rot" : ""}" data-pr="${i}" style="margin-bottom:12px;${p.sperrt ? "" : "background:var(--orange);color:#111"}">Prüfung fällig: ${esc(p.titel)}
				<small style="color:inherit">${esc(p.lenkung)}${p.letzte_ok ? " · zuletzt bestanden " + esc(p.letzte_ok) : " · heute noch nicht geprüft"}${p.sperrt ? " · Buchen gesperrt, bis bestanden" : ""}</small></button>`;
		}).join("") + `<div class="fehlt" style="font-size:16px;margin:0 0 14px">${liste.filter((p) => !p.faellig).map((p) =>
			`✔ ${esc(p.titel)}: nächste um ${esc(p.faellig_ab)}${p.bald ? " (bald)" : ""}`).join(" · ")}</div>`;
		el.querySelectorAll("[data-pr]").forEach((b) => b.addEventListener("click", () => pruefDialog(liste[+b.dataset.pr])));
	}

	function pruefDialog(p) {
		app.innerHTML = kopf(p.titel, true) + pruefFelder([p], "pd") +
			(p.korrektur ? `<p class="fehlt">Bei Abweichung: ${esc(p.korrektur)}</p>` : "") +
			textFeld("bem", "Bemerkung / Korrekturmaßnahme (bei Abweichung Pflicht)") +
			`<div class="reihe"><button class="knopf gruen" data-a="speichern">Prüfung speichern</button></div>`;
		aktionen(async (a) => {
			if (a !== "speichern") return beiAllgemein(a);
			try {
				const r = await api("pruefung_erfassen", {
					station: zustand.station, pruefplan: p.pruefplan,
					eingabe: pruefWerte([p], "pd")[p.pruefplan] || {},
					bemerkung: document.getElementById("bem").value.trim() || null,
				});
				app.innerHTML = kopf(p.titel, true) + (r.ok
					? `<div class="meldung gruen">Bestanden<small>Protokoll ${esc(r.pruefung)}</small></div>`
					: `<div class="meldung rot">Abweichung<small>${esc(r.folge || "")}${r.gesperrt.length ? "<br>Gesperrt: " + r.gesperrt.map(esc).join(", ") : ""}<br>Protokoll ${esc(r.pruefung)}</small></div>`) +
					`<div class="reihe"><button class="knopf blau" data-a="zurueck">Fertig</button></div>`;
				ton(r.ok);
				aktionen(beiAllgemein);
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("pd0");
	}

			if (a === "packstation") return packstationStart();

	// ------------------------------------------------------------------ Suche in langen Listen
	// Ab 8 Einträgen bekommt eine Knopfliste ein Suchfeld; filtert beim Tippen (Scanner geht weiter ins Scanfeld).
	function suche(listeId) {
		const liste = document.getElementById(listeId);
		if (!liste || liste.children.length < 8 || document.getElementById(listeId + "-suche")) return;
		const f = document.createElement("input");
		f.id = listeId + "-suche";
		f.className = "feld";
		f.placeholder = "Suchen …";
		f.style.marginBottom = "12px";
		liste.parentNode.insertBefore(f, liste);
		f.addEventListener("input", () => {
			const t = f.value.trim().toLowerCase();
			[...liste.children].forEach((k) => { k.style.display = !t || k.textContent.toLowerCase().includes(t) ? "" : "none"; });
		});
	}

	// An die Linie: Kübel einkippen (Former), Gebinde nachfüllen
	async function linieStart() {
		let i;
		try { i = await api("linie_info", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		if (!i || !i.auftrag || i.status !== "Läuft") return auftragWaehlen("An die Linie", linieStart);
		const zutaten = i.zutaten.filter((z) => z.stufe !== "Packmittel").map((z) => `<div class="zeile"><div>${esc(z.name)}</div>
			<div class="rechts ${z.auf_linie > 0 ? "ok" : "fehlt"}">${esc(mg(z.auf_linie, z.einheit))} auf der Linie${z.reicht_fuer != null ? " · reicht für " + esc(mg(z.reicht_fuer, i.lagereinheit)) : ""}</div></div>`).join("");
		const kuebel = i.kuebel.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Nächste Kübel (ältester zuerst)</div>
			<div class="gross">${i.kuebel.map((k) => esc(k.code)).join(" · ")}</div>
			<div class="fehlt" style="font-size:16px">${i.kuebel.map((k) => esc(k.code + ": " + k.name + (k.datum ? " vom " + k.datum : "") + ", " + kg(k.menge))).join("<br>")}</div></div>` : "";
		app.innerHTML = kopf("An die Linie", true) + auftragKopf(i) + kuebel + `<div class="panel">${zutaten}</div>` +
			textFeld("scan", "Kübel, Gebinde oder Tank scannen") +
			zahlFeld("menge", "Menge (leer = ganzer Kübel)") +
			`<div class="reihe"><button class="knopf" data-a="retour">Retour ins Lager<small>Unbenutztes von der Linie zurück, z. B. halber Sack</small></button></div>`;
		aktionen((a) => {
			if (a === "pa-wechseln") return auftragWaehlen("An die Linie", linieStart);
			if (a === "retour") return retourStart(linieStart);
			beiAllgemein(a);
		});
		const zufuehren = async (code, menge, fefoGrund) => {
			try {
				const r = await api("linie_zufuehren", { station: zustand.station, code, menge, fefo_grund: fefoGrund || null });
				await linieStart();
				meldung("gruen", "Zugeführt: " + r.name + " " + mg(r.menge, r.einheit), (r.behaelter ? r.behaelter + " · " : "") + "Charge " + r.chargen.join(", "));
				ton(true);
				(r.hinweise || []).forEach((h) => app.querySelector("#meldung").insertAdjacentHTML("beforeend", `<div class="meldung orange">${esc(h)}</div>`));
			} catch (e) { meldung("rot", e.message); const f = document.getElementById("scan"); if (f) f.value = ""; }
		};
		enter("scan", async (code) => {
			if (!code) return;
			const menge = zahl(document.getElementById("menge").value) || null;
			// FEFO: ältere Charge im Lager? Dann Grund wählen (Pflicht laut Einstellung), sonst direkt zuführen
			let f = { aeltere: [] };
			try { f = await api("fefo_pruefen", { station: zustand.station, code }); } catch (e) { /* Fehler meldet das Zuführen */ }
			if (!f.aeltere.length) return zufuehren(code, menge, null);
			app.insertAdjacentHTML("beforeend", `<div class="panel" id="fefo-frage"><div class="meldung orange">Älteres MHD liegt im Lager<small>${esc(f.name + ": gescannt " + f.charge + ", älter " +
				f.aeltere.map((a) => a.charge + " (MHD " + a.mhd + ", " + mg(a.menge, "Kg") + ")").join(", "))}</small></div>
				<label>Besser die ältere Charge holen. Sonst Grund${f.pflicht ? "" : " (freiwillig)"}:</label>
				<div class="einheiten">${FEFO_GRUENDE.map((g) => `<button type="button" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
				<div class="reihe"><button class="knopf" data-g="">Abbrechen</button>${f.pflicht ? "" : `<button class="knopf" data-g="-">Ohne Grund zuführen</button>`}</div></div>`);
			const frage = document.getElementById("fefo-frage");
			frage.scrollIntoView({ block: "nearest" });
			frage.addEventListener("click", (ev) => {
				const b = ev.target.closest("[data-g]");
				if (!b) return;
				frage.remove();
				if (b.dataset.g === "") { document.getElementById("scan").value = ""; return fokus("scan"); }
				zufuehren(code, menge, b.dataset.g === "-" ? null : b.dataset.g);
			});
		});
		fokus("scan");
	}

	// Packstation: nur anzeigen, Kartonlabel drucken
	async function packstationStart() {
		let d;
		try { d = await api("packstation", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		if (!d || !d.auftrag) return auftragWaehlen("Packstation", packstationStart);
		app.innerHTML = kopf("Packstation", true) + auftragKopf(d) + `
			<div class="panel"><div class="zeile"><div>Verpackungsanlage</div><div class="rechts gross">${esc(d.verpackungsanlage || "–")}</div></div>
			<div class="zeile"><div>Beutel je Karton</div><div class="rechts gross">${esc(d.beutel_je_karton || "–")}</div></div>
			<div class="zeile"><div>Los</div><div class="rechts gross">${esc(d.los_vorschau || "–")}</div></div>
			<div class="zeile"><div>MHD</div><div class="rechts gross">${esc(d.mhd_vorschau || "–")}</div></div>
			<div class="zeile"><div>Noch offen</div><div class="rechts">${esc(d.offen_text)}</div></div></div>` +
			zahlFeld("anzahl", "Wie viele Kartonlabel?", 20) +
			`<div class="reihe"><button class="knopf gruen" data-a="label">Kartonlabel drucken</button><button class="knopf" data-a="neu">Aktualisieren</button></div>`;
		aktionen((a) => {
			if (a === "pa-wechseln") return auftragWaehlen("Packstation", packstationStart);
			if (a === "neu") return packstationStart();
			if (a === "label") return kartonDrucken(Math.max(1, Math.round(zahl(document.getElementById("anzahl").value))));
			beiAllgemein(a);
		});
	}

	// ------------------------------------------------------------------ Verpackungs-PC an der Linie
	// Zeigt den Verpackungsauftrag (Spezifikation, Anlage, Beutel je Karton, Los, MHD) und bucht, was wirklich
	// verpackt wurde: Karton auf eine Palette (jede Palette hat eine NVE) und lose Ware in Kisten. Beliebig oft.
	async function vpcStart(hinweis) {
		let d;
		try { d = await api("packstation", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		if (!d || !d.auftrag || d.status !== "Läuft") return auftragWaehlen("Verpacken", vpcStart);
		const spez = d.spezifikation ? (/^https?:/.test(d.spezifikation)
			? `<a href="${esc(d.spezifikation)}" target="_blank" rel="noopener">Spezifikation öffnen</a>` : esc(d.spezifikation)) : "–";
		app.innerHTML = kopf("Verpacken: " + d.name, true) + auftragKopf(d) + `
			<div class="position"><div class="titel"><b>Verpackungsauftrag</b><span>${d.kunde ? esc(d.kunde) : "Lager"}</span></div>
				<div class="wert">Los<div>${esc(d.los_vorschau || "–")}</div></div>
				<div class="wert">MHD<div style="font-size:34px">${esc(d.mhd_vorschau || "–")}</div></div>
				<div class="wert">Anlage<div style="font-size:30px">${esc(d.verpackungsanlage || "–")}</div></div>
				<div class="wert">Beutel je Karton<div>${esc(d.beutel_je_karton || "–")}</div></div>
				<div class="wert">Karton je Palette<div>${esc(d.karton_je_palette || "–")}</div></div>
				<div class="wert">Spezifikation<div style="font-size:20px">${spez}</div></div></div>
			${linienlagerPanel(d)}
			<div class="reihe"><button class="knopf gruen" data-a="karton">Karton auf Palette buchen<small>gebucht bisher ${esc(d.gebucht_text)} von ${esc(d.menge_text)}</small></button>
				${d.lose_artikel ? `<button class="knopf blau" data-a="lose">Lose Ware buchen<small>${esc(d.lose_name)} im ${esc(ein(d.lose_einheit))} ins Lager oder Linienlager</small></button>` : ""}</div>
			<div class="reihe"><button class="knopf" data-a="label">Kartonetiketten drucken</button><button class="knopf" data-a="beenden">Auftrag beenden</button></div>
			<div class="reiter"><button class="an" type="button">Registrierungen</button></div><div class="panel" style="margin-top:0" id="registrierungen">Lädt …</div>`;
		if (hinweis) meldung("gruen", hinweis);
		registrierungenLaden({ produktionsauftrag: d.auftrag });
		aktionen(async (a) => {
			if (a === "pa-wechseln") return auftragWaehlen("Verpacken", vpcStart);
			if (a === "karton") return paletteFertigStart(vpcStart);
			if (a === "lose") return loseBuchen(d);
			if (a === "linienlager-verpacken") return schnellStart(true);
			if (a === "label") return kartonDrucken(d.karton_je_palette || 20);
			if (a === "beenden") { const i = await api("linie_info", { station: zustand.station }); return auftragBeenden(i); }
			beiAllgemein(a);
		});
	}

	// Was im Linienlager auf die Verpackung wartet (Wannen werden nicht gebucht)
	function linienlagerPanel(d) {
		if (!d.linienlager) return "";
		const l = d.im_linienlager || [];
		if (!l.length) return `<div class="panel"><b>Linienlager</b> <span class="fehlt">leer · Wannen sind nicht gebucht, bitte heute noch leer fahren</span></div>`;
		return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b>Linienlager: wartet auf die Verpackung</b>
			<button class="knopf blau" style="min-height:0;padding:10px 18px" data-a="linienlager-verpacken">Jetzt verpacken</button></div>
			${l.map((z) => `<div class="zeile"><div>${esc(z.name)} · ${esc(z.charge)}</div><div class="rechts ${z.alt ? "fehlt" : ""}">${esc(z.menge_text)} · seit ${esc(z.seit)}</div></div>`).join("")}</div>`;
	}

	// Lose Ware vom laufenden Auftrag: Kartons (kg je Karton fest) ins Lager auf Palette (F5) oder ins Linienlager (F6)
	async function loseBuchen(d) {
		let ziel = "lager";
		const je = d.lose_je_einheit && d.lose_einheit !== "Kg" ? ` (${zahlText(d.lose_je_einheit)} kg je ${esc(ein(d.lose_einheit))})` : "";
		app.innerHTML = kopf("Lose Ware: " + d.lose_name, true) + auftragKopf(d) +
			`<div class="einheiten" id="ziele"><button type="button" class="an" data-a="ziel" data-z="lager">Ins Lager<small> parallel abgenommen</small></button>` +
			(d.linienlager ? `<button type="button" data-a="ziel" data-z="linienlager">Ins Linienlager<small> Verpackung kommt nicht nach</small></button>` : "") + `</div>` +
			zahlFeld("anzahl", `Wie viele ${esc(ein(d.lose_einheit || "Kg"))}?${je}`) +
			`<div id="pal-feld">${textFeld("scan", "Palette scannen (leer = neue Palette)")}</div>` +
			`<div class="reihe"><button class="knopf" data-a="zurueck-vpc">← Zurück</button><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		aktionen(async (a, x) => {
			if (a === "zurueck-vpc") return vpcStart();
			if (a === "ziel") {
				ziel = x.z;
				app.querySelectorAll("#ziele button").forEach((b) => b.classList.toggle("an", b.dataset.z === ziel));
				document.getElementById("pal-feld").hidden = ziel !== "lager";
				return fokus("anzahl");
			}
			if (a !== "buchen") return beiAllgemein(a);
			const knopf = app.querySelector('[data-a="buchen"]');
			knopf.disabled = true; knopf.textContent = "Bucht …";
			try {
				let palette = null;
				if (ziel === "lager") {
					palette = document.getElementById("scan").value.trim();
					if (!palette) palette = (await api("palette_neu", { station: zustand.station, typ: "Lagerpalette" })).nve;
				}
				const e = await api("linie_lose", { station: zustand.station, anzahl: zahl(document.getElementById("anzahl").value), einheit: d.lose_einheit, ziel, palette });
				if (e.palette) etikettDrucken(e.palette);
				ergebnis(e.name, ["Charge: " + e.charge, "Menge: " + stk(e.anzahl, ein(e.einheit)) + (e.einheit !== "Kg" ? " (" + kg(e.menge) + ")" : ""),
					e.ziel === "linienlager" ? "Ins Linienlager, wird später verpackt" : "Ins Lager" + (e.palette ? " auf Palette " + e.palette : ""),
					e.mhd ? "Verwendbar bis: " + e.mhd : "", e.gesperrt ? "Gesperrt bis zur Freigabe durch die QS" : "",
					"Verbraucht: " + e.verbraucht.map((v) => v.name + " " + v.charge).join(", ")].filter(Boolean),
					e.hinweise, `<button class="knopf gruen" data-a="weiter">Zurück zum Auftrag</button>`)((b) => (b === "weiter" ? vpcStart() : beiAllgemein(b)));
			} catch (err) { knopf.disabled = false; knopf.textContent = "Buchen"; meldung("rot", err.message); }
		});
		const buchen = () => app.querySelector('[data-a="buchen"]').click();
		enter("anzahl", () => (ziel === "lager" ? fokus("scan") : buchen()));
		enter("scan", buchen);
		fokus("anzahl");
	}

	// ------------------------------------------------------------------ Paketversand DHL (Herzenboden)
	async function dhlStart() {
		app.innerHTML = kopf("Lieferung (DHL)", true) + `<p><b>Offene Aufträge</b> – Zeile antippen</p><div id="dhl">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = (await api("auftraege", { station: zustand.station })).map((z) => ({ ...z, offen: Math.max(rund(z.menge - z.geliefert), 0) })).filter((z) => z.offen > 0);
			suchListe("dhl", [["Auftrag", "auftrag"], ["Kunde", "kundenname"], ["Artikel", "name"], ["Bestellt", (z) => zahlText(z.menge), 1],
				["Geliefert", (z) => zahlText(z.geliefert), 1], ["Offen", (z) => zahlText(z.offen), 1], ["Termin", "termin"]],
				liste, (z) => dhlErfassen(z), "Suchen: Kunde, Auftrag, Artikel …");
		} catch (e) { meldung("rot", e.message); }
	}

	async function dhlErfassen(z) {
		app.innerHTML = kopf("DHL: " + z.kundenname, true) +
			`<div class="panel"><b>${esc(z.name)}</b> · Auftrag ${esc(z.auftrag)} · offen ${esc(zahlText(z.offen))} Stk<div id="dhl-info" class="fehlt" style="font-size:16px"></div></div>` +
			`<div class="reihe" style="margin-top:0"><div>${zahlFeld("stk", "Stück im Paket bzw. in allen Paketen", z.offen)}</div><div>${zahlFeld("pakete", "Anzahl Pakete", 1)}</div></div>
			<div id="gewichte"></div>` + textFeld("sendung", "Sendungsnummer (optional, vom DHL-Label scannen – geht auch später)") +
			`<div class="reihe"><button class="knopf" data-a="zurueck-dhl">← Aufträge</button><button class="knopf gruen" data-a="buchen">Lieferschein buchen</button></div>
			<div class="reihe"><button class="knopf blau" data-a="kartons">Pakete als Versandkarton mit NVE<small>je Paket eigene NVE und Etikett, Sendungsnummer je Karton</small></button></div>`;
		let erwartet = null;
		const neu = async () => {
			const stk = zahl(document.getElementById("stk").value), n = Math.max(1, Math.min(20, Math.round(zahl(document.getElementById("pakete").value) || 1)));
			try {
				const v = await api("paket_vorschlag", { station: zustand.station, artikel: z.artikel, stueck: stk, pakete: n });
				erwartet = v.erwartet_kg;
				document.getElementById("dhl-info").textContent = `Verpackt im Lager: ${zahlText(v.verfuegbar)} Stk` + (erwartet ? ` · erwartet etwa ${zahlText(erwartet)} kg gesamt` : " · Stückgewicht am Artikel fehlt");
			} catch (e) { /* nur Info */ }
			// von Hand eingetragene Gewichte bleiben, sonst Vorschlag aus dem Stückgewicht
			const alt = [...document.querySelectorAll("#gewichte input")].map((f) => (f.dataset.hand ? f.value : ""));
			document.getElementById("gewichte").innerHTML = Array.from({ length: n }, (_, i) =>
				zahlFeld("gw" + i, `Paket ${i + 1}: Gewicht von der Paketwaage (kg)`, alt[i] || (erwartet ? rund(erwartet / n, 2) : ""))).join("");
			document.querySelectorAll("#gewichte input").forEach((f, i) => { if (alt[i]) f.dataset.hand = "1"; f.addEventListener("input", () => { f.dataset.hand = "1"; }); });
		};
		document.getElementById("stk").addEventListener("change", neu);
		document.getElementById("pakete").addEventListener("change", neu);
		enter("pakete", neu);
		await neu();
		aktionen(async (a) => {
			if (a === "zurueck-dhl") return dhlStart();
			if (a === "kartons") return dhlKartons(z, []);
			if (a !== "buchen") return beiAllgemein(a);
			const gewichte = [...document.querySelectorAll("#gewichte input")].map((f) => zahl(f.value));
			try {
				const e = await api("paket_lieferung", { station: zustand.station, kundenauftrag: z.auftrag, artikel: z.artikel,
					stueck: zahl(document.getElementById("stk").value), gewichte, sendungsnummer: document.getElementById("sendung").value.trim() || null });
				ergebnis("Lieferung " + e.kunde, ["Lieferschein: " + e.lieferschein, "Pakete: " + e.pakete + ", gewogen " + zahlText(e.gewicht_kg) + " kg",
					"Lose: " + e.lose.join(", "), e.adresse ? "Adresse: " + e.adresse.replace(/\n/g, ", ") : "Adresse fehlt im Kundenstamm"], e.hinweise,
					`<button class="knopf" data-a="sendung">Sendungsnummer scannen</button><button class="knopf" data-a="weiter">Nächste Lieferung</button>`)((b) => {
					if (b === "sendung") return sendungScannen(e.lieferschein);
					if (b === "weiter") return dhlStart();
					beiAllgemein(b);
				});
			} catch (err) { meldung("rot", err.message); }
		});
	}

	// DHL mit NVE: jedes Paket ist ein Versandkarton (eigene NVE, Etikett), danach ein Lieferschein für alle
	function dhlKartons(z, liste) {
		const gepackt = liste.reduce((n, k) => n + (k.stueck || 0), 0);
		const rest = Math.max(rund(z.offen - gepackt), 0);
		app.innerHTML = kopf("DHL mit NVE: " + z.kundenname, true) +
			`<div class="panel"><b>${esc(z.name)}</b> · Auftrag ${esc(z.auftrag)} · offen ${esc(zahlText(z.offen))} Stk${gepackt ? ` · gepackt ${esc(zahlText(gepackt))} Stk` : ""}</div>` +
			`<div class="reihe" style="margin-top:0"><div>${zahlFeld("stk", "Stück in diesem Paket", rest || "")}</div><div>${zahlFeld("gw", "Gewicht von der Paketwaage (kg)")}</div></div>
			<div class="reihe"><button class="knopf blau" data-a="packen">Paket packen<small>neuer Versandkarton, Etikett wird gedruckt</small></button></div>` +
			textFeld("scan", "oder einen fertigen Versandkarton scannen") +
			(liste.length ? `<div class="panel">${liste.map((k, i) => `<div class="zeile"><div>Versandkarton …${esc(k.nve.slice(-6))}<br><small class="fehlt">${esc(k.kartons || "")}</small></div>
				<div class="rechts">${k.gewicht_kg ? esc(zahlText(k.gewicht_kg)) + " kg" : ""} <button class="x" data-a="weg" data-i="${i}">✕</button></div></div>`).join("")}</div>` +
				textFeld("sendung", "Sendungsnummer (optional, vom DHL-Label scannen – geht auch später, je Paket)") : "") +
			`<div class="reihe"><button class="knopf" data-a="zurueck-dhl">← Zurück</button>${liste.length ? `<button class="knopf gruen" data-a="buchen">Lieferschein buchen (${liste.length} Pakete)</button>` : ""}</div>`;
		aktionen(async (a, d) => {
			if (a === "zurueck-dhl" || a === "zurueck") return dhlErfassen(z);
			if (a === "weg") { liste.splice(+d.i, 1); return dhlKartons(z, liste); }
			if (a === "packen") {
				try {
					const stueck = zahl(document.getElementById("stk").value);
					const k = await api("paket_karton", { station: zustand.station, kundenauftrag: z.auftrag, artikel: z.artikel, stueck, gewicht: zahl(document.getElementById("gw").value) || null });
					etikettDrucken(k.nve);
					liste.push({ ...k, stueck });
					dhlKartons(z, liste);
					return meldung("gruen", "Paket gepackt: Versandkarton …" + k.nve.slice(-6), "Etikett wird gedruckt.");
				} catch (e) { return meldung("rot", e.message); }
			}
			if (a === "buchen") {
				try {
					const e = await api("paket_lieferung", { station: zustand.station, kundenauftrag: z.auftrag, kartons: liste.map((k) => k.nve),
						sendungsnummer: (document.getElementById("sendung") || {}).value || null });
					ergebnis("Lieferung " + e.kunde, ["Lieferschein: " + e.lieferschein, "Pakete: " + e.pakete + (e.gewicht_kg ? ", gewogen " + zahlText(e.gewicht_kg) + " kg" : ""),
						"Versandkartons: " + e.versandkartons.map((n) => "…" + n.slice(-6)).join(", "), "Lose: " + e.lose.join(", "),
						e.adresse ? "Adresse: " + e.adresse.replace(/\n/g, ", ") : "Adresse fehlt im Kundenstamm"], e.hinweise,
						`<button class="knopf" data-a="sendung">Sendungsnummern scannen</button><button class="knopf" data-a="weiter">Nächste Lieferung</button>`)((b) => {
						if (b === "sendung") return sendungScannen(e.lieferschein);
						if (b === "weiter") return dhlStart();
						beiAllgemein(b);
					});
				} catch (err) { meldung("rot", err.message); }
				return;
			}
			beiAllgemein(a);
		});
		enter("scan", async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ !== "palette" || !i.versandkarton) throw new Error("Bitte einen Versandkarton scannen.");
				if (liste.some((k) => k.nve === i.nve)) throw new Error("Dieser Versandkarton ist schon dabei.");
				liste.push(i);
				dhlKartons(z, liste);
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("stk");
	}

	function sendungScannen(lieferschein, liste) {
		app.innerHTML = kopf("Sendungsnummer " + lieferschein, true) + textFeld("scan", "DHL-Label scannen (je Paket einmal)") +
			(liste && liste.length ? `<div class="panel">${liste.map((x) => `<div class="zeile"><div>${esc(x)}</div></div>`).join("")}</div>` : "") +
			`<div class="reihe"><button class="knopf gruen" data-a="fertig">Fertig</button></div>`;
		aktionen((a) => (a === "fertig" ? dhlStart() : beiAllgemein(a)));
		enter("scan", async (v) => {
			if (!v) return;
			try { const r = await api("sendungsnummer", { station: zustand.station, lieferschein, nummer: v }); sendungScannen(lieferschein, r.sendungsnummern); meldung("gruen", "Sendungsnummer gespeichert"); }
			catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	// Paletten-Terminal: Palette eingewickelt → abschließen, NVE-Etikett, versandbereit
	async function einwickelnStart(hinweis) {
		app.innerHTML = kopf("Palette einwickeln", true) + textFeld("scan", "Palette scannen (NVE) – oder unten antippen") + `<div id="pal">Lädt …</div>`;
		if (hinweis) meldung("gruen", hinweis);
		aktionen(beiAllgemein);
		const fertig = async (nve) => {
			try {
				const p = await api("palette_versandbereit", { station: zustand.station, palette: nve });
				etikettDrucken(p.nve);
				einwickelnStart("Palette " + p.nve + " versandbereit, Etikett wird gedruckt.");
			} catch (e) { meldung("rot", e.message); }
		};
		enter("scan", (v) => v && fertig(v));
		fokus("scan");
		try {
			const liste = await api("offene_paletten", { station: zustand.station });
			suchListe("pal", [["NVE", (p) => "…" + p.nve.slice(-6)], ["Art", "typ"], ["Inhalt", "inhalt"], ["Lose", "lose"], ["Kunde", (p) => p.kunde || ""]],
				liste, (p) => fertig(p.nve), "Suchen: NVE, Los, Inhalt …");
		} catch (e) { meldung("rot", e.message); }
	}

	// Palette fertig: Kartons zählen, buchen
	async function paletteFertigStart(zurueckZu) {
		const zurueck = typeof zurueckZu === "function" ? zurueckZu : null;
		let i;
		try { i = await api("linie_info", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		if (!i || !i.auftrag || i.status !== "Läuft") return auftragWaehlen("Palette fertig", zurueck || paletteFertigStart);
		const einheiten = (i.einheiten || []).filter((e) => e.einheit !== "Palette" && e.einheit !== "Lage");
		let einheit = (einheiten.find((e) => e.einheit === "Karton") || einheiten[0] || { einheit: "Kg" }).einheit;
		app.innerHTML = kopf(zurueck ? "Karton auf Palette" : "Palette fertig", true) + auftragKopf(i) + einheitWahl(einheiten, einheit, i.lagereinheit) +
			zahlFeld("anzahl", `Wie viele <span id="einheit-text">${esc(einheit)}</span> auf der Palette?`) +
			textFeld("scan", "Palette scannen (leer = neue Palette)") +
			`<div class="reihe"><button class="knopf gruen" data-a="buchen">Buchen</button><button class="knopf" data-a="beenden">Auftrag beenden</button></div>`;
		aktionen(async (a, d) => {
			if (a === "pa-wechseln") return auftragWaehlen("Palette fertig", zurueck || paletteFertigStart);
			if (a === "zurueck" && zurueck) return zurueck();
			if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("anzahl"); }
			if (a === "beenden") return auftragBeenden(i);
			if (a !== "buchen") return beiAllgemein(a);
			const knopf = app.querySelector('[data-a="buchen"]');
			knopf.disabled = true; knopf.textContent = "Bucht …";
			try {
				let palette = document.getElementById("scan").value.trim();
				if (!palette) palette = (await api("palette_neu", { station: zustand.station, typ: "Lagerpalette" })).nve;
				const e = await api("linie_palette", { station: zustand.station, anzahl: zahl(document.getElementById("anzahl").value), einheit, palette });
				etikettDrucken(e.palette);
				ergebnis(e.name, [
					"Los: " + e.los, "Menge: " + stk(e.anzahl, ein(e.einheit)) + (e.einheit !== i.lagereinheit ? " (" + mg(e.menge, i.lagereinheit) + ")" : ""), "Palette: " + e.palette,
					e.mhd ? "MHD: " + e.mhd : "", e.kennzeichen ? "Kennzeichen: " + e.kennzeichen : "",
					"Auftrag gesamt: " + e.gebucht_text, "Verbraucht: " + e.verbraucht.map((v) => v.name + " " + v.charge).join(", "),
				].filter(Boolean), e.hinweise, `<button class="knopf" data-a="etikett">Palettenlabel nochmal</button><button class="knopf" data-a="weiter">Nächste Palette</button>`)((a2) => {
					if (a2 === "etikett") return etikettNachdrucken(e.palette);
					if (a2 === "weiter") return zurueck ? zurueck() : paletteFertigStart();
					beiAllgemein(a2);
				});
			} catch (err) { knopf.disabled = false; knopf.textContent = "Buchen"; meldung("rot", err.message); }
		});
		fokus("anzahl");
	}

	function auftragBeenden(i) {
		const rest = i.zutaten.filter((z) => z.auf_linie > 0);
		app.innerHTML = kopf("Auftrag beenden", true) + auftragKopf(i) +
			(rest.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Rest auf der Linie wird als Linienrest ausgebucht (Bruch, Biogas). Wannen vorher leer verpacken!</div>${rest.map((z) => `<div class="zeile"><div>${esc(z.name)}</div><div class="rechts">${esc(mg(z.auf_linie, z.einheit))}</div></div>`).join("")}</div>` : `<p>Nichts mehr auf der Linie.</p>`) +
			(rest.length ? `<div class="reihe"><button class="knopf blau" data-a="retour">Erst Unbenutztes zurück ins Lager<small>Retour: Säcke, Gebinde, Packmittel</small></button></div>` : "") +
			`<div class="reihe"><button class="knopf" data-a="zurueck-pf">← Zurück</button><button class="knopf gruen" data-a="ja">Auftrag beenden</button></div>`;
		aktionen(async (a) => {
			if (a === "zurueck-pf") return paletteFertigStart();
			if (a === "retour") return retourStart(async () => auftragBeenden(await api("linie_info", { station: zustand.station })));
			if (a !== "ja") return beiAllgemein(a);
			try {
				const r = await api("linie_beenden", { station: zustand.station, auftrag: i.auftrag });
				ergebnis(i.name, ["Auftrag " + r.auftrag + " beendet", ...r.rest.map((z) => "Linienrest: " + z.name + " " + z.charge + " " + rund(z.menge))], [])(beiAllgemein);
			} catch (e) { meldung("rot", e.message); }
		});
	}

	function ergebnis(titel, zeilen, hinweise, extra) {
		app.innerHTML = kopf(titel, true) + `
			<div class="meldung gruen">Gebucht<small>${zeilen.map(esc).join("<br>")}</small></div>
			${(hinweise || []).map((h) => `<div class="meldung orange">${esc(h)}</div>`).join("")}
			<div class="reihe">${extra || ""}<button class="knopf blau" data-a="zurueck">Fertig</button></div>`;
		ton(true);
		return aktionen;
	}

	// ------------------------------------------------------------------ Retour von der Linie
	// Was an die Linie gegeben, aber nicht verbraucht wurde, geht zurück in das Lager, aus dem es kam. Sonst würde
	// es beim Auftragsende als Linienrest ausgebucht und Bestand und Mengenbilanz stimmten nicht.
	async function retourStart(zurueck, hinweis) {
		app.innerHTML = kopf("Retour ins Lager", true) + `<div id="retour">Lädt …</div>`;
		aktionen((a) => (a === "zurueck" ? zurueck() : beiAllgemein(a)));
		if (hinweis) meldung("gruen", hinweis);
		let liste;
		try { liste = await api("linie_retour_liste", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		const el = document.getElementById("retour");
		if (!liste.length) { el.innerHTML = `<p class="fehlt">Auf der Linie liegen keine Rohstoffe oder Packmittel dieses Auftrags.</p>`; return; }
		el.innerHTML = `<p>Was geht zurück? Zeile antippen</p>` + tabelle([["Artikel", "name"], ["Charge", "charge"], ["Auf der Linie", (z) => mg(z.menge, z.einheit), 1],
			["Zurück nach", (z) => z.silo ? "– (aus dem Silo)" : z.ziel_name || "–"]], liste, "zeile");
		aktionen((a, d) => {
			if (a === "zurueck") return zurueck();
			if (a !== "zeile") return beiAllgemein(a);
			const z = liste[+d.i];
			if (z.silo || !z.ziel) return meldung("orange", z.name + " kam aus dem Silo und kann nicht zurück.");
			retourMenge(z, zurueck);
		});
	}
	function retourMenge(z, zurueck) {
		app.innerHTML = kopf("Retour: " + z.name, true) +
			`<div class="panel"><div class="zeile"><div>Charge</div><div class="rechts">${esc(z.charge)}</div></div>
			<div class="zeile"><div>Auf der Linie</div><div class="rechts">${esc(mg(z.menge, z.einheit))}</div></div>
			<div class="zeile"><div>Zurück nach</div><div class="rechts">${esc(z.ziel_name)}</div></div></div>` +
			zahlFeld("menge", `Wie viel geht zurück (${esc(ein(z.einheit))})?`, z.menge) +
			`<div class="reihe"><button class="knopf" data-a="zur-liste">← Liste</button><button class="knopf gruen" data-a="buchen">Zurück ins Lager buchen</button></div>`;
		const buchen = async () => {
			try {
				const r = await api("linie_rueckgabe", { station: zustand.station, charge: z.charge, menge: zahl(document.getElementById("menge").value) });
				ton(true);
				retourStart(zurueck, "Zurück ins Lager: " + r.name + " " + mg(r.menge, r.einheit) + " nach " + r.ziel);
			} catch (e) { meldung("rot", e.message); }
		};
		aktionen((a) => {
			if (a === "zur-liste" || a === "zurueck") return retourStart(zurueck);
			if (a === "buchen") return buchen();
			beiAllgemein(a);
		});
		enter("menge", buchen);
		fokus("menge");
	}

	// ------------------------------------------------------------------ Tagesübersicht
	// Aufträge des Tages je Linie mit Status, Fortschritt und Hinweis – wie der Orderblock bei FOBIS
	const PA_FARBE = { "Läuft": "gruen", Freigegeben: "orange", Geplant: "", Fertig: "", Abgebrochen: "rot" };
	async function tagesuebersicht(datum) {
		app.innerHTML = kopf("Tagesübersicht", true) + `<div id="tag">Lädt …</div>`;
		aktionen(beiAllgemein);
		let t;
		try { t = await api("tagesuebersicht", { station: zustand.station, datum: datum || null }); } catch (e) { return meldung("rot", e.message); }
		const tagVerschieben = (n) => { const d = new Date(t.datum_iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
		document.getElementById("tag").innerHTML =
			`<div class="reihe"><button class="knopf klein" data-a="tag" data-d="${tagVerschieben(-1)}">← Vortag</button>
				<div style="flex:2 1 260px;text-align:center"><div class="gross">${esc(t.datum)}${t.heute ? " · heute" : ""}</div>
				<div class="fehlt" style="font-size:16px">Offen ${t.offen} · Fertig ${t.fertig}</div></div>
				<button class="knopf klein" data-a="tag" data-d="${tagVerschieben(1)}">Folgetag →</button></div>` +
			(t.linien.length ? t.linien.map((l) => `<h2 style="margin:18px 0 0">${esc(l.linie)} <span class="fehlt" style="font-size:16px;font-weight:400">offen ${l.offen} · fertig ${l.fertig}</span></h2>
				<table class="tab"><thead><tr><th>Status</th><th>Auftrag</th><th>Artikel</th><th>Kunde</th><th class="z">Bestellt</th><th class="z">Gebucht</th></tr></thead><tbody>
				${l.auftraege.map((a) => `<tr><td><span class="marke ${PA_FARBE[a.status] || ""}" style="margin:0">${esc(a.status)}</span>${a.vortag ? `<small class="fehlt" style="display:block;font-size:14px">vom ${esc(a.datum)}</small>` : ""}</td>
					<td>${esc(a.auftrag)}</td><td>${esc(a.name)}${a.hinweis ? `<div class="hinweis-buero" style="font-size:17px;padding:6px 10px;margin:6px 0 0">${esc(a.hinweis)}</div>` : ""}</td>
					<td>${esc(a.kunde || "Lager")}</td><td class="z">${esc(a.menge_text)}</td>
					<td class="z">${esc(a.gebucht_text)}<div class="balken"><div style="width:${Math.round(a.anteil * 100)}%"></div></div></td></tr>`).join("")}
				</tbody></table>`).join("")
				: `<p class="fehlt">An diesem Tag sind keine Produktionsaufträge geplant.</p>`) +
			`<div class="reihe"><button class="knopf" data-a="tag" data-d="">Heute</button><button class="knopf" data-a="neu">Aktualisieren</button></div>`;
		aktionen((a, d) => {
			if (a === "tag") return tagesuebersicht(d.d || null);
			if (a === "neu") return tagesuebersicht(t.datum_iso);
			beiAllgemein(a);
		});
	}

	// ------------------------------------------------------------------ Herstellen / Verpacken
	let ansatz;
	let auftragsListe = [];
	// ------------------------------------------------------------------ Schnell buchen (ohne Scannen)
	// Herzenboden: offene Kundenaufträge antippen → Anzahl → Buchen. Manuelles Verpacken: was im Lager zum
	// Verpacken liegt antippen → Anzahl Karton → Buchen. Verbraucht wird automatisch (älteste zuerst);
	// fehlt etwas, kommt die Zutatenliste zum Selbst-Auswählen.
	async function herstellenStart() {
		if (zustand.vorschlagen) return schnellStart();
		return herstellenListe();
	}

	async function schnellStart(nurLose) {
		const fw = zustand.nur_fertigware;
		const nachAuftrag = !!zustand.linie && !nurLose;
		app.innerHTML = kopf(fw ? "Verpacken" : "Herstellen", true) +
			`<p><b>${nachAuftrag ? "Offene Aufträge" : "Liegt zum Verpacken im Lager"}</b> – Zeile antippen</p><div id="aufg">Lädt …</div>
			<div class="reihe"><button class="knopf" data-a="klassisch">Ohne Auftrag${fw ? "" : " (z. B. Zuckerguss anmischen)"}</button></div>`;
		aktionen((a) => (a === "klassisch" ? herstellenListe() : beiAllgemein(a)));
		zustand.zurueckZu = () => schnellStart(nurLose);
		try {
			if (nachAuftrag) {
				const liste = await api("aufgaben", { station: zustand.station });
				suchListe("aufg", [["Auftrag", "auftrag"], ["Kunde", "kunde"], ["Artikel", "name"],
					["Bestellt", (a) => zahlText(a.bestellt), 1], ["Erledigt", (a) => zahlText(a.erledigt), 1], ["ToDo", (a) => zahlText(a.todo), 1],
					["Vorrat", (a) => !a.vorstufe ? "" : (a.vorrat_eigen ? zahlText(a.vorrat_eigen) + " für Auftrag" + (a.vorrat_frei ? " + " + zahlText(a.vorrat_frei) + " frei" : "") : zahlText(a.verfuegbar)) + " " + a.vorstufe, 1], ["Termin", "termin"],
					...(liste.some((a) => a.hinweis) ? [["Hinweis", (a) => a.hinweis || ""]] : [])],
					liste, (a) => schnellAnzahl(a), "Suchen: Kunde, Auftrag, Artikel …");
			} else {
				const liste = await api("zum_verpacken", { station: zustand.station });
				suchListe("aufg", [["Wo", (q) => q.linienlager ? "Linienlager" : "Lager"], ["Ware", "name"], ["Kiste / Charge", (q) => q.behaelter ? "Kiste " + q.behaelter : q.charge],
					["Backtag", "backtag"], ["MHD", (q) => q.mhd || ""], ["Menge", (q) => q.menge_text || mg(q.menge, q.einheit), 1]],
					liste, (q) => zielWaehlen(q), "Suchen: Ware, Kiste, Charge …");
			}
		} catch (e) { meldung("rot", e.message); }
	}

	async function schnellAnzahl(a) {
		let einheiten = [{ einheit: a.einheit, faktor: 1 }];
		if (zustand.nur_fertigware) { try { const e = await api("einheiten", { artikel: a.artikel }); if (e && e.length) einheiten = e; } catch (x) { /* Lagereinheit */ } }
		const vorschlag = a.verfuegbar != null ? Math.min(a.todo, a.verfuegbar) : a.todo;
		anzahlAbfragen(a.name + " für " + a.kunde,
			`Auftrag ${esc(a.auftrag)} · noch ${esc(zahlText(a.todo))} ${esc(ein(a.einheit))}${a.vorstufe ? ` · im Lager ${esc(zahlText(a.verfuegbar))} ${esc(a.vorstufe)}` : ""}`,
			einheiten, { anzahl: vorschlag > 0 ? vorschlag : null, einheit: einheiten.find((e) => e.einheit === a.einheit) ? a.einheit : einheiten[0].einheit },
			(n, e) => schnellBuchen(a.artikel, n * faktorVon(einheiten, e), { anzahl: n, einheit: e, auftrag: a }), () => zustand.zurueckZu());
	}

	// Was wird aus der losen Ware? Erst offene Kundenaufträge, die sie brauchen, dann jeder mögliche Artikel
	async function zielWaehlen(q) {
		app.innerHTML = kopf(q.name + ": verpacken für", true) +
			`<p><b>Kundenaufträge</b> – Zeile antippen</p><div id="ziel-auftraege">Lädt …</div>
			<p style="margin-top:22px"><b>Ohne Auftrag (ins Lager)</b> – Artikel antippen</p><div id="ziel-artikel"></div>`;
		aktionen((a) => (a === "zurueck" ? zustand.zurueckZu() : beiAllgemein(a)));
		try {
			const z = await api("verpacken_ziele", { station: zustand.station, lose: q.lose });
			if (z.auftraege.length) suchListe("ziel-auftraege", [["Auftrag", "auftrag"], ["Kunde", "kunde"], ["Artikel", "name"],
				["Offen", "offen_text", 1], ["Termin", "termin"]], z.auftraege, (au) => verpackenAnzahl(q, au, au), "Suchen: Kunde, Auftrag, Artikel …");
			else document.getElementById("ziel-auftraege").innerHTML = `<span class="fehlt">Kein offener Kundenauftrag braucht diese Ware.</span>`;
			suchListe("ziel-artikel", [["Artikel", "artikel"], ["Bezeichnung", "name"]], z.artikel, (ziel) => verpackenAnzahl(q, ziel), "Suchen: Artikel, Gebinde …");
		} catch (e) { meldung("rot", e.message); }
	}

	async function verpackenAnzahl(q, ziel, au) {
		let einheiten = [];
		try { einheiten = await api("einheiten", { artikel: ziel.artikel }); } catch (x) { /* unten */ }
		if (!einheiten || !einheiten.length) einheiten = [{ einheit: "Kg", faktor: 1 }];
		anzahlAbfragen(ziel.name + (au ? " für " + au.kunde : ""), `aus ${esc(q.name)} · ${esc(q.behaelter ? "Kiste " + q.behaelter : q.charge)} · ${esc(q.menge_text || mg(q.menge, q.einheit))} im ${q.linienlager ? "Linienlager" : "Lager"}${au ? ` · Auftrag ${esc(au.auftrag)}, offen ${esc(au.offen_text)}` : ""}`,
			einheiten, null, (n, e) => paletteFrage(ziel.name, (palette) => schnellBuchen(ziel.artikel, n * faktorVon(einheiten, e), { anzahl: n, einheit: e, bevorzugt: q.code, palette, auftrag: au })),
			() => zustand.zurueckZu());
	}

	// Kartons auf eine Palette (jede Palette hat eine NVE): scannen, neue Palette oder lose ins Lager
	function paletteFrage(titel, weiter) {
		app.innerHTML = kopf(titel + ": wohin?", true) + textFeld("scan", "Palette scannen") +
			`<div class="reihe"><button class="knopf gruen" data-a="neu">Neue Palette<small>NVE-Etikett wird gedruckt</small></button>
			<button class="knopf" data-a="ohne">Ohne Palette<small>Kartons lose ins Lager</small></button></div>`;
		aktionen(async (a) => {
			if (a === "ohne") return weiter(null);
			if (a === "neu") {
				try { return weiter((await api("palette_neu", { station: zustand.station, typ: "Lagerpalette" })).nve); } catch (e) { return meldung("rot", e.message); }
			}
			beiAllgemein(a);
		});
		enter("scan", (v) => v && weiter(v));
		fokus("scan");
	}

	async function schnellBuchen(ziel, menge, o) {
		const au = o.auftrag;
		try {
			const v = await api("vorschlag", { station: zustand.station, ziel, menge, bevorzugt: o.bevorzugt || null, kundenauftrag: au ? au.auftrag : null });
			if (v.hinweise.length) {
				// Etwas fehlt oder passt nicht: Zutatenliste zum Selbst-Auswählen
				ansatz = { rezept: await api("rezept", { artikel: ziel, menge, station: zustand.station }), zeilen: v.zeilen, offen: null, einheit: o.einheit,
					auftrag: au ? { auftrag: au.auftrag, artikel: au.artikel, name: au.name, kundenname: au.kunde, menge: au.bestellt, verpackt: au.erledigt, offen_verpacken: au.todo, einheit: au.einheit } : null };
				ansatzZeigen();
				return meldung("orange", "Bitte prüfen", v.hinweise.join(" · "));
			}
			const e = await api("herstellen", {
				station: zustand.station, ziel, zeilen: v.zeilen.map((z) => ({ code: z.code, menge: z.menge })),
				ausbringung: menge, anzahl: o.anzahl, einheit: o.einheit, kundenauftrag: au ? au.auftrag : null, ziel_behaelter: o.palette || null,
			});
			if (o.palette) etikettDrucken(o.palette);
			ergebnis(e.name, [
				e.los ? "Los: " + e.los : "Charge: " + e.charge,
				"Menge: " + (e.anzahl ? stk(e.anzahl, ein(e.einheit)) : mg(e.menge, e.einheit)),
				e.mhd ? "MHD: " + e.mhd : "",
				au ? "Kundenauftrag: " + au.auftrag + " · " + au.kunde : "",
				"Verbraucht: " + v.zeilen.map((z) => z.name + " " + mg(z.menge, z.einheit) + " (" + (z.silo || z.behaelter || z.charge) + ")").join(", "),
			].filter(Boolean), e.hinweise, `<button class="knopf gruen" data-a="weiter">Nächste Buchung</button>`)((a) => (a === "weiter" ? zustand.zurueckZu() : beiAllgemein(a)));
		} catch (err) { meldung("rot", err.message); }
	}

	async function herstellenListe() {
		const verpackung = zustand.nur_fertigware;
		if ((zustand.funktionen || []).includes("linie")) {
			// Kneter an der Linie: erst den laufenden Produktionsauftrag wählen
			let i;
			try { i = await api("linie_info", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
			if (!i || !i.auftrag || i.status !== "Läuft") return auftragWaehlen("Kneten", herstellenStart);
			// Ohne veredelten Teig (z. B. Herzen-Rohlinge aus Grundteig): Kübel direkt auf die Linie
			if (!i.zutaten.some((z) => z.stufe === "Teig veredelt")) return linieStart();
			zustand.linienAuftrag = i;
		} else zustand.linienAuftrag = null;
		const la = zustand.linienAuftrag;
		app.innerHTML = kopf(la ? "Kneten" : verpackung ? "Verpacken" : "Herstellen", true) + (la ? auftragKopf(la) +
			`<div class="reihe" style="margin-top:0"><button class="knopf" data-a="direkt-linie">Kübel oder Rework direkt auf die Linie<small>ohne Kneten scannen</small></button></div>` : "") +
			(verpackung ? `<p><b>Kundenaufträge</b> – Zeile antippen</p><div id="auftraege">Lädt …</div><p style="margin-top:22px"><b>Ohne Auftrag</b></p>` : `<p>Was wird hergestellt?</p>`) +
			`<div id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const [liste, auftraege] = await Promise.all([
				api("rezepte", { station: zustand.station }),
				verpackung ? api("auftraege", { station: zustand.station }) : Promise.resolve([]),
			]);
			auftragsListe = auftraege.filter((z) => z.offen_verpacken > 0);
			if (verpackung) {
				document.getElementById("auftraege").innerHTML = auftragsListe.length
					? tabelle([["Auftrag", "auftrag"], ["Kunde", "kundenname"], ["Artikel", "artikel"], ["Bezeichnung", "name"],
						["Bestellt", (z) => zahlText(z.menge), 1], ["Erledigt", (z) => zahlText(z.verpackt), 1], ["ToDo", (z) => zahlText(z.offen_verpacken), 1],
						["Einh.", (z) => ein(z.einheit)], ["Termin", "termin"]], auftragsListe, "auftrag")
					: `<span class="fehlt">Keine offenen Kundenaufträge.</span>`;
			}
			// Kneter: nur der Teig, den der laufende Auftrag braucht
			const wahl = la ? liste.filter((r) => la.zutaten.some((z) => z.artikel === r.artikel)) : liste;
			suchListe("liste", [["Artikel", "artikel"], ["Bezeichnung", "name"], ["Stufe", "stufe"]], wahl, (r) => rezeptMenge(r.artikel), "Suchen: Artikelnummer oder Bezeichnung …");
			aktionen((a, d) => {
				if (a === "pa-wechseln") return auftragWaehlen("Kneten", herstellenStart);
				if (a === "direkt-linie") return linieStart();
				if (a === "rezept") return rezeptMenge(d.artikel);
				if (a === "auftrag") { const z = auftragsListe[+d.i]; return rezeptMenge(z.artikel, z); }
				beiAllgemein(a);
			});
		} catch (e) { meldung("rot", e.message); }
	}

	async function rezeptMenge(artikel, auftrag) {
		try {
			const r = await api("rezept", { artikel, station: zustand.station });
			const zaehlen = r.einheiten && r.einheiten.length > 1;
			let einheit = zaehlen ? r.einheiten[0].einheit : null;
			let vorschlag = zaehlen ? Math.round(r.sollmenge / r.einheiten[0].faktor) : r.sollmenge;
			if (auftrag && !zaehlen) vorschlag = rund(auftrag.offen_kg);
			if (auftrag && zaehlen) {
				if (r.einheiten.some((e) => e.einheit === auftrag.einheit)) einheit = auftrag.einheit;
				vorschlag = Math.ceil(auftrag.offen_kg / faktorVon(r.einheiten, einheit) - 1e-6);
			}
			app.innerHTML = kopf(r.name, true) +
				(auftrag ? positionBox(auftrag.artikel + "  " + auftrag.name, auftrag.auftrag + " · " + auftrag.kundenname, auftrag.menge, auftrag.verpackt, auftrag.offen_verpacken, auftrag.einheit) : "") +
				(zaehlen ? einheitWahl(r.einheiten, einheit, r.einheit) : "") +
				zahlFeld("soll", zaehlen ? `Soll – wie viele <span id="einheit-text">${esc(ein(einheit))}</span>?` : `Sollmenge (${esc(ein(r.einheit))}) – laut Rezept ${esc(mg(r.sollmenge, r.einheit))}`, vorschlag);
			const weiter = () => {
				const n = zahl(document.getElementById("soll").value);
				ansatzStarten(artikel, zaehlen ? n * faktorVon(r.einheiten, einheit) : n, einheit, auftrag);
			};
			aktionen((a, d) => {
				if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("soll"); }
				beiAllgemein(a);
			});
			enter("soll", weiter);
			fokus("soll");
		} catch (e) { meldung("rot", e.message); }
	}

	async function ansatzStarten(artikel, soll, einheit, auftrag) {
		if (soll <= 0) return meldung("rot", "Bitte eine Sollmenge eingeben.");
		try {
			ansatz = { rezept: await api("rezept", { artikel, menge: soll, station: zustand.station }), zeilen: [], offen: null, einheit, auftrag };
			let fehlt = [];
			if (zustand.vorschlagen) {
				// Hier wird nicht gescannt: das Terminal füllt alles aus, älteste Ware zuerst
				const v = await api("vorschlag", { station: zustand.station, ziel: artikel, menge: soll });
				ansatz.zeilen = v.zeilen;
				fehlt = v.hinweise;
			} else {
				// Vorrat am Tisch (Folie, Etikett, Schleife ...): ohne Scan, Menge laut Rezept
				for (const z of ansatz.rezept.zutaten.filter((x) => x.vorrat)) {
					try { ansatz.zeilen.push(await api("pruefe_zeile", { station: zustand.station, ziel: artikel, code: z.vorrat, menge: z.menge })); }
					catch (e) { fehlt.push(z.vorrat + ": " + e.message); }
				}
			}
			ansatzZeigen();
			if (fehlt.length) meldung("orange", "Bitte prüfen", fehlt.join(" · "));
		} catch (e) { meldung("rot", e.message); }
	}

	function gescannt(artikelCode) {
		return ansatz.zeilen.filter((z) => z.artikel === artikelCode).reduce((s, z) => s + z.menge, 0);
	}

	// Bausteine der Arbeitsmaske (FOBIS-Aufbau)
	function maske(links, rechts) { return `<div class="maske"><div class="m-links">${links}</div><div class="m-rechts">${rechts}</div></div>`; }
	function gruppe(titel, inhalt) { return inhalt ? `<fieldset class="m-gruppe"><legend>${esc(titel)}</legend>${inhalt}</fieldset>` : ""; }
	function zeileKV(k, w) { return w == null || w === "" ? "" : `<div class="zeile"><div class="fehlt">${esc(k)}</div><div class="rechts">${esc(w)}</div></div>`; }
	// unter: optional je Zahl ein kleiner Text darunter (z. B. „2 Paletten + 10 Karton“)
	function grossZahlen(bestellt, erledigt, todo, einheit, unter) {
		const u = unter || [];
		const z = (n, i) => `<b>${esc(zahlText(rund(n)))}</b><i>${esc(ein(einheit || ""))}</i>${u[i] ? `<small style="color:var(--muted)">${esc(u[i])}</small>` : ""}`;
		return `<div class="gross3"><div><small>Bestellt</small>${z(bestellt, 0)}</div><div><small>Erledigt</small>${z(erledigt, 1)}</div><div><small>ToDo</small>${z(Math.max(todo, 0), 2)}</div></div>`;
	}

	// Gebinde-Text zur Zutat: „Sack 25 kg“
	function gebindeText(z) { return (z.gebinde || []).map((g) => ein(g.einheit) + " " + mg(g.faktor, z.einheit)).join(", "); }
	function ansatzZeigen() {
		const r = ansatz.rezept;
		const stand = (z) => {
			const ist = gescannt(z.artikel);
			const ueber = r.rezept_pruefen && ist > 0 && Math.abs(ist - z.menge) > (z.toleranz || 0) + 1e-9;
			return { ist, todo: Math.max(rund(z.menge - ist), 0), ueber, fertig: ist >= z.menge * 0.98 && !ueber };
		};
		// gewählte Zutat: nach dem Scan die gescannte, sonst die erste offene
		if (ansatz.offen && ansatz.offen.artikel) ansatz.sel = ansatz.offen.artikel;
		if (!r.zutaten.some((z) => z.artikel === ansatz.sel)) ansatz.sel = (r.zutaten.find((z) => !stand(z).fertig) || r.zutaten[0] || {}).artikel;
		const sel = r.zutaten.find((z) => z.artikel === ansatz.sel);
		// Links oben: alle Zutaten wie bei FOBIS (Bestellt / Erledigt / ToDo, Lager)
		const zeilen = r.zutaten.map((z, i) => {
			const st = stand(z);
			return `<tr data-a="sel" data-artikel="${esc(z.artikel)}" class="${z.artikel === ansatz.sel ? "gewaehlt" : st.fertig ? "fertig" : st.ueber ? "ueber" : ""}">
				<td>${i + 1}</td><td>${st.ueber ? "⚠" : st.fertig ? "✔" : "○"} ${esc(z.name)}<small>${esc(z.artikel)}</small></td>
				<td>${esc(z.silo || z.vorrat || z.lager || "")}</td>
