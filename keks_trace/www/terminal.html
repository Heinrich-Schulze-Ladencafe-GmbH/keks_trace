{% extends "templates/base.html" %}

{% block title %}Keks Trace Terminal{% endblock %}
{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block style %}
<style>
	:root {
		--bg: #15171a;
		--panel: #1f2328;
		--panel2: #2a2f36;
		--text: #f2f4f7;
		--muted: #a9b1bb;
		--gruen: #1f9d55;
		--rot: #d64545;
		--orange: #e08a1e;
		--blau: #2f6fd6;
	}
	html, body { background: var(--bg) !important; color: var(--text); margin: 0; }
	body { font: 20px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	#kt { position: fixed; inset: 0; overflow-y: auto; background: var(--bg); color: var(--text); padding: 12px max(16px, calc((100vw - 1100px) / 2)) 120px; box-sizing: border-box; z-index: 10; }
	#kt h1, #kt p { color: inherit; }
	#kt .fehlt, #kt label, #kt .klein { color: var(--muted); }
	#kt .ok { color: #5fd38d; }
	.kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0 14px; border-bottom: 1px solid var(--panel2); margin-bottom: 16px; }
	.kopf h1 { font-size: 26px; margin: 0; }
	.kopf .klein { color: var(--muted); font-size: 16px; }
	.link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 16px; cursor: pointer; padding: 6px; }
	.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
	.knopf { display: block; width: 100%; min-height: 84px; border: none; border-radius: 12px; background: var(--panel2); color: var(--text); font-size: 22px; font-weight: 600; padding: 14px; cursor: pointer; text-align: center; }
	.knopf small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 4px; }
	.knopf:active { transform: scale(0.98); }
	.knopf.gruen { background: var(--gruen); }
	.knopf.blau { background: var(--blau); }
	.knopf.rot { background: var(--rot); }
	.knopf.klein { min-height: 52px; font-size: 18px; width: auto; display: inline-block; padding: 10px 18px; }
	.feld { width: 100%; box-sizing: border-box; font-size: 26px; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--blau); background: #0e1013; color: var(--text); }
	.feld:focus { outline: none; border-color: #6ea0ff; }
	label { display: block; color: var(--muted); font-size: 17px; margin: 14px 0 6px; }
	.panel { background: var(--panel); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
	.zeile { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--panel2); }
	.zeile:last-child { border-bottom: none; }
	.zeile .rechts { text-align: right; white-space: nowrap; }
	.ok { color: #5fd38d; }
	.fehlt { color: var(--muted); }
	.meldung { border-radius: 12px; padding: 16px 18px; margin: 14px 0; font-size: 22px; font-weight: 600; }
	.meldung.rot { background: var(--rot); }
	.meldung.gruen { background: var(--gruen); }
	.meldung.orange { background: var(--orange); color: #111; }
	.meldung small { display: block; font-weight: 400; font-size: 17px; margin-top: 6px; }
	.gross { font-size: 34px; font-weight: 700; letter-spacing: 0.5px; word-break: break-all; }
	.reihe { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
	.reihe > * { flex: 1 1 220px; }
	.x { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; padding: 0 8px; }
	.dialog { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
	.dialog .panel { max-width: 520px; width: 100%; }
	#tasten { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; gap: 8px; padding: 10px max(12px, calc((100vw - 1100px) / 2)) 14px;
		background: #0b0c0e; border-top: 1px solid var(--panel2); box-shadow: 0 -6px 20px rgba(0,0,0,.5); }
	#tasten.zahl { grid-template-columns: repeat(4, minmax(0, 150px)); justify-content: center; }
	#tasten.text { grid-template-columns: repeat(10, 1fr); }
	#tasten button { min-height: 60px; border: none; border-radius: 10px; background: var(--panel2); color: var(--text); font-size: 26px; font-weight: 600; cursor: pointer; touch-action: manipulation; padding: 0; }
	#tasten.text button { min-height: 52px; font-size: 21px; }
	#tasten button:active { background: #3a414a; }
	#tasten .ok { background: var(--gruen); color: #fff; }
	#tasten.zahl .ok { grid-row: span 2; }
	#tasten .weg { background: #3a2a2a; }
	#tasten .breit { grid-column: span 2; }
	.einheiten { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
	.einheiten button { flex: 1 1 120px; min-height: 56px; border: 2px solid var(--panel2); border-radius: 10px; background: var(--panel); color: var(--text); font-size: 20px; cursor: pointer; }
	.einheiten button.an { border-color: #6ea0ff; background: var(--blau); }
	.mitknopf { display: flex; gap: 10px; }
	.mitknopf .feld { flex: 1; }
	.mitknopf .knopf { width: auto; min-height: 0; flex: 0 0 auto; font-size: 18px; padding: 0 18px; }
	.nve { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
	.nve small { font-size: 18px; color: var(--muted); font-weight: 400; }
	.pos { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: var(--panel2); border: none; color: var(--text); border-radius: 10px; padding: 12px 14px; margin: 8px 0; font-size: 19px; cursor: pointer; }
	.pos small { display: block; color: var(--muted); font-size: 15px; }
	.marke { display: inline-block; font-size: 15px; padding: 2px 10px; border-radius: 20px; background: var(--panel2); margin-left: 8px; vertical-align: middle; }
	.marke.gruen { background: var(--gruen); } .marke.orange { background: var(--orange); color: #111; } .marke.rot { background: var(--rot); }
	@media (max-width: 600px) {
		body { font-size: 18px; }
		.knopf { min-height: 72px; font-size: 20px; }
		.gross { font-size: 26px; }
		#tasten button { min-height: 50px; font-size: 22px; }
		#tasten.text button { min-height: 42px; font-size: 17px; }
	}
</style>
{% endblock %}

{% block content %}
<div id="kt" data-csrf="{{ kt_csrf }}"><p style="padding:24px">Lädt …</p></div>
{% endblock %}

{% block script %}
<script>
{% raw %}
(function () {
	"use strict";
	const API = "/api/method/keks_trace.terminal.";
	const app = document.getElementById("kt");
	const zustand = { station: null, typ: null };

	// ------------------------------------------------------------------ Hilfen
	function esc(t) {
		return String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	}
	function zahl(t) {
		const n = parseFloat(String(t || "").replace(",", "."));
		return isNaN(n) ? 0 : n;
	}
	function rund(n, s) { const f = Math.pow(10, s == null ? 3 : s); return Math.round(n * f) / f; }
	function kg(n) { return rund(n).toLocaleString("de-DE") + " kg"; }
	function stk(n, e) { return rund(n).toLocaleString("de-DE") + " " + (e || ""); }
	function ein(e) { return !e || e === "Kg" ? "kg" : e === "Nos" ? "Stk" : e; }
	function mg(n, e) { return !e || e === "Kg" ? kg(n) : stk(n, ein(e)); }
	// Menge (Lagereinheit) in gemischten Einheiten: „3 Paletten + 5 Karton“ (wie palette.zerlegen)
	function zerlegen(einheiten, menge) {
		const stufen = (einheiten || []).filter((e) => e.einheit !== "Lage");
		if (!stufen.length) return kg(menge);
		const mz = { Palette: "Paletten", Lage: "Lagen" };
		const n = (x, e) => rund(x).toLocaleString("de-DE") + " " + (rund(x) !== 1 && mz[e] ? mz[e] : e);
		if (menge <= 1e-6) return "0 " + (stufen.find((e) => e.einheit !== "Palette") || stufen[0]).einheit;
		const teile = [];
		for (let i = 0; i < stufen.length; i++) {
			const e = stufen[i];
			const letzte = i === stufen.length - 1 || (stufen[i + 1].faktor === 1 && e.faktor !== 1);
			if (letzte) { const x = Math.round((menge / e.faktor) * 100) / 100; if (x >= 0.05) teile.push(n(x, e.einheit)); break; }
			const x = Math.floor(menge / e.faktor + 1e-6);
			if (x) { teile.push(n(x, e.einheit)); menge = rund(menge - x * e.faktor, 6); }
			if (menge <= 1e-6) break;
		}
		return teile.join(" + ") || "0 " + (stufen.find((e) => e.einheit !== "Palette") || stufen[0]).einheit;
	}
	function textAus(html) {
		const d = document.createElement("div");
		d.innerHTML = html;
		return d.textContent || d.innerText || "";
	}
	let audio;
	function ton(ok) {
		try {
			audio = audio || new (window.AudioContext || window.webkitAudioContext)();
			const o = audio.createOscillator(), g = audio.createGain();
			o.frequency.value = ok ? 880 : 220;
			o.connect(g); g.connect(audio.destination);
			g.gain.value = 0.15;
			o.start(); o.stop(audio.currentTime + (ok ? 0.12 : 0.5));
		} catch (e) { /* kein Ton */ }
		if (navigator.vibrate) navigator.vibrate(ok ? 60 : [200, 80, 200]);
	}
	function speichern(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* privat */ } }
	function laden(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

	async function api(methode, args) {
		const r = await fetch(API + methode, {
			method: "POST",
			headers: {
				"Content-Type": "application/json",
				Accept: "application/json",
				"X-Frappe-CSRF-Token": app.dataset.csrf || (window.frappe && frappe.csrf_token) || "",
			},
			body: JSON.stringify(args || {}),
		});
		let daten = {};
		try { daten = await r.json(); } catch (e) { /* leer */ }
		if (!r.ok || daten.exc_type || daten.exception) {
			let text = "";
			try {
				text = JSON.parse(daten._server_messages || "[]").map((m) => textAus(JSON.parse(m).message || m)).join(" ");
			} catch (e) { /* ignorieren */ }
			if (!text && daten.exception) text = String(daten.exception).split(":").slice(1).join(":").trim();
			if (daten.exc_type === "CSRFTokenError") {
				if (!laden("kt_neu")) { speichern("kt_neu", "1"); setTimeout(() => location.reload(), 1500); text = "Sitzung abgelaufen. Seite wird neu geladen …"; }
				else text = "Sitzung ungültig. Bitte neu anmelden.";
			}
			if (r.status === 403) text = text || "Nicht angemeldet oder keine Berechtigung.";
			throw new Error(text || "Fehler beim Buchen (" + r.status + ").");
		}
		speichern("kt_neu", "");
		return daten.message;
	}

	let meldungTimer;
	function meldung(art, text, klein) {
		const el = document.getElementById("meldung");
		if (!el) return;
		el.innerHTML = `<div class="meldung ${art}">${esc(text)}${klein ? `<small>${esc(klein)}</small>` : ""}</div>`;
		ton(art !== "rot");
		clearTimeout(meldungTimer);
		if (art !== "rot") meldungTimer = setTimeout(() => { el.innerHTML = ""; }, 6000);
	}
	function fokus(id) {
		setTimeout(() => { const f = document.getElementById(id || "scan"); if (f) f.focus(); }, 30);
	}
	document.addEventListener("click", (e) => {
		if (e.target.closest("input, select, textarea, button, .dialog, #tasten")) return;
		// Nur wenn gerade kein Feld aktiv ist: sonst würde ein Tipp, der wegen der aufgehenden Tastatur
		// danebengeht, den Cursor aus dem gerade angetippten Feld holen.
		const aktiv = document.activeElement;
		if (aktiv && aktiv !== document.body && aktiv.matches("input, select")) return;
		const f = document.getElementById("scan");
		if (f) f.focus();
	});

	// ------------------------------------------------------------------ Bildschirmtastatur und Scanner
	// Eine Tastatur unten am Bildschirm schreibt in das angetippte Feld: Ziffern bei Mengen/Datum,
	// Buchstaben bei Text. Felder haben inputmode="none" (keine kleine Systemtastatur).
	// Scanner tippen sehr schnell und schließen mit Enter: ein Scan landet immer im Scanfeld
	// (data-scan), auch wenn gerade ein Mengenfeld aktiv ist; dessen Inhalt bleibt erhalten.
	function feld(id, label, wert, art, scan) {
		return `<label for="${id}">${label}</label><input id="${id}" class="feld" data-art="${art}" ${scan ? "data-scan" : ""}
			inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(wert == null ? "" : wert)}">`;
	}
	function zahlFeld(id, label, wert) {
		return feld(id, label, wert == null || wert === "" ? "" : String(wert).replace(".", ","), "zahl");
	}
	function textFeld(id, label, wert) { return feld(id, label, wert, "text", true); }
	function datumFeld(id, label) { return feld(id, label + ' <span class="fehlt">(TT.MM.JJ oder TTMMJJ)</span>', "", "datum"); }
	function datumIso(t) {
		const z = String(t || "").replace(/\D/g, "");
		let d, m, y;
		if (/^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(String(t).trim())) [d, m, y] = String(t).trim().split(".");
		else if (z.length === 6) [d, m, y] = [z.slice(0, 2), z.slice(2, 4), z.slice(4)];
		else if (z.length === 8) [d, m, y] = [z.slice(0, 2), z.slice(2, 4), z.slice(4)];
		else return null;
		y = String(y).length === 2 ? "20" + y : String(y);
		const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
		const dt = new Date(iso + "T12:00:00");
		return isNaN(dt) || dt.getDate() !== +d ? null : iso;
	}

	const tasten = document.createElement("div");
	tasten.id = "tasten";
	document.body.appendChild(tasten);
	let tastenArt = null;
	const BELEGUNG = {
		zahl: ["7", "8", "9", "⌫", "4", "5", "6", "C", "1", "2", "3", "OK", "ZU", "0", ","],
		datum: ["7", "8", "9", "⌫", "4", "5", "6", "C", "1", "2", "3", "OK", "ZU", "0", "."],
		text: ["1234567890", "QWERTZUIOP", "ASDFGHJKL-", "YXCVBNM./"],
	};
	// Buchstaben nur nach Antippen (Scanfelder bekommen den Cursor automatisch, da stört die Tastatur);
	// Ziffern erscheinen auch automatisch, wenn eine Menge gefragt ist.
	let angetippt = null;
	document.addEventListener("pointerdown", (e) => { angetippt = e.target.closest("input[data-art]"); }, true);
	function tastenZeigen() {
		const f = document.activeElement;
		let art = f && f.dataset ? f.dataset.art : null;
		if (art === "text" && angetippt !== f) art = null;
		if (!art) { tasten.style.display = "none"; app.style.paddingBottom = ""; tastenArt = null; return; }
		if (art !== tastenArt) {
			tastenArt = art;
			if (art === "text") {
				tasten.className = "text";
				tasten.innerHTML = BELEGUNG.text.map((r) => r.split("").map((z) => `<button type="button" data-z="${z}">${z}</button>`).join("")).join("") +
					`<button type="button" data-z="⌫" class="breit weg">⌫</button><button type="button" data-z="C" class="breit weg">C</button>` +
					`<button type="button" data-z="ZU" class="breit">▾</button><button type="button" data-z="OK" class="ok" style="grid-column: span 4">OK</button>`;
			} else {
				tasten.className = "zahl";
				tasten.innerHTML = BELEGUNG[art].map((z) =>
					`<button type="button" data-z="${z}" class="${z === "OK" ? "ok" : z === "⌫" || z === "C" ? "weg" : ""}">${z === "ZU" ? "▾" : z}</button>`).join("");
			}
		}
		tasten.style.display = "grid";
		app.style.paddingBottom = tasten.offsetHeight + 40 + "px";
		setTimeout(() => f.scrollIntoView({ block: "nearest", behavior: "smooth" }), 20);
	}
	document.addEventListener("focusin", tastenZeigen);
	document.addEventListener("focusout", () => setTimeout(tastenZeigen, 60));
	tasten.addEventListener("pointerdown", (e) => e.preventDefault()); // Fokus bleibt im Feld
	tasten.addEventListener("click", (e) => {
		const b = e.target.closest("[data-z]");
		const f = document.activeElement;
		if (!b || !f || !f.dataset || !f.dataset.art) return;
		const z = b.dataset.z;
		if (z === "OK") return weiter(f);
		if (z === "ZU") return f.blur();
		const markiert = f.value && f.selectionStart === 0 && f.selectionEnd === f.value.length;
		if (markiert && z !== "⌫" && z !== "C") f.value = ""; // markierter Vorschlag wird überschrieben
		if (z === "⌫") f.value = markiert ? "" : f.value.slice(0, -1);
		else if (z === "C") f.value = "";
		else if ((z === "," || z === ".") && f.dataset.art === "zahl" && f.value.includes(",")) return;
		else f.value += z === "." && f.dataset.art === "zahl" ? "," : z;
		f.setSelectionRange(f.value.length, f.value.length);
		f.dispatchEvent(new Event("input", { bubbles: true }));
	});
	// OK/Enter: Formular-Logik des Bildschirms auslösen; ändert die nichts am Fokus, ins nächste Feld
	function weiter(f) {
		f.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
		setTimeout(() => {
			if (document.activeElement !== f || !document.body.contains(f)) return;
			const felder = [...app.querySelectorAll("input[data-art], select")].filter((x) => x.offsetParent);
			const n = felder[felder.indexOf(f) + 1];
			if (n) n.focus();
			else f.blur(); // letztes Feld: Tastatur weg, Buchen-Knopf frei
		}, 80);
	}

	// Scanner erkennen: viele Zeichen in kurzem Abstand, dann Enter
	const scanPuffer = { text: "", zeit: 0, feld: null, vorher: "" };
	document.addEventListener("keydown", (e) => {
		const f = document.activeElement;
		const jetzt = performance.now();
		if (e.key === "Enter") {
			const istScan = scanPuffer.text.length >= 4 && scanPuffer.feld === f && jetzt - scanPuffer.zeit < 80;
			const code = scanPuffer.text;
			scanPuffer.text = "";
			if (!istScan || !f || !f.dataset) return;
			const ziel = f.dataset.scan !== undefined ? null
				: [...app.querySelectorAll("[data-scan]")].find((x) => x.offsetParent && !x.value) || app.querySelector("[data-scan]");
			if (f.dataset.scan !== undefined) return; // Scan im Scanfeld: normal weiter
			e.preventDefault();
			e.stopImmediatePropagation();
			f.value = scanPuffer.vorher; // Mengenfeld behält seinen Inhalt
			if (!ziel) return meldung("rot", "Gescannt: " + code + ". Hier bitte erst die Eingabe abschließen.");
			ziel.value = code;
			ziel.focus();
			ziel.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
			return;
		}
		if (e.key.length !== 1) return;
		if (jetzt - scanPuffer.zeit > 50 || scanPuffer.feld !== f) {
			scanPuffer.text = "";
			scanPuffer.feld = f;
			scanPuffer.vorher = f && "value" in f ? f.value : "";
		}
		scanPuffer.text += e.key;
		scanPuffer.zeit = jetzt;
	}, true);

	function einheitWahl(einheiten, aktiv, basis) {
		if (!einheiten || einheiten.length < 2) return "";
		return `<div class="einheiten">${einheiten.map((e) =>
			`<button type="button" data-a="einheit" data-e="${esc(e.einheit)}" class="${e.einheit === aktiv ? "an" : ""}">${esc(ein(e.einheit))}${e.faktor !== 1 ? ` <small>(${esc(String(rund(e.faktor)).replace(".", ","))} ${esc(ein(basis))})</small>` : ""}</button>`).join("")}</div>`;
	}
	function einheitSetzen(einheit) {
		app.querySelectorAll('[data-a="einheit"]').forEach((b) => b.classList.toggle("an", b.dataset.e === einheit));
	}
	function faktorVon(einheiten, einheit) {
		const e = (einheiten || []).find((x) => x.einheit === einheit);
		return e ? e.faktor : 1;
	}

	// ------------------------------------------------------------------ Rahmen
	function kopf(titel, zurueck) {
		return `<div class="kopf">
			<div><h1>${esc(titel)}</h1><div class="klein">Station ${esc(zustand.station || "-")}</div></div>
			<div>${zurueck ? `<button class="link" data-a="zurueck">← Zurück</button>` : `<button class="link" data-a="station-wechseln">Station wechseln</button>`}</div>
		</div><div id="meldung"></div>`;
	}
	function aktionen(handler) {
		app.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => handler(b.dataset.a, b.dataset)));
	}
	function enter(id, fn) {
		const f = document.getElementById(id);
		if (f) f.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); fn(f.value.trim(), f); } });
	}
	function beiAllgemein(a) {
		if (a === "zurueck") return startseite();
		if (a === "station-wechseln") { speichern("kt_station", ""); zustand.station = null; return stationWaehlen(); }
	}
	function etikettDrucken(nve) {
		window.open("/nve_etikett?nve=" + encodeURIComponent(nve) + "&druck=1", "_blank");
	}

	// ------------------------------------------------------------------ Station
	async function stationWaehlen() {
		app.innerHTML = `<div class="kopf"><h1>Keks Trace Terminal</h1></div><div id="meldung"></div>
			<p>An welcher Station steht dieses Terminal?</p><div class="raster" id="liste">Lädt …</div>`;
		try {
			const liste = await api("stationen");

				document.getElementById("liste").innerHTML = "Es ist noch keine Station eingerichtet (Terminal Station in ERPNext anlegen).";
				suche("liste");
				return;
			}
			document.getElementById("liste").innerHTML = liste
				.map((s) => `<button class="knopf" data-a="station" data-name="${esc(s.name)}">${esc(s.name)}${s.typ !== s.name ? `<small>${esc(s.typ)}</small>` : ""}</button>`)
				.join("");
			aktionen((a, d) => { if (a === "station") { speichern("kt_station", d.name); init(); } });
		} catch (e) { meldung("rot", e.message); }
	}

	// Knöpfe aus den Funktionen der Station (in ERPNext unter Terminal Station einstellbar)
	function menue() {
		const f = zustand.funktionen || [];
		const fw = zustand.nur_fertigware;
		const m = [];
		const kneter = f.includes("herstellen") && f.includes("linie");
		if (kneter) m.push(["herstellen", "Kneten", "Grundteig-Kübel und Zutaten → Teig direkt in den Former"]);
		else if (f.includes("herstellen")) m.push(["herstellen", fw ? "Verpacken" : "Herstellen", fw ? "Los mit MHD, nach Kundenauftrag, auf Palette" : (zustand.stufen || []).join(", ")]);
		if (f.includes("wareneingang")) m.push(["wareneingang", "Wareneingang", "Anlieferung buchen, ins Silo oder als Gebinde"]);
		if (f.includes("lieferung")) m.push(["lieferung", "Lieferung", "Paletten und Kartons an einen Kunden"]);
		if (f.includes("umlagern")) m.push(["umlagern", "Umlagern", zustand.umlager_ziel ? "nach " + zustand.umlager_ziel : "in ein anderes Lager"]);
		if (f.includes("paletten")) m.push(["paletten", "Paletten", "Neue Palette, Etikett, anbrechen, umpacken"]);
		if (f.includes("rework")) m.push(["rework", fw ? "Packbruch" : "Rework / Bruch", "In einen Rework-Behälter"]);
		if (f.includes("silo")) m.push(["silo", "Silo leer melden", "Silo oder Tank ist leergefahren"]);
		if (f.includes("linie") && !kneter) m.push(["linie", "An die Linie", "Kübel einkippen, Füllung, Glasur, Schokolade nachfüllen"]);
		if (f.includes("packstation")) m.push(["packstation", "Packstation", "Auftrag, Anlage, Los, MHD, Kartonlabel"]);
		if (f.includes("palette_fertig")) m.push(["palette_fertig", "Palette fertig", "Kartons zählen, buchen, Palettenlabel"]);
		m.push(["info", "Info-Scan", "Charge, Behälter, Silo oder Palette"]);
		return m;
	}

	// ------------------------------------------------------------------ Prüfungen (CP/CCP)
	function kennzeichenMarken(liste) {
		return (liste || []).map((k) => `<span class="marke ${k === "Bio" ? "gruen" : ""}">${esc(k === "Bio" ? "BIO" : k)}</span>`).join("");
	}
	function pruefFelder(plaene, praefix) {
		return (plaene || []).map((p, i) => {
			const id = praefix + i;
			let html = `<div class="panel" style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
				<b>${esc(p.frage)}</b><span class="marke ${p.lenkung === "CCP" ? "rot" : "orange"}">${esc(p.lenkung)}</span></div>
				<div class="fehlt" style="font-size:16px">Grenzwert: ${esc(p.grenzwert)}</div>`;
			if (p.art === "Messwert") html += zahlFeld(id, "Messwert" + (p.einheit ? " (" + esc(p.einheit) + ")" : ""));
			else if (p.art === "Ja/Nein") html += `<div class="einheiten" data-pw="${id}"><button type="button" data-pwv="1">✔ in Ordnung</button><button type="button" data-pwv="0">✖ nicht in Ordnung</button></div>`;
			else html += p.pruefkoerper.map((k, j) => `<div class="zeile"><div>${esc(k)}</div>
				<div class="einheiten" data-pw="${id}-${j}" style="margin:0;flex:0 0 440px"><button type="button" data-pwv="1">✔ erkannt</button><button type="button" data-pwv="0">✖ nicht erkannt</button></div></div>`).join("");
			return html + "</div>";
		}).join("");
	}
	app.addEventListener("click", (e) => {
		const b = e.target.closest("[data-pwv]");
		if (!b) return;
		const box = b.closest("[data-pw]");
		box.dataset.wert = b.dataset.pwv;
		box.querySelectorAll("button").forEach((x) => { x.classList.toggle("an", x === b); x.style.background = x === b && b.dataset.pwv === "0" ? "var(--rot)" : ""; });
	});
	function pruefWerte(plaene, praefix) {
		const out = {};
		(plaene || []).forEach((p, i) => {
			const id = praefix + i;
			if (p.art === "Messwert") {
				const f = document.getElementById(id);
				if (f && f.value !== "") out[p.pruefplan] = { wert: f.value };
			} else if (p.art === "Ja/Nein") {
				const b = app.querySelector(`[data-pw="${id}"]`);
				if (b && b.dataset.wert !== undefined) out[p.pruefplan] = { ok: b.dataset.wert === "1" };
			} else {
				const k = {};
				let alle = true;
				p.pruefkoerper.forEach((name, j) => {
					const b = app.querySelector(`[data-pw="${id}-${j}"]`);
					if (b && b.dataset.wert !== undefined) k[name] = b.dataset.wert === "1"; else alle = false;
				});
				if (alle) out[p.pruefplan] = { koerper: k };
			}
		});
		return out;
	}

	// ------------------------------------------------------------------ Suche in langen Listen
	// Ab 8 Einträgen bekommt eine Knopfliste ein Suchfeld; filtert beim Tippen (Scanner geht weiter ins Scanfeld).
	function suche(listeId) {
		const liste = document.getElementById(listeId);
		if (!liste || liste.children.length < 8 || document.getElementById(listeId + "-suche")) return;
		const f = document.createElement("input");
		f.id = listeId + "-suche";
		f.className = "feld";
		f.placeholder = "Suchen …";
		f.style.marginBottom = "12px";
		liste.parentNode.insertBefore(f, liste);
		f.addEventListener("input", () => {
			const t = f.value.trim().toLowerCase();
			[...liste.children].forEach((k) => { k.style.display = !t || k.textContent.toLowerCase().includes(t) ? "" : "none"; });
		});
	}

	// An die Linie: Kübel einkippen (Former), Gebinde nachfüllen
	async function linieStart() {
		let i;
		try { i = await api("linie_info", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		if (!i || !i.auftrag || i.status !== "Läuft") return auftragWaehlen("An die Linie", linieStart);
		const zutaten = i.zutaten.filter((z) => z.stufe !== "Packmittel").map((z) => `<div class="zeile"><div>${esc(z.name)}</div>
			<div class="rechts ${z.auf_linie > 0 ? "ok" : "fehlt"}">${esc(mg(z.auf_linie, z.einheit))} auf der Linie${z.reicht_fuer != null ? " · reicht für " + esc(mg(z.reicht_fuer, i.lagereinheit)) : ""}</div></div>`).join("");
		const kuebel = i.kuebel.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Nächste Kübel (ältester zuerst)</div>
			<div class="gross">${i.kuebel.map((k) => esc(k.code)).join(" · ")}</div>
			<div class="fehlt" style="font-size:16px">${i.kuebel.map((k) => esc(k.code + ": " + k.name + (k.datum ? " vom " + k.datum : "") + ", " + kg(k.menge))).join("<br>")}</div></div>` : "";
		app.innerHTML = kopf("An die Linie", true) + auftragKopf(i) + kuebel + `<div class="panel">${zutaten}</div>` +
			textFeld("scan", "Kübel, Gebinde oder Tank scannen") +
			zahlFeld("menge", "Menge (leer = ganzer Kübel)");
		aktionen((a) => (a === "pa-wechseln" ? auftragWaehlen("An die Linie", linieStart) : beiAllgemein(a)));
		enter("scan", async (code) => {
			if (!code) return;
			try {
				const r = await api("linie_zufuehren", { station: zustand.station, code, menge: zahl(document.getElementById("menge").value) || null });
				await linieStart();
				meldung("gruen", "Zugeführt: " + r.name + " " + mg(r.menge, r.einheit), (r.behaelter ? r.behaelter + " · " : "") + "Charge " + r.chargen.join(", "));
				ton(true);
				(r.hinweise || []).forEach((h) => app.querySelector("#meldung").insertAdjacentHTML("beforeend", `<div class="meldung orange">${esc(h)}</div>`));
			} catch (e) { meldung("rot", e.message); document.getElementById("scan").value = ""; }
		});
		fokus("scan");
	}

	// Palette fertig: Kartons zählen, buchen
	async function paletteFertigStart() {
		let i;
		try { i = await api("linie_info", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
		if (!i || !i.auftrag || i.status !== "Läuft") return auftragWaehlen("Palette fertig", paletteFertigStart);
		const einheiten = (i.einheiten || []).filter((e) => e.einheit !== "Palette" && e.einheit !== "Lage");
		let einheit = (einheiten.find((e) => e.einheit === "Karton") || einheiten[0] || { einheit: "Kg" }).einheit;
		app.innerHTML = kopf("Palette fertig", true) + auftragKopf(i) + einheitWahl(einheiten, einheit, i.lagereinheit) +
			zahlFeld("anzahl", `Wie viele <span id="einheit-text">${esc(einheit)}</span> auf der Palette?`) +
			textFeld("scan", "Palette scannen (leer = neue Palette)") +
			`<div class="reihe"><button class="knopf gruen" data-a="buchen">Buchen</button><button class="knopf" data-a="beenden">Auftrag beenden</button></div>`;
		aktionen(async (a, d) => {
			if (a === "pa-wechseln") return auftragWaehlen("Palette fertig", paletteFertigStart);
			if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("anzahl"); }
			if (a === "beenden") return auftragBeenden(i);

				etikettDrucken(e.palette);
				ergebnis(e.name, [
					"Los: " + e.los, "Menge: " + stk(e.anzahl, ein(e.einheit)) + (e.einheit !== i.lagereinheit ? " (" + mg(e.menge, i.lagereinheit) + ")" : ""), "Palette: " + e.palette,
					e.mhd ? "MHD: " + e.mhd : "", e.kennzeichen ? "Kennzeichen: " + e.kennzeichen : "",
					"Auftrag gesamt: " + e.gebucht_text, "Verbraucht: " + e.verbraucht.map((v) => v.name + " " + v.charge).join(", "),

		});

	// ------------------------------------------------------------------ Herstellen / Verpacken
	let ansatz;
	let auftragsListe = [];
	async function herstellenStart() {
		const verpackung = zustand.nur_fertigware;
		if ((zustand.funktionen || []).includes("linie")) {
			// Kneter an der Linie: erst den laufenden Produktionsauftrag wählen
			let i;
			try { i = await api("linie_info", { station: zustand.station }); } catch (e) { return meldung("rot", e.message); }
			if (!i || !i.auftrag || i.status !== "Läuft") return auftragWaehlen("Kneten", herstellenStart);
			zustand.linienAuftrag = i;
		} else zustand.linienAuftrag = null;
		const la = zustand.linienAuftrag;
		app.innerHTML = kopf(la ? "Kneten" : verpackung ? "Verpacken" : "Herstellen", true) + (la ? auftragKopf(la) : "") +
			(verpackung ? `<p>Kundenaufträge</p><div class="raster" id="auftraege">Lädt …</div><p style="margin-top:22px">Ohne Auftrag</p>` : `<p>Was wird hergestellt?</p>`) +
			`<div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const [liste, auftraege] = await Promise.all([
				api("rezepte", { station: zustand.station }),
				verpackung ? api("auftraege", { station: zustand.station }) : Promise.resolve([]),
			]);
			auftragsListe = auftraege.filter((z) => z.offen_verpacken > 0);
			if (verpackung) {
				document.getElementById("auftraege").innerHTML = auftragsListe.length
					? auftragsListe.map((z, i) => `<button class="knopf blau" data-a="auftrag" data-i="${i}">${esc(z.kundenname)} · ${esc(z.name)}
						<small>${esc(z.auftrag)} · noch ${esc(z.offen_text)} von ${esc(z.menge_text)}${z.termin ? " · Termin " + esc(z.termin) : ""}</small></button>`).join("")
					: `<span class="fehlt">Keine offenen Kundenaufträge.</span>`;
				suche("auftraege");
			}
			document.getElementById("liste").innerHTML = liste.length
				? liste.map((r) => `<button class="knopf" data-a="rezept" data-artikel="${esc(r.artikel)}">${esc(r.name)}<small>${esc(r.stufe)} · ${esc(r.artikel)}</small></button>`).join("")
				: "Keine Rezepte für diese Station.";
			aktionen((a, d) => {
				if (a === "pa-wechseln") return auftragWaehlen("Kneten", herstellenStart);
				if (a === "rezept") return rezeptMenge(d.artikel);
				if (a === "auftrag") { const z = auftragsListe[+d.i]; return rezeptMenge(z.artikel, z); }
				beiAllgemein(a);
			});
		} catch (e) { meldung("rot", e.message); }
	}

	async function rezeptMenge(artikel, auftrag) {
		try {
			const r = await api("rezept", { artikel, station: zustand.station });
			const zaehlen = r.einheiten && r.einheiten.length > 1;
			let einheit = zaehlen ? r.einheiten[0].einheit : null;
			let vorschlag = zaehlen ? Math.round(r.sollmenge / r.einheiten[0].faktor) : r.sollmenge;
			if (auftrag && zaehlen) {
				if (r.einheiten.some((e) => e.einheit === auftrag.einheit)) einheit = auftrag.einheit;
				vorschlag = Math.ceil(auftrag.offen_kg / faktorVon(r.einheiten, einheit) - 1e-6);
			}
			app.innerHTML = kopf(r.name, true) +
				(auftrag ? `<div class="panel">Für Auftrag <b>${esc(auftrag.auftrag)}</b> · ${esc(auftrag.kundenname)}<br><span class="fehlt">bestellt ${esc(auftrag.menge_text)}, schon verpackt ${esc(auftrag.verpackt_text)}, offen ${esc(auftrag.offen_text)}</span></div>` : "") +
				(zaehlen ? einheitWahl(r.einheiten, einheit, r.einheit) : "") +
				zahlFeld("soll", zaehlen ? `Soll – wie viele <span id="einheit-text">${esc(ein(einheit))}</span>?` : `Sollmenge (${esc(ein(r.einheit))}) – laut Rezept ${esc(mg(r.sollmenge, r.einheit))}`, vorschlag);
			const weiter = () => {
				const n = zahl(document.getElementById("soll").value);
				ansatzStarten(artikel, zaehlen ? n * faktorVon(r.einheiten, einheit) : n, einheit, auftrag);
			};
			aktionen((a, d) => {
				if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("soll"); }
				beiAllgemein(a);
			});
			enter("soll", weiter);
			fokus("soll");
		} catch (e) { meldung("rot", e.message); }
	}

	async function ansatzStarten(artikel, soll, einheit, auftrag) {
		if (soll <= 0) return meldung("rot", "Bitte eine Sollmenge eingeben.");
		try {
			ansatz = { rezept: await api("rezept", { artikel, menge: soll, station: zustand.station }), zeilen: [], offen: null, einheit, auftrag };
			ansatzZeigen();
		} catch (e) { meldung("rot", e.message); }
	}

	function gescannt(artikelCode) {
		return ansatz.zeilen.filter((z) => z.artikel === artikelCode).reduce((s, z) => s + z.menge, 0);
	}

	function ansatzZeigen() {
		const r = ansatz.rezept;
		const zutaten = r.zutaten.map((z) => {
			const ist = gescannt(z.artikel);
			const fertig = ist >= z.menge * 0.98;
			return `<div class="zeile"><div><span class="${fertig ? "ok" : ""}">${fertig ? "✔" : "○"} ${esc(z.name)}</span>
				${z.silo ? ` <button class="knopf klein" data-a="silo-zutat" data-silo="${esc(z.silo)}">aus ${esc(z.silo)}</button>` : ""}</div>
				<div class="rechts ${fertig ? "ok" : "fehlt"}">${esc(mg(ist, z.einheit))} / ${esc(mg(z.menge, z.einheit))}</div></div>`;
		}).join("");
		const extra = ansatz.zeilen.filter((z) => z.rework).map((z) => `<div class="zeile"><div class="ok">✔ Rework: ${esc(z.name)}</div><div class="rechts">${esc(mg(z.menge, z.einheit))}</div></div>`).join("");
		const liste = ansatz.zeilen.map((z, i) => `<div class="zeile"><div>${esc(z.name)}<br><span class="fehlt" style="font-size:16px">${esc(z.silo || z.behaelter || z.charge)}</span></div>
			<div class="rechts">${esc(mg(z.menge, z.einheit))} <button class="x" data-a="weg" data-i="${i}">✕</button></div></div>`).join("");
		app.innerHTML = kopf(r.name + " · " + mg(r.sollmenge, r.einheit), true) + `
			${r.kennzeichen && r.kennzeichen.length ? `<div class="panel">${kennzeichenMarken(r.kennzeichen)} <span class="fehlt" style="font-size:16px">Nur Zutaten mit diesem Kennzeichen werden angenommen.</span></div>` : ""}
			${r.umstellung_bio ? `<div class="meldung orange">Umstellung auf Bio: hier wurde zuletzt konventionell produziert. Vor dem Buchen Reinigung bzw. Spülcharge bestätigen.</div>` : ""}
			${r.kuebel && r.kuebel.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Grundteig-Kübel (ältester zuerst)</div><div class="gross">${r.kuebel.map((k) => esc(k.code)).join(" · ")}</div>
				<div class="fehlt" style="font-size:16px">${r.kuebel.map((k) => esc(k.code + ": " + k.name + (k.datum ? " vom " + k.datum : "") + ", " + mg(k.menge, "Kg"))).join("<br>")}</div></div>` : ""}
			<div class="panel">${zutaten}${extra}</div>
			${ansatz.offen
				? zahlFeld("scan", `Menge (${esc(ein(ansatz.offen.einheit))}) für ${esc(ansatz.offen.anzeige)}`, ansatz.offen.vorschlag) + `<button class="link" data-a="abbrechen">Scan verwerfen</button>`
				: textFeld("scan", "Gebinde, Behälter oder Silo scannen" + (r.rework_moeglich ? " – auch Rework-Behälter" : ""))}
			${ansatz.zeilen.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Gescannt</div>${liste}</div>
			<div class="reihe"><button class="knopf gruen" data-a="abschluss">Weiter zum Buchen</button></div>` : ""}`;
		aktionen((a, d) => {
			if (a === "silo-zutat") return codeGescannt(d.silo);
			if (a === "weg") { ansatz.zeilen.splice(+d.i, 1); return ansatzZeigen(); }
			if (a === "abbrechen") { ansatz.offen = null; return ansatzZeigen(); }
			if (a === "abschluss") return ansatzAbschluss();
			beiAllgemein(a);
		});
		enter("scan", (v) => (ansatz.offen ? mengeEingegeben(v) : codeGescannt(v)));
		fokus("scan");
		if (ansatz.offen) setTimeout(() => document.getElementById("scan").select(), 40);
	}

	async function codeGescannt(code) {
		if (!code) return;
		const r = ansatz.rezept;
		let info = {};
		try { info = await api("info", { code }); } catch (e) { ansatzZeigen(); return meldung("rot", e.message); }
		if (info.typ === "palette") { ansatzZeigen(); return meldung("rot", "Das ist eine Palette. Bitte Kiste, Behälter oder Gebinde scannen."); }
		const passende = r.zutaten.find((z) => z.artikel === info.artikel);
		let ziel = passende ? passende.menge - gescannt(passende.artikel) : null;
		if (ziel != null && info.inhalt != null && info.typ !== "silo") ziel = Math.min(ziel, info.inhalt);
		const anzeige = (info.artikelname || code) + (info.typ === "silo" ? "" : " · " + code);
		ansatz.offen = { code, anzeige, einheit: passende ? passende.einheit : null, vorschlag: ziel && ziel > 0 ? rund(ziel) : "" };
		// Grundteig-Kübel kommt immer ganz in den Kneter: keine Mengenabfrage
		if (info.typ === "behaelter" && passende && passende.stufe === "Grundteig" && info.inhalt > 0) return mengeEingegeben(String(info.inhalt));
		ansatzZeigen();
	}

	async function mengeEingegeben(wert) {
		const menge = zahl(wert);
		const code = ansatz.offen.code;
		if (menge <= 0) return meldung("rot", "Bitte eine Menge eingeben.");
		try {
			const z = await api("pruefe_zeile", { station: zustand.station, ziel: ansatz.rezept.artikel, code, menge });
			ansatz.zeilen.push(z);
			ansatz.offen = null;
			ansatzZeigen();
			meldung("gruen", "OK: " + z.name + " " + mg(z.menge, z.einheit), z.charge ? "Charge " + z.charge : z.silo ? "aus " + z.silo + " (Charge wird nach FIFO zugeteilt)" : "");
		} catch (e) {
			ansatz.offen = null;
			ansatzZeigen();
			meldung("rot", e.message);
		}
	}

	function ansatzAbschluss() {
		const r = ansatz.rezept;
		const summe = ansatz.zeilen.filter((z) => !z.einheit || z.einheit === (r.einheit || "Kg")).reduce((s, z) => s + z.menge, 0);
		const zaehlen = r.einheiten && r.einheiten.length > 1;
		let einheit = ansatz.einheit || (zaehlen ? r.einheiten[0].einheit : null);
		const kgVorschlag = rund(summe * r.ausbeute);
		const vorschlag = zaehlen ? Math.floor(kgVorschlag / faktorVon(r.einheiten, einheit) + 1e-6) : kgVorschlag;
		const fertigware = r.stufe === "Fertigware";
		app.innerHTML = kopf(r.name, true) + `
			<div class="panel"><div class="zeile"><div>${r.einheit === "Kg" ? "Eingewogen" : "Eingesetzt"}</div><div class="rechts">${esc(mg(summe, r.einheit))}</div></div></div>
			${zaehlen ? einheitWahl(r.einheiten, einheit, r.einheit) : ""}
			<div id="vorschau"></div>
			${zahlFeld("aus", zaehlen ? `Ausbringung – wie viele <span id="einheit-text">${esc(einheit)}</span>?` : "Ausbringung (" + ein(r.einheit) + ")" + (r.ausbeute < 0.999 || r.ausbeute > 1.001 ? " – Vorschlag laut Rezept" : ""), vorschlag)}
			${r.ausgabe_silo ? `<p class="fehlt">Geht in ${esc(r.ausgabe_silo)}.</p>`
				: fertigware ? textFeld("scan", "Palette scannen (optional)") + `<div class="reihe"><button class="knopf" data-a="neue-palette">+ Neue Palette (Etikett drucken)</button></div>`
				: textFeld("scan", "Zielbehälter / Kiste scannen (optional)")}
			${pruefFelder(r.pruefungen, "ph")}
			<div class="reihe"><button class="knopf" data-a="zurueck-ansatz">← Zutaten</button><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		aktionen(async (a, d) => {
			if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("aus"); }
			if (a === "zurueck-ansatz") return ansatzZeigen();
			if (a === "buchen") return ansatzBuchen(zaehlen ? einheit : null);
			if (a === "neue-palette") {
				try {
					const p = await api("palette_neu", { station: zustand.station, typ: "Lagerpalette" });
					document.getElementById("scan").value = p.nve;
					etikettDrucken(p.nve);
					meldung("gruen", "Neue Palette " + p.nve, "Etikett wird gedruckt.");
				} catch (e) { meldung("rot", e.message); }
				return;
			}
			beiAllgemein(a);
		});
		enter("aus", () => fokus(document.getElementById("scan") ? "scan" : "aus"));
		enter("scan", () => {});
		if (fertigware) {
			api("vorschau", { station: zustand.station, ziel: r.artikel, zeilen: ansatz.zeilen.map((z) => ({ code: z.code, menge: z.menge })) })
				.then((v) => {
					const el = document.getElementById("vorschau");
					if (!el || !v || !(v.los || v.mhd)) return;
					el.innerHTML = `<div class="panel"><div class="fehlt" style="font-size:16px">Am Beuteldrucker einstellen</div>
						<div class="gross">${v.los ? "Los " + esc(v.los) : ""}${v.mhd ? " · MHD " + esc(v.mhd) : ""}</div>
						${v.kennzeichen && v.kennzeichen.length ? `<div>${kennzeichenMarken(v.kennzeichen)}${v.oeko_nr ? ` <b>${esc(v.oeko_nr)}</b>` : ""}</div>` : ""}
						${v.los_vorhanden ? `<div class="fehlt" style="font-size:16px">Los von heute läuft schon, diese Ware kommt dazu.</div>` : ""}</div>` +
						(v.mhd_sinkt ? `<div class="meldung orange">MHD sinkt von ${esc(v.mhd_bisher)} auf ${esc(v.mhd)}: Drucker umstellen, gedruckte Beutel prüfen.</div>` : "");
				}).catch(() => {});
		}
		fokus("aus");
		setTimeout(() => { const f = document.getElementById("aus"); if (f) f.select(); }, 40);
	}

	async function ansatzBuchen(einheit) {
		const knopf = app.querySelector('[data-a="buchen"]');
		if (knopf) { knopf.disabled = true; knopf.textContent = "Bucht …"; }
		const ziel = document.getElementById("scan");
		const wert = zahl(document.getElementById("aus").value);
		try {
			const e = await api("herstellen", {
				station: zustand.station,
				ziel: ansatz.rezept.artikel,
				zeilen: ansatz.zeilen.map((z) => ({ code: z.code, menge: z.menge })),
				ausbringung: einheit ? null : wert,
				anzahl: einheit ? wert : null,
				einheit,
				ziel_behaelter: ziel ? ziel.value.trim() || null : null,
				kundenauftrag: ansatz.auftrag ? ansatz.auftrag.auftrag : null,
				pruefwerte: pruefWerte(ansatz.rezept.pruefungen, "ph"),
			});
			const zeilen = [
				e.los ? "Los: " + e.los + (e.los !== e.charge ? " (" + e.charge + ")" : "") : "Neue Charge: " + e.charge,
				e.anzahl ? "Menge: " + stk(e.anzahl, ein(e.einheit)) + " (" + mg(e.menge, ansatz.rezept.einheit) + ")" : "Menge: " + mg(e.menge, ansatz.rezept.einheit),
				e.behaelter ? "Behälter: " + e.behaelter : "",
				e.palette ? "Auf Palette: " + e.palette : "",
				e.kundenauftrag ? "Kundenauftrag: " + e.kundenauftrag : "",
				e.mhd ? "Verwendbar bis / MHD: " + e.mhd : "",
				e.kennzeichen ? "Kennzeichen: " + e.kennzeichen : "",
				e.gesperrt ? "Gesperrt bis zur Freigabe durch die QS" : "",
			].filter(Boolean);
			const extra = e.palette ? `<button class="knopf" data-a="etikett">Paletten-Etikett drucken</button><button class="knopf" data-a="palette">Palette anzeigen</button>` : "";
			ergebnis(e.name, zeilen, e.hinweise, extra)((a) => {
				if (a === "etikett") return etikettDrucken(e.palette);
				if (a === "palette") return paletteLaden(e.palette);
				beiAllgemein(a);
			});
		} catch (err) {
			if (knopf) { knopf.disabled = false; knopf.textContent = "Buchen"; }
			meldung("rot", err.message);
		}
	}

	// ------------------------------------------------------------------ Rework / Bruch
	async function reworkStart() {
		app.innerHTML = kopf(zustand.nur_fertigware ? "Packbruch" : "Rework / Bruch", true) + `<p>In welchen Rework-Behälter?</p><div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = await api("rework_artikel");
			document.getElementById("liste").innerHTML = liste.map((r) => `<button class="knopf" data-a="rw" data-artikel="${esc(r.artikel)}" data-name="${esc(r.name)}">${esc(r.name)}<small>${esc(r.allergengruppe || "")}</small></button>`).join("") || "Keine Rework-Artikel angelegt.";
			suche("liste");
			aktionen((a, d) => (a === "rw" ? reworkErfassen(d.artikel, d.name) : beiAllgemein(a)));
		} catch (e) { meldung("rot", e.message); }
	}

	function reworkErfassen(artikel, name) {
		app.innerHTML = kopf(name, true) +
			textFeld("scan", "Herkunft scannen: Teigbehälter, Kiste oder Charge") +
			zahlFeld("menge", "Menge (kg)") +
			textFeld("ziel", "Rework-Behälter scannen (optional)") +
			`<div class="reihe"><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		aktionen(async (a) => {
			if (a !== "buchen") return beiAllgemein(a);
			try {
				const e = await api("rework_erfassen", {
					station: zustand.station,
					quelle: document.getElementById("scan").value.trim(),
					menge: zahl(document.getElementById("menge").value),
					rework_artikel: artikel,
					ziel_behaelter: document.getElementById("ziel").value.trim() || null,
				});
				ergebnis(e.name, ["Neue Rework-Charge: " + e.charge, "Menge: " + kg(e.menge), e.behaelter ? "Behälter: " + e.behaelter : "", e.mhd ? "Verwendbar bis: " + e.mhd : ""].filter(Boolean), e.hinweise)(beiAllgemein);
			} catch (err) { meldung("rot", err.message); }
		});
		enter("scan", () => fokus("menge"));
		enter("menge", () => fokus("ziel"));
		fokus("scan");
	}

	// ------------------------------------------------------------------ Wareneingang
	let artikelListe = [];
	async function wareneingangStart() {
		app.innerHTML = kopf("Wareneingang", true) + `<p>Welcher Artikel?</p><div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			artikelListe = await api("wareneingang_artikel");
			document.getElementById("liste").innerHTML = artikelListe.map((r, i) => `<button class="knopf" data-a="art" data-i="${i}">${esc(r.name)}<small>${esc(r.artikel)}${r.kt_freigabe_pflicht ? " · Freigabe durch QS" : ""}${r.bio ? " · BIO" : ""}</small></button>`).join("");
			suche("liste");
			aktionen((a, d) => (a === "art" ? wareneingangErfassen(artikelListe[+d.i]) : beiAllgemein(a)));
		} catch (e) { meldung("rot", e.message); }
	}

	function wareneingangErfassen(art) {
		const ARTEN = ["Sack", "Fass", "IBC", "Eimer", "Karton", "Kanister", "BigBag", "Sonstiges"];
		let gebindeart = "Sack";
		const lief = art.lieferanten || [];
		app.innerHTML = kopf(art.name, true) +
			(art.bio ? `<div class="panel">${kennzeichenMarken(["Bio"])} <span class="fehlt" style="font-size:16px">Nur Lieferanten mit gültigem Öko-Zertifikat.</span></div>` : "") +
			(art.bio && !lief.length ? `<div class="meldung rot">Kein Lieferant mit gültigem Öko-Zertifikat hinterlegt. Annahme als Bio nicht möglich.<small>Zertifikat beim Lieferanten im Büro eintragen.</small></div>` : "") +
			(lief.length ? `<label>Lieferant${art.bio ? "" : " (optional)"}</label><select id="lieferant" class="feld">${art.bio ? "" : `<option value="">–</option>`}${lief.map((l) => `<option value="${esc(l.lieferant)}">${esc(l.name)}${l.bio_ok ? " · Bio-zertifiziert" : ""}</option>`).join("")}</select>` : "") +
			textFeld("scan", "Charge des Lieferanten (scannen oder eingeben)") +
			`${art.has_expiry_date ? datumFeld("mhd", "MHD") : ""}
			${art.silo ? `<label>Wohin?</label><select id="ziel" class="feld"><option value="${esc(art.silo)}">ins ${esc(art.silo)}</option><option value="">als Gebinde ins Lager</option></select>` : ""}
			<div id="gebinde-box" style="${art.silo ? "display:none" : ""}">
				<label>Gebindeart</label><div class="einheiten">${ARTEN.map((a) => `<button type="button" data-a="einheit" data-e="${a}" class="${a === gebindeart ? "an" : ""}">${a}</button>`).join("")}</div>
				${zahlFeld("anzahl", "Wie viele Gebinde?", 1)}
			</div>` +
			zahlFeld("menge", `<span id="menge-text">${art.silo ? "Menge" : "Menge je Gebinde"}</span> (${esc(ein(art.stock_uom))})`) +
			pruefFelder(art.pruefungen, "pw") +
			`<div class="reihe"><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		const zielFeld = document.getElementById("ziel");
		if (zielFeld) zielFeld.addEventListener("change", () => {
			const silo = !!zielFeld.value;
			document.getElementById("gebinde-box").style.display = silo ? "none" : "";
			document.getElementById("menge-text").textContent = silo ? "Menge" : "Menge je Gebinde";
		});
		aktionen(async (a, d) => {
			if (a === "einheit") { gebindeart = d.e; return einheitSetzen(gebindeart); }
			if (a !== "buchen") return beiAllgemein(a);
			const knopf = app.querySelector('[data-a="buchen"]');
			if (knopf) { knopf.disabled = true; knopf.textContent = "Bucht …"; }
			try {
				const ziel = document.getElementById("ziel");
				const mhd = document.getElementById("mhd");
				if (mhd && mhd.value && !datumIso(mhd.value)) throw new Error("MHD " + mhd.value + " ist kein gültiges Datum (z. B. 300628 oder 30.06.28).");
				const silo = ziel ? ziel.value || null : null;
				const e = await api("wareneingang", {
					station: zustand.station,
					artikel: art.artikel,
					lieferantencharge: document.getElementById("scan").value.trim(),
					lieferant: document.getElementById("lieferant") ? document.getElementById("lieferant").value || null : null,
					menge: zahl(document.getElementById("menge").value),
					mhd: mhd ? datumIso(mhd.value) : null,
					silo,
					gebinde: silo ? 0 : Math.max(1, Math.round(zahl(document.getElementById("anzahl").value))),
					gebindeart: silo ? null : gebindeart,
					pruefwerte: pruefWerte(art.pruefungen, "pw"),
				});
				if (e.abgelehnt) {
					app.innerHTML = kopf(e.name, true) + `<div class="meldung rot">Annahme verweigert<small>${e.gruende.map(esc).join("<br>")}</small></div>` +
						e.korrektur.map((k) => `<div class="meldung orange">${esc(k)}</div>`).join("") +
						`<p class="fehlt">Nichts gebucht. Die Prüfung ist protokolliert.</p><div class="reihe"><button class="knopf blau" data-a="zurueck">Fertig</button></div>`;
					ton(false);
					return aktionen(beiAllgemein);
				}
				const druck = () => window.open("/gebinde_etikett?druck=1&codes=" + encodeURIComponent(e.gebinde.join(",")), "_blank");
				if (e.gebinde && e.gebinde.length) druck();
				ergebnis(e.name, ["Charge: " + e.charge, "Menge: " + mg(e.menge, art.stock_uom), "Ort: " + e.lager,
					e.gebinde && e.gebinde.length ? "Gebinde: " + e.gebinde.join(", ") : "", e.mhd ? "MHD: " + e.mhd : ""].filter(Boolean),
					(e.gesperrt ? ["Gesperrt bis zur Freigabe durch die QS (" + (e.sperrgrund || "") + ")"] : []).concat(e.hinweise || []),
					e.gebinde && e.gebinde.length ? `<button class="knopf" data-a="etiketten">Gebinde-Etiketten drucken</button>` : "")((a2) => (a2 === "etiketten" ? druck() : beiAllgemein(a2)));
			} catch (err) {
				if (knopf) { knopf.disabled = false; knopf.textContent = "Buchen"; }
				meldung("rot", err.message);
			}
		});
		enter("scan", () => { const m = document.getElementById("mhd"); if (m) m.focus(); else fokus("menge"); });
		enter("anzahl", () => fokus("menge"));
		enter("menge", () => {});
		fokus("scan");
	}

	// ------------------------------------------------------------------ Anzahl-Dialog (Kartons/Beutel)
	// Zeigt Anzahl mit Ziffernblock und Einheiten-Wahl. fertig(anzahl, einheit) beim OK.
	function anzahlAbfragen(titel, unterzeile, einheiten, start, fertig, zurueck) {
		let einheit = start && start.einheit ? start.einheit : einheiten[0].einheit;
		app.innerHTML = kopf(titel, true) + (unterzeile ? `<div class="panel">${unterzeile}</div>` : "") +
			einheitWahl(einheiten, einheit, i.lagereinheit) +
			zahlFeld("anzahl", `Wie viele <span id="einheit-text">${esc(einheit)}</span>?`, start && start.anzahl != null ? rund(start.anzahl) : "");
		aktionen((a, d) => {
			if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("anzahl"); }
			if (a === "zurueck" && zurueck) return zurueck();
			beiAllgemein(a);
		});
		enter("anzahl", (v) => {
			const n = zahl(v);
			if (n <= 0) return meldung("rot", "Bitte eine Anzahl eingeben.");
			fertig(n, einheit);
		});
		fokus("anzahl");
		setTimeout(() => { const f = document.getElementById("anzahl"); if (f) f.select(); }, 40);
	}

	// ------------------------------------------------------------------ Paletten
	function palettenStart() {
		app.innerHTML = kopf("Paletten", true) + textFeld("scan", "Palette scannen (NVE)") + `
			<div class="raster" style="margin-top:16px">
				<button class="knopf blau" data-a="neu" data-typ="Lagerpalette">+ Neue Lagerpalette<small>für die Verpackung</small></button>
				<button class="knopf blau" data-a="neu" data-typ="Versandpalette">+ Neue Versandpalette<small>zum Kommissionieren</small></button>
			</div>`;
		aktionen(async (a, d) => {
			if (a === "neu") {
				try {
					const p = await api("palette_neu", { station: zustand.station, typ: d.typ });
					etikettDrucken(p.nve);
					paletteZeigen(p, "Neue " + p.art + " angelegt, Etikett wird gedruckt.");
				} catch (e) { meldung("rot", e.message); }
				return;
			}
			beiAllgemein(a);
		});
		enter("scan", (v) => v && paletteLaden(v));
		fokus("scan");

	async function paletteLaden(code, hinweis) {
		try { paletteZeigen(await api("palette_info", { code }), hinweis); } catch (e) { meldung("rot", e.message); }
	}

	function statusMarke(s) {
		const farbe = { Offen: "gruen", Geschlossen: "", Versendet: "orange", Leer: "" }[s] || "";
		return `<span class="marke ${farbe}">${esc(s)}</span>`;
	}

	function positionenHtml(p, aktion) {
		if (!p.positionen.length) return `<p class="fehlt">Palette ist leer.</p>`;
		return p.positionen.map((x, i) => `<button class="pos" ${aktion ? `data-a="${aktion}" data-i="${i}"` : "disabled"}>
			<span>${esc(x.name)}<small>Los ${esc(x.charge)}${x.mhd ? " · MHD " + esc(x.mhd) : ""}${x.gesperrt ? " · GESPERRT" : ""}</small></span>
			<span class="rechts">${esc(stk(x.anzahl, x.einheit))}<small>${esc(kg(x.menge))}</small></span></button>`).join("");
	}

	function paletteZeigen(p, hinweis) {
		const aktiv = p.status === "Offen" || p.status === "Geschlossen" || p.status === "Leer";
		app.innerHTML = kopf("Palette", true) + `
			<div class="panel"><div class="nve">${esc(p.nve.slice(0, -6))}<span style="color:#6ea0ff">${esc(p.nve.slice(-6))}</span> ${statusMarke(p.status)}
				<br><small>${esc(p.art)}${p.kartons ? " · " + esc(p.kartons) : ""}${p.menge ? " · " + esc(kg(p.menge)) : ""}${p.lieferschein ? " · Lieferschein " + esc(p.lieferschein) : ""}</small></div>
				${p.fuellung ? `<div style="margin-top:10px"><div style="height:14px;background:var(--panel2);border-radius:7px;overflow:hidden"><div style="height:100%;width:${Math.min(100, Math.round(p.fuellung.anteil * 100))}%;background:${p.fuellung.ueber ? "var(--rot)" : p.fuellung.voll ? "var(--gruen)" : "var(--blau)"}"></div></div>
					<div class="fehlt" style="font-size:16px;margin-top:4px">${p.fuellung.ueber ? "ÜBERLADEN · " : p.fuellung.voll ? "VOLL · " : ""}${esc(p.fuellung.text || Math.round(p.fuellung.anteil * 100) + " % voll")}</div></div>` : ""}
				${p.test ? `<div class="meldung orange">Test-NVE: Etikett nicht an Kunden geben (GS1-Basisnummer fehlt in den Einstellungen).</div>` : ""}
			</div>
			${aktiv && p.positionen.length ? `<p class="fehlt">Position antippen, um Kartons auf eine andere Palette umzupacken.</p>` : ""}
			${positionenHtml(p, aktiv ? "pos" : null)}
			<div class="reihe">
				${aktiv ? `<button class="knopf blau" data-a="laden">+ Lose Kartons laden<small>Los scannen</small></button>` : ""}
				<button class="knopf" data-a="etikett">Etikett drucken</button>
				${p.status === "Offen" ? `<button class="knopf" data-a="schliessen">Palette schließen</button>` : ""}
				${p.status === "Geschlossen" ? `<button class="knopf" data-a="oeffnen">Wieder öffnen</button>` : ""}
			</div>`;
		if (hinweis) meldung("gruen", hinweis);
		aktionen(async (a, d) => {
			try {
				if (a === "etikett") return etikettDrucken(p.nve);
				if (a === "schliessen") return paletteZeigen(await api("palette_schliessen", { station: zustand.station, palette: p.nve }), "Palette geschlossen.");
				if (a === "oeffnen") return paletteZeigen(await api("palette_oeffnen", { station: zustand.station, palette: p.nve }), "Palette geöffnet.");
				if (a === "laden") return kartonsLaden(p);
				if (a === "pos") return umpacken(p, p.positionen[+d.i]);
			} catch (e) { return meldung("rot", e.message); }
			if (a === "zurueck") return palettenStart();
			beiAllgemein(a);
		});
	}

	function kartonsLaden(p) {
		app.innerHTML = kopf("Auf Palette …" + p.nve.slice(-6), true) + textFeld("scan", "Los scannen (Etikett am Karton)");
		aktionen((a) => (a === "zurueck" ? paletteZeigen(p) : beiAllgemein(a)));
		enter("scan", async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ !== "charge") throw new Error("Bitte das Los scannen, nicht " + (i.typ === "palette" ? "eine Palette" : "einen Behälter") + ".");
				const einheiten = await api("einheiten", { artikel: i.artikel });
				anzahlAbfragen("Los " + i.charge, esc(i.artikelname) + (i.mhd ? " · MHD " + esc(i.mhd) : ""), einheiten, null, async (n, e) => {
					try {
						paletteZeigen(await api("palette_beladen", { station: zustand.station, palette: p.nve, code: i.charge, anzahl: n, einheit: e }), stk(n, e) + " geladen.");
					} catch (err) { meldung("rot", err.message); }
				}, () => paletteZeigen(p));
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	function umpacken(p, pos) {
		anzahlAbfragen("Umpacken", `${esc(pos.name)} · Los ${esc(pos.charge)}<br><span class="fehlt">Auf der Palette: ${esc(stk(pos.anzahl, pos.einheit))}</span>`,
			[{ einheit: pos.einheit, faktor: 1 }], { einheit: pos.einheit, anzahl: pos.anzahl }, (n) => {
				app.innerHTML = kopf("Umpacken: " + stk(n, pos.einheit), true) + textFeld("scan", "Zielpalette scannen") +
					`<div class="reihe"><button class="knopf blau" data-a="neu">+ Neue Versandpalette</button></div>`;
				const los = async (nach) => {
					try {
						const ziel = await api("palette_umpacken", { station: zustand.station, von: p.nve, nach, charge: pos.charge, anzahl: n, einheit: pos.einheit });
						paletteZeigen(ziel, stk(n, pos.einheit) + " umgepackt.");
					} catch (e) { meldung("rot", e.message); }
				};
				aktionen(async (a) => {
					if (a === "neu") {
						try {
							const neu = await api("palette_neu", { station: zustand.station, typ: "Versandpalette" });
							etikettDrucken(neu.nve);
							return los(neu.nve);
						} catch (e) { return meldung("rot", e.message); }
					}
					if (a === "zurueck") return paletteZeigen(p);
					beiAllgemein(a);
				});
				enter("scan", (v) => v && los(v));
				fokus("scan");
			}, () => paletteZeigen(p));
	}

	// ------------------------------------------------------------------ Lieferung
	let lieferung;
	async function lieferungStart() {
		app.innerHTML = kopf("Lieferung", true) + `<p>An welchen Kunden?</p><div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = await api("kunden");
			document.getElementById("liste").innerHTML = liste.map((k) => `<button class="knopf" data-a="kunde" data-name="${esc(k.name)}" data-titel="${esc(k.customer_name)}">${esc(k.customer_name)}</button>`).join("") || "Keine Kunden angelegt.";
			suche("liste");
			aktionen((a, d) => {
				if (a !== "kunde") return beiAllgemein(a);
				lieferung = { kunde: d.name, titel: d.titel, zeilen: [], auftrag: null, positionen: [] };
				lieferAuftragWaehlen();
			});
		} catch (e) { meldung("rot", e.message); }
	}

	async function lieferAuftragWaehlen() {
		let liste = [];
		try { liste = await api("auftraege", { station: zustand.station, kunde: lieferung.kunde }); } catch (e) { /* ohne */ }
		const auftraege = {};
		liste.forEach((z) => { (auftraege[z.auftrag] = auftraege[z.auftrag] || []).push(z); });
		const namen = Object.keys(auftraege);
		if (!namen.length) return lieferungZeigen();
		app.innerHTML = kopf("Lieferung an " + lieferung.titel, true) + `<p>Zu welchem Kundenauftrag?</p><div class="raster">
			${namen.map((n) => `<button class="knopf blau" data-a="auftrag" data-n="${esc(n)}">${esc(n)}<small>${auftraege[n].map((z) =>
				esc(z.name) + ": " + esc(z.offen_liefern_text) + " offen").join("<br>")}${auftraege[n][0].termin ? "<br>Termin " + esc(auftraege[n][0].termin) : ""}</small></button>`).join("")}
			<button class="knopf" data-a="ohne">Ohne Auftrag</button></div>`;
		aktionen((a, d) => {
			if (a === "auftrag") { lieferung.auftrag = d.n; lieferung.positionen = auftraege[d.n]; return lieferungZeigen(); }
			if (a === "ohne") return lieferungZeigen();
			if (a === "zurueck") return lieferungStart();
			beiAllgemein(a);
		});
	}

	function lieferungZeilePlus(anfrage, positionen) {
		lieferung.zeilen.push({ anfrage, positionen });
		lieferungZeigen();
		const n = positionen.reduce((s, x) => s + x.anzahl, 0);
		meldung("gruen", "OK: " + (anfrage.ganz ? "ganze Palette " + anfrage.palette.slice(-6) : positionen[0].name) + " · " + stk(n, positionen[0].einheit));
	}

	function lieferungZeigen() {
		const liste = lieferung.zeilen.map((z, i) => z.positionen.map((x, j) => `<div class="zeile"><div>${esc(x.name)}<br><span class="fehlt" style="font-size:16px">Los ${esc(x.charge)}${x.palette ? " · Palette …" + esc(x.palette.slice(-6)) : " · lose"}</span></div>
			<div class="rechts">${esc(stk(x.anzahl, x.einheit))} ${j === 0 ? `<button class="x" data-a="weg" data-i="${i}">✕</button>` : ""}</div></div>`).join("")).join("");
		const gescanntJe = {};
		lieferung.zeilen.forEach((z) => z.positionen.forEach((x) => { gescanntJe[x.artikel] = (gescanntJe[x.artikel] || 0) + x.menge; }));
		const auftragHtml = lieferung.auftrag ? `<div class="panel"><div class="fehlt" style="font-size:16px">Kundenauftrag ${esc(lieferung.auftrag)}</div>${lieferung.positionen.map((z) => {
			const offen = (z.menge - z.geliefert) * (z.faktor || 1);
			const jetzt = gescanntJe[z.artikel] || 0;
			const fertig = jetzt >= offen - 1e-6;
			return `<div class="zeile"><div class="${fertig ? "ok" : ""}">${fertig ? "✔" : "○"} ${esc(z.name)}</div><div class="rechts ${fertig ? "ok" : "fehlt"}">${esc(zerlegen(z.einheiten, jetzt))}<br><small>von ${esc(zerlegen(z.einheiten, offen))}</small></div></div>`;
		}).join("")}</div>` : "";
		app.innerHTML = kopf("Lieferung an " + lieferung.titel, true) + auftragHtml +
			textFeld("scan", "Palette oder Los scannen") +
			(lieferung.zeilen.length ? `<div class="panel">${liste}</div><div class="reihe"><button class="knopf gruen" data-a="buchen">Lieferschein buchen</button></div>` : "");
		aktionen(async (a, d) => {
			if (a === "weg") { lieferung.zeilen.splice(+d.i, 1); return lieferungZeigen(); }
			if (a !== "buchen") return beiAllgemein(a);
			const knopf = app.querySelector('[data-a="buchen"]');
			if (knopf) { knopf.disabled = true; knopf.textContent = "Bucht …"; }
			try {
				const e = await api("lieferung", { station: zustand.station, kunde: lieferung.kunde, kundenauftrag: lieferung.auftrag, zeilen: lieferung.zeilen.map((z) => z.anfrage) });
				ergebnis("Lieferung", ["Lieferschein: " + e.lieferschein, "Kunde: " + e.kunde, e.kundenauftrag ? "Kundenauftrag: " + e.kundenauftrag : "", e.positionen + " Position(en), " + kg(e.menge),
					e.paletten.length ? "Paletten: " + e.paletten.join(", ") : ""].filter(Boolean), e.hinweise)(beiAllgemein);
			} catch (err) {
				if (knopf) { knopf.disabled = false; knopf.textContent = "Lieferschein buchen"; }
				meldung("rot", err.message);
			}
		});
		enter("scan", async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ === "palette") return lieferPalette(i);
				if (i.typ !== "charge") throw new Error("Bitte eine Palette oder ein Los scannen.");
				const einheiten = await api("einheiten", { artikel: i.artikel });
				anzahlAbfragen("Lose Kartons: Los " + i.charge, esc(i.artikelname) + (i.mhd ? " · MHD " + esc(i.mhd) : ""), einheiten, null, async (n, e) => {
					const anfrage = { code: i.charge, anzahl: n, einheit: e };
					try { lieferungZeilePlus(anfrage, await api("pruefe_lieferzeile", { station: zustand.station, ...anfrage })); }
					catch (err) { lieferungZeigen(); meldung("rot", err.message); }
				}, lieferungZeigen);
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	function lieferPalette(p) {
		const aktiv = p.status === "Offen" || p.status === "Geschlossen";
		app.innerHTML = kopf("Palette …" + p.nve.slice(-6), true) +
			`<div class="panel"><div class="nve">${esc(p.nve)} ${statusMarke(p.status)}<br><small>${esc(p.kartons || "")} · ${esc(kg(p.menge || 0))}</small></div></div>` +
			(aktiv && p.positionen.length ? `<div class="reihe"><button class="knopf gruen" data-a="ganz">Ganze Palette liefern</button></div>
				<p class="fehlt">Oder Position antippen, um nur einzelne Kartons zu nehmen (Palette wird angebrochen).</p>` : "") +
			positionenHtml(p, aktiv ? "pos" : null);
		aktionen(async (a, d) => {
			if (a === "zurueck") return lieferungZeigen();
			if (a === "ganz") {
				const anfrage = { palette: p.nve, ganz: 1 };
				try { return lieferungZeilePlus(anfrage, await api("pruefe_lieferzeile", { station: zustand.station, ...anfrage })); }
				catch (e) { return meldung("rot", e.message); }
			}
			if (a === "pos") {
				const pos = p.positionen[+d.i];
				return anzahlAbfragen("Von Palette …" + p.nve.slice(-6), `${esc(pos.name)} · Los ${esc(pos.charge)}<br><span class="fehlt">Auf der Palette: ${esc(stk(pos.anzahl, pos.einheit))}</span>`,
					[{ einheit: pos.einheit, faktor: 1 }], { einheit: pos.einheit }, async (n) => {
						const anfrage = { palette: p.nve, charge: pos.charge, anzahl: n, einheit: pos.einheit };
						try { lieferungZeilePlus(anfrage, await api("pruefe_lieferzeile", { station: zustand.station, ...anfrage })); }
						catch (e) { lieferungZeigen(); meldung("rot", e.message); }
					}, () => lieferPalette(p));
			}
			beiAllgemein(a);
		});
	}

	// ------------------------------------------------------------------ Umlagern
	let umgelagert = [];
	let umlagerNach = null;
	async function umlagernStart(hinweis) {
		if (!zustand.umlager_ziel && !umlagerNach) return umlagerZielWaehlen();
		const nach = zustand.umlager_ziel || umlagerNach.name;
		const titel = zustand.umlager_ziel || umlagerNach.titel;
		app.innerHTML = kopf("Umlagern nach " + titel, true) +
			(zustand.umlager_ziel ? "" : `<div class="reihe"><button class="knopf" data-a="ziel-wechseln">Anderes Ziel wählen</button></div>`) +
			textFeld("scan", "Palette oder Los scannen") +
			(umgelagert.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Heute hier umgelagert</div>${umgelagert.map((x) =>
				`<div class="zeile"><div>${esc(x.name)}<br><span class="fehlt" style="font-size:16px">Los ${esc(x.charge)}</span></div><div class="rechts">${esc(stk(x.anzahl, x.einheit))}</div></div>`).join("")}</div>` : "");
		if (hinweis) meldung("gruen", hinweis);
		aktionen((a) => {
			if (a === "ziel-wechseln") { umlagerNach = null; return umlagerZielWaehlen(); }
			beiAllgemein(a);
		});
		const buchen = async (args) => {
			try {
				const e = await api("umlagern", { station: zustand.station, nach, ...args });
				umgelagert = e.positionen.concat(umgelagert).slice(0, 12);
				umlagernStart("Umgelagert: " + e.positionen.map((x) => stk(x.anzahl, x.einheit)).join(", ") + " nach " + e.nach);
			} catch (err) { umlagernStart(); meldung("rot", err.message); }
		};
		enter("scan", async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ === "palette") {
					const p = i;
					app.innerHTML = kopf("Palette …" + p.nve.slice(-6), true) +
						`<div class="panel"><div class="nve">${esc(p.nve)} ${statusMarke(p.status)}<br><small>${esc(p.kartons || "")}</small></div></div>` +
						`<div class="reihe"><button class="knopf gruen" data-a="ganz">Ganze Palette umlagern</button></div><p class="fehlt">Oder Position antippen für einzelne Kartons.</p>` +
						positionenHtml(p, "pos");
					aktionen((a, d) => {
						if (a === "zurueck") return umlagernStart();
						if (a === "ganz") return buchen({ palette: p.nve, ganz: 1 });
						if (a === "pos") {
							const pos = p.positionen[+d.i];
							return anzahlAbfragen("Von Palette …" + p.nve.slice(-6), `${esc(pos.name)} · Los ${esc(pos.charge)}`,
								[{ einheit: pos.einheit, faktor: 1 }], { einheit: pos.einheit }, (n) => buchen({ palette: p.nve, charge: pos.charge, anzahl: n, einheit: pos.einheit }), umlagernStart);
						}
						beiAllgemein(a);
					});
					return;
				}
				if (i.typ !== "charge") throw new Error("Bitte eine Palette oder ein Los scannen.");
				const einheiten = await api("einheiten", { artikel: i.artikel });
				anzahlAbfragen("Los " + i.charge, esc(i.artikelname), einheiten, null, (n, e) => buchen({ code: i.charge, anzahl: n, einheit: e }), umlagernStart);
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	async function umlagerZielWaehlen() {
		app.innerHTML = kopf("Umlagern wohin?", true) + `<div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const ziele = await api("umlager_ziele", { station: zustand.station });
			if (!ziele.length) throw new Error("Es ist noch kein Lagerort als Umlager-Ziel eingerichtet.");
			document.getElementById("liste").innerHTML = ziele.map((z, i) =>
				`<button class="knopf${z.lagerverkauf ? " gruen" : ""}" data-a="ziel" data-i="${i}">${esc(z.titel)}${z.lagerverkauf ? "<br><small>Lagerverkauf</small>" : ""}</button>`).join("");
			aktionen((a, d) => {
				if (a === "ziel") { umlagerNach = ziele[+d.i]; return umlagernStart(); }
				beiAllgemein(a);
			});
		} catch (e) { meldung("rot", e.message); }
	}

	// ------------------------------------------------------------------ Silo leer
	async function siloLeer() {
		app.innerHTML = kopf("Silo leer melden", true) + `<p>Welches Silo oder welcher Tank ist leer?</p><div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = await api("silos");
			document.getElementById("liste").innerHTML = liste.map((s) => `<button class="knopf" data-a="silo" data-name="${esc(s.silo)}">${esc(s.silo)}<small>rechnerisch ${esc(kg(s.bestand))}</small></button>`).join("") || "Keine Silos angelegt.";
			suche("liste");
			aktionen((a, d) => (a === "silo" ? siloBestaetigen(d.name) : beiAllgemein(a)));
		} catch (e) { meldung("rot", e.message); }
	}

	function siloBestaetigen(silo) {
		const box = document.createElement("div");
		box.className = "dialog";
		box.innerHTML = `<div class="panel"><p class="gross" style="font-size:26px">${esc(silo)} ist wirklich leer?</p>
			<p class="fehlt">Ein rechnerischer Rest wird als Silo-Differenz ausgebucht.</p>
			<div class="reihe"><button class="knopf" id="nein">Nein</button><button class="knopf rot" id="ja">Ja, ist leer</button></div></div>`;
		document.body.appendChild(box);
		box.querySelector("#nein").onclick = () => box.remove();
		box.querySelector("#ja").onclick = async () => {
			box.remove();
			try {
				const e = await api("silo_leer", { station: zustand.station, silo });
				ergebnis("Silo leer", [silo + " ist leer gemeldet.", "Rechnerischer Rest ausgebucht: " + kg(e.rest)], e.hinweise)(beiAllgemein);
			} catch (err) { meldung("rot", err.message); }
		};
	}

	// ------------------------------------------------------------------ Info
	function infoScan() {
		app.innerHTML = kopf("Info-Scan", true) + textFeld("scan", "Charge, Behälter, Silo oder Palette scannen") + `<div id="info"></div>`;
		aktionen(beiAllgemein);
		enter("scan", async (v, f) => {
			if (!v) return;
			f.value = "";
			try {
				const r = await api("info", { code: v });
				if (r.typ === "palette") {
					document.getElementById("info").innerHTML = `<div class="meldung gruen">Palette ${esc(r.nve)}</div>
						<div class="panel"><div class="zeile"><div class="fehlt">Art / Status</div><div class="rechts">${esc(r.art)} · ${esc(r.status)}</div></div>
						<div class="zeile"><div class="fehlt">Inhalt</div><div class="rechts">${esc(r.kartons || "leer")}</div></div>
						${r.lieferschein ? `<div class="zeile"><div class="fehlt">Lieferschein</div><div class="rechts">${esc(r.lieferschein)} · ${esc(r.kunde || "")}</div></div>` : ""}</div>` +
						positionenHtml(r, null);
					ton(true);
					return;
				}
				const zeilen = [];
				if (r.typ === "behaelter") zeilen.push(["Behälter", r.behaelter + " (" + r.behaelter_typ + ")"], ["Status", r.status]);
				if (r.typ === "silo") zeilen.push(["Silo/Tank", r.silo]);
				if (r.artikelname) zeilen.push(["Artikel", r.artikelname]);
				if (r.charge) zeilen.push(["Charge", r.charge]);
				if (r.stufe) zeilen.push(["Stufe", r.stufe]);
				if (r.inhalt != null) zeilen.push(["Menge", kg(r.inhalt)]);
				if (r.backtag) zeilen.push(["Backtag", r.backtag]);
				if (r.mhd) zeilen.push(["Verwendbar bis / MHD", r.mhd + (r.abgelaufen ? " – ABGELAUFEN" : "")]);
				if (r.bestand) r.bestand.forEach((b) => zeilen.push(["Im Silo", b.charge + ": " + kg(b.menge)]));
				if (r.moeglich_enthalten && r.moeglich_enthalten.length) zeilen.push(["Möglicherweise enthalten", r.moeglich_enthalten.join(", ")]);
				const gesperrt = r.sperrstatus === "Gesperrt";
				document.getElementById("info").innerHTML =
					(gesperrt ? `<div class="meldung rot">GESPERRT<small>${esc(r.sperrgrund || "")}</small></div>` : r.abgelaufen ? `<div class="meldung rot">ABGELAUFEN</div>` : `<div class="meldung gruen">${esc(v)}</div>`) +
					`<div class="panel">${zeilen.map(([k, w]) => `<div class="zeile"><div class="fehlt">${esc(k)}</div><div class="rechts">${esc(w)}</div></div>`).join("")}</div>`;
				ton(!gesperrt && !r.abgelaufen);
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	// ------------------------------------------------------------------ Start
	async function init() {
		const station = laden("kt_station");
		if (!station) return stationWaehlen();
		try {
			const s = await api("start", { station });
			zustand.station = s.station;
			zustand.typ = s.typ;
			zustand.funktionen = s.funktionen;
			zustand.stufen = s.stufen;
			zustand.nur_fertigware = s.nur_fertigware;
			zustand.umlager_ziel = s.umlager_ziel;
			startseite();
		} catch (e) {
			speichern("kt_station", "");
			stationWaehlen();
		}
	}
	init();
})();
{% endraw %}
</script>
