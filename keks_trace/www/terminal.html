				<td class="z">${esc(mg(z.menge, z.einheit))}</td><td class="z">${st.ist ? esc(mg(st.ist, z.einheit)) : "–"}</td>
				<td class="z todo">${st.todo > 0 ? esc(mg(st.todo, z.einheit)) : "–"}</td></tr>`;
		}).join("") + ansatz.zeilen.filter((z) => z.rework).map((z) => `<tr class="fertig"><td></td><td>✔ Rework: ${esc(z.name)}</td><td>${esc(z.behaelter || "")}</td>
			<td class="z">–</td><td class="z">${esc(mg(z.menge, z.einheit))}</td><td class="z">–</td></tr>`).join("");
		// Links unten: die gewählte Zutat groß, mit ihren Registrierungen
		let detail = "";
		if (sel) {
			const st = stand(sel);
			const reg = ansatz.zeilen.map((z, i) => ({ z, i })).filter((x) => x.z.artikel === sel.artikel);
			detail = `<div class="m-detail"><div class="titel"><div><b>${esc(sel.artikel)}</b> ${esc(sel.name)}<small>${esc([sel.lager, gebindeText(sel)].filter(Boolean).join(" · "))}</small></div>
				<div class="fehlt" style="font-size:16px;text-align:right">${sel.toleranz ? "Toleranz ± " + esc(mg(sel.toleranz, sel.einheit)) : ""}${st.ueber ? `<br><b style="color:#b45309">${esc(prozentText(st.ist, sel.menge))}</b>` : ""}</div></div>
				${grossZahlen(sel.menge, st.ist, st.todo, sel.einheit)}
				${reg.length ? `<div style="margin-top:8px">${reg.map((x) => `<div class="zeile"><div>${esc(x.z.charge ? "Charge " + x.z.charge : "")}${x.z.behaelter ? " · " + esc(x.z.behaelter) : ""}${x.z.silo ? " · " + esc(x.z.silo) : ""}</div>
					<div class="rechts">${esc(mg(x.z.menge, x.z.einheit))} <button class="x" data-a="weg" data-i="${x.i}">✕</button></div></div>`).join("")}</div>` : ""}</div>`;
		}
		const au = ansatz.auftrag;
		const pa = zustand.linienAuftrag;
		const links = `<div class="einwaage"><table class="tab"><thead><tr><th>Pos</th><th>Zutat</th><th>Lager</th><th class="z">Bestellt</th><th class="z">Erledigt</th><th class="z">ToDo</th></tr></thead>
				<tbody>${zeilen}</tbody></table></div>` + detail +
			(sollAnpassbar() ? `<div class="reihe"><button class="knopf" data-a="soll-anpassen">Soll an Grundteig anpassen: ${esc(mg(sollAnpassbar(), r.einheit))}</button></div>` : "") +
			(r.kuebel && r.kuebel.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Grundteig-Kübel (ältester zuerst)</div><div class="gross">${r.kuebel.map((k) => esc(k.code)).join(" · ")}</div>
				<div class="fehlt" style="font-size:16px">${r.kuebel.map((k) => esc(k.code + ": " + k.name + (k.datum ? " vom " + k.datum : "") + ", " + mg(k.menge, "Kg"))).join("<br>")}</div></div>` : "") +
			(au || pa ? `<div class="reiter"><button class="an" type="button">Registrierungen</button></div><div class="panel" style="margin-top:0" id="registrierungen">Lädt …</div>` : "");
		// Rechts: Herkunft (woher die gewählte Zutat kommt), Ziel, Eingabe
		const herkunft = ansatz.offen ? zeileKV("Gescannt", ansatz.offen.anzeige) + `<button class="link" data-a="abbrechen">Scan verwerfen</button>`
			: textFeld("scan", zustand.vorschlagen ? "Scannen (oder unten wählen)" : "Gebinde, Behälter oder Silo scannen" + (r.rework_moeglich ? " – auch Rework" : "")) +
				(sel ? (sel.vorrat ? zeileKV("Aus Vorrat", sel.vorrat)
					: sel.silo ? `<button class="knopf" data-a="silo-zutat" data-silo="${esc(sel.silo)}">${esc(sel.name)} aus ${esc(sel.silo)}</button>`
					: `<button class="knopf" data-a="auswahl" data-artikel="${esc(sel.artikel)}">${esc(sel.name)}: Charge wählen</button>`) : "");
		const ziel = zeileKV("Artikel", r.name) + zeileKV("Sollmenge", mg(r.sollmenge, r.einheit)) + (au ? zeileKV("Kundenauftrag", au.auftrag + (au.kundenname ? " · " + au.kundenname : "")) : "") +
			(r.kennzeichen && r.kennzeichen.length ? `<div class="zeile"><div class="fehlt">Kennzeichen</div><div class="rechts">${kennzeichenMarken(r.kennzeichen)}</div></div>` : "");
		const eingabe = ansatz.offen ? mengeEingabeHtml(ansatz.offen) : `<p class="fehlt" style="font-size:16px;margin:6px 0">Erst scannen, dann die Menge.</p>`;
		// Eingabe oben, damit der angedockte Ziffernblock sie nicht verdeckt; Ziel ist nur Information
		const rechts = gruppe("Herkunft", herkunft) + gruppe("Eingabe", eingabe) +
			(ansatz.zeilen.length && !ansatz.offen ? `<button class="knopf gruen" data-a="abschluss">Weiter zum Buchen<small>${ansatz.zeilen.length} Registrierung(en)</small></button>` : "") +
			gruppe("Ziel", ziel);
		app.innerHTML = kopf((au ? "Produktion " + au.auftrag + ": " : "") + r.name + " · " + mg(r.sollmenge, r.einheit), true) +
			(au && au.hinweis ? hinweisHtml([{ von: "Kundenauftrag " + au.auftrag, text: au.hinweis }]) : "") +
			(r.umstellung_bio ? `<div class="meldung orange">Umstellung auf Bio: hier wurde zuletzt konventionell produziert. Vor dem Buchen Reinigung bzw. Spülcharge bestätigen.</div>` : "") +
			maske(links, rechts);
		if (au || pa) registrierungenLaden(au ? { kundenauftrag: au.auftrag } : { produktionsauftrag: pa.auftrag });
		aktionen((a, d) => {
			if (a === "sel") { if (!ansatz.offen) ansatz.sel = d.artikel; return ansatzZeigen(); }
			if (a === "silo-zutat") return codeGescannt(d.silo);
			if (a === "auswahl") return auswahlZeigen(d.artikel);
			if (a === "weg") { ansatz.zeilen.splice(+d.i, 1); return ansatzZeigen(); }
			if (a === "abbrechen") { ansatz.offen = null; return ansatzZeigen(); }
			if (a === "einheit" && ansatz.offen) return gebindeWaehlen(d.e);
			if (a === "abschluss") return ansatzAbschluss();
			if (a === "soll-anpassen") return sollAnpassen(sollAnpassbar());
			beiAllgemein(a);
		});
		enter("scan", (v) => (ansatz.offen ? mengeEingegeben(v) : codeGescannt(v)));
		const scanFeld = document.getElementById("scan");
		if (ansatz.offen && scanFeld) { scanFeld.addEventListener("input", gebindeHinweis); gebindeHinweis(); }
		fokus("scan");
		if (ansatz.offen) setTimeout(() => document.getElementById("scan").select(), 40);
	}

	// Selbst auswählen (ohne Scanner): Kisten/Chargen eines Artikels antippen; ersetzt den Vorschlag
	async function auswahlZeigen(artikel) {
		const z = ansatz.rezept.zutaten.find((x) => x.artikel === artikel);
		app.innerHTML = kopf(z.name + ": woher?", true) + `<p>Antippen, was genommen wird (älteste zuerst). Gebraucht: ${esc(mg(z.menge, z.einheit))}</p><div id="quellen">Lädt …</div>`;
		aktionen((a) => (a === "zurueck" ? ansatzZeigen() : beiAllgemein(a)));
		try {
			const liste = await api("auswahl", { station: zustand.station, artikel });
			const el = document.getElementById("quellen");
			if (!liste.length) { el.innerHTML = `<p class="fehlt">Nichts im Lager.</p>`; return; }
			el.innerHTML = tabelle([["Kiste / Charge", (q) => q.behaelter ? "Kiste " + q.behaelter : q.charge], ["Charge", "charge"], ["Menge", (q) => mg(q.menge, z.einheit), 1], ["MHD", (q) => q.mhd || ""]], liste, "quelle");
			aktionen(async (a, d) => {
				if (a === "zurueck") return ansatzZeigen();
				if (a !== "quelle") return beiAllgemein(a);
				const q = liste[+d.i];
				// erste Wahl ersetzt den Vorschlag, weitere Wahlen ergänzen (wenn eine Kiste nicht reicht)
				if (!ansatz.gewaehlt) ansatz.gewaehlt = {};
				if (!ansatz.gewaehlt[artikel]) { ansatz.zeilen = ansatz.zeilen.filter((x) => x.artikel !== artikel); ansatz.gewaehlt[artikel] = true; }
				const fehlt = rund(z.menge - gescannt(artikel));
				if (fehlt <= 0) return ansatzZeigen();
				try {
					ansatz.zeilen.push(await api("pruefe_zeile", { station: zustand.station, ziel: ansatz.rezept.artikel, code: q.code, menge: Math.min(fehlt, q.menge) }));
					ansatzZeigen();
				} catch (e) { meldung("rot", e.message); }
			});
		} catch (e) { meldung("rot", e.message); }
	}

	async function registrierungenLaden(args) {
		try {
			const liste = await api("registrierungen", { station: zustand.station, ...args });
			const el = document.getElementById("registrierungen");
			if (!el) return;
			el.innerHTML = liste.length
				? tabelle([["Zeit", "wann"], ["Los", "los"], ["Menge", "menge_text", 1], ["MHD", "mhd"], ["Station", "station"]], liste)
				: `<span class="fehlt">Zu diesem Auftrag ist noch nichts gebucht.</span>`;
		} catch (e) { /* Anzeige ist nur Info */ }
	}

	// Menge zur gescannten Zutat: in kg oder in ganzen Gebinden (Sack, Kollo), wenn am Artikel eine Umrechnung steht
	function mengeEingabeHtml(o) {
		const g = o.gebinde || [];
		const zaehl = g.find((x) => x.einheit === o.zaehl);
		return (g.length ? einheitWahl([{ einheit: o.einheit, faktor: 1 }, ...g], o.zaehl || o.einheit, o.einheit) : "") +
			zahlFeld("scan", zaehl ? `Wie viele ${esc(ein(zaehl.einheit))} (je ${esc(mg(zaehl.faktor, o.einheit))}) für ${esc(o.anzeige)}?`
				: `Menge (${esc(ein(o.einheit))}) für ${esc(o.anzeige)}`, o.vorschlag) +
			(zaehl ? `<small class="feld-hinweis" id="gebinde-hinweis"></small>` : "");
	}
	function gebindeFaktor(o) { const g = (o.gebinde || []).find((x) => x.einheit === o.zaehl); return g ? g.faktor : 1; }
	function gebindeHinweis() {
		const o = ansatz.offen, h = document.getElementById("gebinde-hinweis"), f = document.getElementById("scan");
		if (!o || !h || !f) return;
		const n = zahl(f.value);
		h.className = "feld-hinweis" + (n > 0 ? " ok" : "");
		h.textContent = n > 0 ? "= " + mg(n * gebindeFaktor(o), o.einheit) + (o.todo ? " · ToDo " + mg(o.todo, o.einheit) : "") : "";
	}
	function gebindeWaehlen(einheit) {
		const o = ansatz.offen;
		o.zaehl = einheit === o.einheit ? null : einheit;
		const f = gebindeFaktor(o);
		o.vorschlag = o.todo > 0 ? (o.zaehl ? Math.max(1, Math.round(o.todo / f)) : rund(o.todo)) : "";
		ansatzZeigen();
	}

	async function codeGescannt(code) {
		if (!code) return;
		const r = ansatz.rezept;
		let info = {};
		try { info = await api("info", { code }); } catch (e) { ansatzZeigen(); return meldung("rot", e.message); }
		if (info.typ === "palette") { ansatzZeigen(); return meldung("rot", "Das ist eine Palette. Bitte Kiste, Behälter oder Gebinde scannen."); }
		const passende = r.zutaten.find((z) => z.artikel === info.artikel);
		let ziel = passende ? passende.menge - gescannt(passende.artikel) : null;
		if (ziel != null && info.inhalt != null && info.typ !== "silo") ziel = Math.min(ziel, info.inhalt);
		const anzeige = (info.artikelname || code) + (info.typ === "silo" ? "" : " · " + code);
		ansatz.offen = { code, anzeige, einheit: passende ? passende.einheit : null, vorschlag: ziel && ziel > 0 ? rund(ziel) : "",
			todo: ziel && ziel > 0 ? rund(ziel) : 0, gebinde: info.typ === "silo" || !passende ? [] : passende.gebinde || [],
			artikel: passende ? passende.artikel : null };
		// Geht der Rest in ganzen Gebinden auf (z. B. 50 kg = 2 Sack), gleich in Gebinden fragen
		const ganz = ansatz.offen.gebinde.slice().reverse().find((g) => ziel >= g.faktor && Math.abs(ziel / g.faktor - Math.round(ziel / g.faktor)) < 0.02);
		if (ganz) { ansatz.offen.zaehl = ganz.einheit; ansatz.offen.vorschlag = Math.round(ziel / ganz.faktor); }
		// Grundteig-Kübel kommt immer ganz in den Kneter: keine Mengenabfrage
		if (info.typ === "behaelter" && passende && passende.stufe === "Grundteig" && info.inhalt > 0) return mengeEingegeben(String(info.inhalt));
		ansatzZeigen();
	}

	async function mengeEingegeben(wert) {
		const menge = rund(zahl(wert) * gebindeFaktor(ansatz.offen), 6); // „2 Sack“ → 50 kg
		const code = ansatz.offen.code;
		if (menge <= 0) return meldung("rot", "Bitte eine Menge eingeben.");
		try {
			const z = await api("pruefe_zeile", { station: zustand.station, ziel: ansatz.rezept.artikel, code, menge });
			ansatz.zeilen.push(z);
			ansatz.offen = null;
			ansatzZeigen();
			const f = fefoOffen().find((x) => x.z === z);
			if (f) return meldung("orange", "Älteres MHD im Lager: " + f.aelter.map((a) => a.charge + " (MHD " + a.mhd + ")").join(", "),
				"Besser die ältere Charge nehmen. Sonst beim Buchen einen Grund wählen.");
			meldung("gruen", "OK: " + z.name + " " + mg(z.menge, z.einheit), z.charge ? "Charge " + z.charge : z.silo ? "aus " + z.silo + " (Charge wird nach FIFO zugeteilt)" : "");
		} catch (e) {
			ansatz.offen = null;
			ansatzZeigen();
			meldung("rot", e.message);
		}
	}

	// Rezepturtreue: Einwaage je Zutat gegen das Soll (Sollmenge, z. B. halbe Masse), Toleranz aus dem Rezept
	function prozentText(ist, soll) { return soll ? (ist >= soll ? "+" : "") + Math.round((ist / soll - 1) * 100) + " %" : ""; }
	const REZEPT_GRUENDE = ["Rezept angepasst (Anweisung)", "Korrektur nach Prüfung", "Rest aufgebraucht", "Sonstiges"];
	function rezeptAbweichungen() {
		const r = ansatz.rezept;
		if (!r.rezept_pruefen) return [];
		return r.zutaten.map((z) => ({ z, ist: gescannt(z.artikel) })).filter((x) => Math.abs(x.ist - x.z.menge) > (x.z.toleranz || 0) + 1e-9);
	}
	// Neue Sollmenge, wenn ein Grundteig (ganzer Kübel) eingesetzt ist und vom Soll abweicht; sonst 0
	function sollAnpassbar() {
		const r = ansatz.rezept;
		if (!r.rezept_pruefen) return 0;
		const gt = r.zutaten.find((z) => z.stufe === "Grundteig" && z.menge > 0);
		if (!gt) return 0;
		const ist = gescannt(gt.artikel);
		if (ist <= 0 || Math.abs(ist - gt.menge) <= (gt.toleranz || 0) + 1e-9) return 0;
		return rund(r.sollmenge * ist / gt.menge, 3);
	}
	async function sollAnpassen(soll) {
		try {
			ansatz.rezept = await api("rezept", { artikel: ansatz.rezept.artikel, menge: soll, station: zustand.station });
			ansatzZeigen();
			meldung("gruen", "Soll angepasst: " + mg(soll, ansatz.rezept.einheit), "Die übrigen Zutaten richten sich jetzt nach dem eingesetzten Grundteig.");
		} catch (e) { meldung("rot", e.message); }
	}
	function rezeptPanel() {
		const abw = rezeptAbweichungen();
		if (!abw.length) return "";
		const r = ansatz.rezept;
		return `<div class="meldung orange">Einwaage außerhalb der Toleranz<small>${abw.map((x) => esc(x.z.name + ": " + mg(x.ist, x.z.einheit) + " statt " + mg(x.z.menge, x.z.einheit) +
			(x.ist ? " (" + prozentText(x.ist, x.z.menge) + ")" : " (fehlt)"))).join("<br>")}</small></div>
			<label>Grund für die Abweichung${r.rezept_pflicht ? "" : " (freiwillig)"}</label><div class="einheiten">${REZEPT_GRUENDE.map((g) =>
				`<button type="button" data-a="rezept-grund" data-e="${esc(g)}" class="${ansatz.rezeptGrund === g ? "an" : ""}">${esc(g)}</button>`).join("")}</div>`;
	}

	// FEFO: Zeilen mit älterer Charge im Lager (in diesem Ansatz schon gescannte zählen nicht)
	const FEFO_GRUENDE = ["Ältere Charge nicht erreichbar", "Ältere Charge angebrochen oder beschädigt", "Anweisung QS", "Sonstiges"];
	function fefoOffen() {
		const verwendet = new Set(ansatz.zeilen.map((z) => z.charge).filter(Boolean));
		return ansatz.zeilen.map((z) => ({ z, aelter: (z.fefo || []).filter((a) => !verwendet.has(a.charge)) })).filter((x) => x.aelter.length);
	}
	function fefoPanel() {
		const offen = fefoOffen();
		if (!offen.length) return "";
		return `<div class="meldung orange">Älteres MHD liegt im Lager<small>${offen.map((x) => esc(x.z.name + ": genommen " + x.z.charge + ", älter " +
			x.aelter.map((a) => a.charge + " (MHD " + a.mhd + ")").join(", "))).join("<br>")}</small></div>
			<label>Grund für die Abweichung${offen.some((x) => x.z.fefo_pflicht) ? "" : " (freiwillig)"}</label><div class="einheiten">${FEFO_GRUENDE.map((g) =>
				`<button type="button" data-a="fefo-grund" data-e="${esc(g)}" class="${ansatz.fefoGrund === g ? "an" : ""}">${esc(g)}</button>`).join("")}</div>`;
	}

	function ansatzAbschluss() {
		const r = ansatz.rezept;
		const packmittel = new Set(r.zutaten.filter((z) => z.stufe === "Packmittel").map((z) => z.artikel));
		const summe = ansatz.zeilen.filter((z) => (!z.einheit || z.einheit === (r.einheit || "Kg")) && !packmittel.has(z.artikel)).reduce((s, z) => s + z.menge, 0);
		const zaehlen = r.einheiten && r.einheiten.length > 1;
		let einheit = ansatz.einheit || (zaehlen ? r.einheiten[0].einheit : null);
		const kgVorschlag = rund(summe * r.ausbeute);
		const vorschlag = zaehlen ? Math.floor(kgVorschlag / faktorVon(r.einheiten, einheit) + 1e-6) : kgVorschlag;
		const fertigware = r.stufe === "Fertigware";
		app.innerHTML = kopf(r.name, true) + `
			<div class="panel"><div class="zeile"><div>${r.einheit === "Kg" ? "Eingewogen" : "Eingesetzt"}</div><div class="rechts">${esc(mg(summe, r.einheit))}</div></div></div>
			${zaehlen ? einheitWahl(r.einheiten, einheit, r.einheit) : ""}
			<div id="vorschau"></div>
			${zahlFeld("aus", zaehlen ? `Ausbringung – wie viele <span id="einheit-text">${esc(einheit)}</span>?` : "Ausbringung (" + ein(r.einheit) + ")" + (r.ausbeute < 0.999 || r.ausbeute > 1.001 ? " – Vorschlag laut Rezept" : ""), vorschlag)}
			${r.ausgabe_silo ? `<p class="fehlt">Geht in ${esc(r.ausgabe_silo)}.</p>`
				: fertigware ? textFeld("scan", "Palette scannen (optional)") + `<div class="reihe"><button class="knopf" data-a="neue-palette">+ Neue Palette (Etikett drucken)</button></div>`
				: textFeld("scan", "Zielbehälter / Kiste scannen (optional)")}
			<div id="rezept-abw">${rezeptPanel()}</div>
			<div id="fefo">${fefoPanel()}</div>
			${pruefFelder(r.pruefungen, "ph")}
			<div class="reihe"><button class="knopf" data-a="zurueck-ansatz">← Zutaten</button><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		aktionen(async (a, d) => {
			if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = einheit; return fokus("aus"); }
			if (a === "zurueck-ansatz") return ansatzZeigen();
			if (a === "fefo-grund") { ansatz.fefoGrund = d.e; document.getElementById("fefo").innerHTML = fefoPanel(); return; }
			if (a === "rezept-grund") { ansatz.rezeptGrund = d.e; document.getElementById("rezept-abw").innerHTML = rezeptPanel(); return; }
			if (a === "buchen") return ansatzBuchen(zaehlen ? einheit : null);
			if (a === "neue-palette") {
				try {
					const p = await api("palette_neu", { station: zustand.station, typ: "Lagerpalette" });
					document.getElementById("scan").value = p.nve;
					etikettDrucken(p.nve);
					meldung("gruen", "Neue Palette " + p.nve, "Etikett wird gedruckt.");
				} catch (e) { meldung("rot", e.message); }
				return;
			}
			beiAllgemein(a);
		});
		enter("aus", () => fokus(document.getElementById("scan") ? "scan" : "aus"));
		enter("scan", () => {});
		const vorschauLaden = () => api("vorschau", { station: zustand.station, ziel: r.artikel, zeilen: ansatz.zeilen.map((z) => ({ code: z.code, menge: z.menge })),
				kundenauftrag: ansatz.auftrag ? ansatz.auftrag.auftrag : null, mhd: ansatz.mhd || null })
				.then((v) => {
					const el = document.getElementById("vorschau");
					if (!el || !v || !(v.los || v.mhd)) return;
					el.innerHTML = `<div class="panel"><div class="fehlt" style="font-size:16px">Am Beuteldrucker einstellen</div>
						<div class="gross">${v.los ? "Los " + esc(v.los) : ""}${v.mhd ? " · MHD " + esc(v.mhd) : ""}</div>
						${v.mhd_gekuerzt ? `<div class="fehlt" style="font-size:16px">Gekürzt für Kunde/Auftrag, möglich wäre ${esc(v.mhd_voll)}</div>` : ""}
						${datumFeld("mhd-wahl", "MHD kürzen auf", { pflicht: true, abHeute: true, wert: ansatz.mhd || v.mhd_iso || "" })}
						<div class="reihe"><button class="knopf" id="mhd-setzen">MHD kürzen</button>${ansatz.mhd ? `<button class="knopf" id="mhd-weg">Volles MHD</button>` : ""}</div>
						${v.kennzeichen && v.kennzeichen.length ? `<div>${kennzeichenMarken(v.kennzeichen)}${v.oeko_nr ? ` <b>${esc(v.oeko_nr)}</b>` : ""}</div>` : ""}
						${v.los_vorhanden ? `<div class="fehlt" style="font-size:16px">Los von heute läuft schon, diese Ware kommt dazu.</div>` : ""}</div>` +
						(v.mhd_sinkt ? `<div class="meldung orange">MHD sinkt von ${esc(v.mhd_bisher)} auf ${esc(v.mhd)}: Drucker umstellen, gedruckte Beutel prüfen.</div>` : "");
					datumAnzeigen(document.getElementById("mhd-wahl"));
					document.getElementById("mhd-setzen").onclick = () => {
						try { ansatz.mhd = datumWert("mhd-wahl", "MHD"); } catch (e) { return meldung("rot", e.message); }
						vorschauLaden();
					};
					const weg = document.getElementById("mhd-weg");
					if (weg) weg.onclick = () => { ansatz.mhd = null; vorschauLaden(); };
				}).catch(() => {});
		if (fertigware) vorschauLaden();
		fokus("aus");
		setTimeout(() => { const f = document.getElementById("aus"); if (f) f.select(); }, 40);
	}

	async function ansatzBuchen(einheit) {
		if (rezeptAbweichungen().length && ansatz.rezept.rezept_pflicht && !ansatz.rezeptGrund) return meldung("rot", "Einwaage außerhalb der Toleranz.", "Bitte einen Grund wählen oder zurück und korrigieren.");
		if (fefoOffen().some((x) => x.z.fefo_pflicht) && !ansatz.fefoGrund) return meldung("rot", "Älteres MHD liegt im Lager.", "Bitte einen Grund wählen oder zurück und die ältere Charge scannen.");
		const knopf = app.querySelector('[data-a="buchen"]');
		if (knopf) { knopf.disabled = true; knopf.textContent = "Bucht …"; }
		const ziel = document.getElementById("scan");
		const wert = zahl(document.getElementById("aus").value);
		try {
			const e = await api("herstellen", {
				station: zustand.station,
				ziel: ansatz.rezept.artikel,
				zeilen: ansatz.zeilen.map((z) => ({ code: z.code, menge: z.menge })),
				ausbringung: einheit ? null : wert,
				anzahl: einheit ? wert : null,
				einheit,
				ziel_behaelter: ziel ? ziel.value.trim() || null : null,
				kundenauftrag: ansatz.auftrag ? ansatz.auftrag.auftrag : null,
				pruefwerte: pruefWerte(ansatz.rezept.pruefungen, "ph"),
				mhd: ansatz.mhd || null,
				fefo_grund: fefoOffen().length ? ansatz.fefoGrund : null,
				sollmenge: ansatz.rezept.rezept_pruefen ? ansatz.rezept.sollmenge : null,
				rezept_grund: rezeptAbweichungen().length ? ansatz.rezeptGrund || null : null,
			});
			const zeilen = [
				e.los ? "Los: " + e.los + (e.los !== e.charge ? " (" + e.charge + ")" : "") : "Neue Charge: " + e.charge,
				e.anzahl ? "Menge: " + stk(e.anzahl, ein(e.einheit)) + " (" + mg(e.menge, ansatz.rezept.einheit) + ")" : "Menge: " + mg(e.menge, ansatz.rezept.einheit),
				e.behaelter ? "Behälter: " + e.behaelter : "",
				e.palette ? "Auf Palette: " + e.palette : "",
				e.kundenauftrag ? "Kundenauftrag: " + e.kundenauftrag : "",
				e.mhd ? "Verwendbar bis / MHD: " + e.mhd : "",
				e.kennzeichen ? "Kennzeichen: " + e.kennzeichen : "",
				e.gesperrt ? "Gesperrt bis zur Freigabe durch die QS" : "",
			].filter(Boolean);
			const extra = e.palette ? `<button class="knopf" data-a="etikett">Paletten-Etikett drucken</button><button class="knopf" data-a="palette">Palette anzeigen</button>` : "";
			ergebnis(e.name, zeilen, e.hinweise, extra)((a) => {
				if (a === "etikett") return etikettNachdrucken(e.palette);
				if (a === "palette") return paletteLaden(e.palette);
				beiAllgemein(a);
			});
		} catch (err) {
			if (knopf) { knopf.disabled = false; knopf.textContent = "Buchen"; }
			meldung("rot", err.message);
		}
	}

	// ------------------------------------------------------------------ Rework / Bruch
	// Backstube: Rework-Behälter von der Linie wiegen und buchen (F18). Erst der Auftrag, dann die Sorte
	// (nur passende: Regel und Allergene), Behälter, Gewicht von der Waage. Etikett für den Behälter.
	async function reworkStart() {
		app.innerHTML = kopf("Rework", true) + `<p><b>Von welchem Auftrag an der Linie?</b> – Zeile antippen</p><div id="liste">Lädt …</div>
			<div class="reihe"><button class="knopf" data-a="ohne-linie">Ohne Linie<small>Teigrest aus Kübel oder Charge</small></button></div>`;
		aktionen((a) => (a === "ohne-linie" ? reworkOhneLinie() : beiAllgemein(a)));
		try {
			const liste = await api("rework_linie_auftraege", { station: zustand.station });
			if (liste.length === 1) return reworkLinie(liste[0]);
			if (!liste.length) { document.getElementById("liste").innerHTML = `<span class="fehlt">Auf keiner Linie läuft gerade ein Auftrag.</span>`; return; }
			suchListe("liste", [["Linie", "linie"], ["Auftrag", "auftrag"], ["Artikel", "name"], ["Sorten", (x) => x.sorten.map((y) => y.punkt || y.name).join(", ")]],
				liste, (x) => reworkLinie(x), "Suchen …");
		} catch (e) { meldung("rot", e.message); }
	}

	async function reworkLinie(a) {
		if (!a.sorten.length) return meldung("rot", "Für " + a.name + " ist kein Rework zugelassen (keine Rework-Regel).");
		let sorte = a.sorten.length === 1 ? a.sorten[0].artikel : null, behaelter = null, frei = [];
		try { frei = await api("freie_rework_behaelter", { station: zustand.station }); } catch (e) { /* nur scannen */ }
		app.innerHTML = kopf("Rework: " + a.name, true) + `<div class="panel">${esc(a.linie)} · Auftrag ${esc(a.auftrag)}</div>
			<label>Sorte (Entnahmepunkt)</label><div class="einheiten" id="sorten">${a.sorten.map((x) =>
				`<button type="button" data-a="sorte" data-s="${esc(x.artikel)}" class="${x.artikel === sorte ? "an" : ""}">${esc(x.punkt || x.name)}<small> ${esc(x.name)}</small></button>`).join("")}</div>` +
			textFeld("scan", "Rework-Behälter scannen oder unten antippen") +
			(frei.length ? `<div class="einheiten" id="beh">${frei.slice(0, 24).map((b) => `<button type="button" data-a="beh" data-c="${esc(b.code)}">${esc(b.code)}</button>`).join("")}</div>` : "") +
			zahlFeld("kg", "Gewicht von der Waage (kg, ohne Behälter)") +
			`<div class="reihe"><button class="knopf" data-a="zurueck-rw">← Aufträge</button><button class="knopf gruen" data-a="buchen">Buchen und Etikett drucken</button></div>`;
		aktionen(async (x, d) => {
			if (x === "zurueck-rw") return reworkStart();
			if (x === "sorte") { sorte = d.s; app.querySelectorAll("#sorten button").forEach((b) => b.classList.toggle("an", b.dataset.s === sorte)); return; }
			if (x === "beh") { behaelter = d.c; document.getElementById("scan").value = d.c; app.querySelectorAll("#beh button").forEach((b) => b.classList.toggle("an", b.dataset.c === d.c)); return fokus("kg"); }
			if (x !== "buchen") return beiAllgemein(x);
			if (!sorte) return meldung("rot", "Bitte die Sorte wählen.");
			const knopf = app.querySelector('[data-a="buchen"]');
			knopf.disabled = true;
			try {
				const e = await api("rework_linie", { station: zustand.station, auftrag: a.auftrag, rework_artikel: sorte,
					kg: zahl(document.getElementById("kg").value), behaelter: document.getElementById("scan").value.trim() || behaelter });
				gebindeDrucken(e.behaelter);
				ergebnis(e.name, ["Behälter: " + e.behaelter, "Menge: " + kg(e.menge), e.punkt ? "Entnahmepunkt: " + e.punkt : "", "Charge: " + e.charge,
					e.mhd ? "Verwendbar bis: " + e.mhd : "", "Von Auftrag " + e.auftrag], [],
					`<button class="knopf" data-a="etikett">Etikett nochmal</button><button class="knopf gruen" data-a="weiter">Nächster Behälter</button>`)((b) => {
					if (b === "etikett") return gebindeDrucken(e.behaelter, null);
					if (b === "weiter") return reworkLinie(a);
					beiAllgemein(b);
				});
			} catch (err) { knopf.disabled = false; meldung("rot", err.message); }
		});
		enter("scan", (v) => { behaelter = v; fokus("kg"); });
		enter("kg", () => app.querySelector('[data-a="buchen"]').click());
		fokus(frei.length ? "kg" : "scan");
	}

	async function reworkOhneLinie() {
		app.innerHTML = kopf("Rework ohne Linie", true) + `<p>In welchen Rework-Behälter?</p><div id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = await api("rework_artikel");
			suchListe("liste", [["Rework-Artikel", "name"], ["Artikel", "artikel"], ["Allergengruppe", "allergengruppe"]], liste, (r) => reworkErfassen(r.artikel, r.name));
		} catch (e) { meldung("rot", e.message); }
	}

	function reworkErfassen(artikel, name) {
		app.innerHTML = kopf(name, true) +
			textFeld("scan", "Herkunft scannen: Teigbehälter, Kiste oder Charge") +
			zahlFeld("menge", "Menge (kg)") +
			textFeld("ziel", "Rework-Behälter scannen (optional)") +
			`<div class="reihe"><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		aktionen(async (a) => {
			if (a !== "buchen") return beiAllgemein(a);
			try {
				const e = await api("rework_erfassen", {
					station: zustand.station,
					quelle: document.getElementById("scan").value.trim(),
					menge: zahl(document.getElementById("menge").value),
					rework_artikel: artikel,
					ziel_behaelter: document.getElementById("ziel").value.trim() || null,
				});
				ergebnis(e.name, ["Neue Rework-Charge: " + e.charge, "Menge: " + kg(e.menge), e.behaelter ? "Behälter: " + e.behaelter : "", e.mhd ? "Verwendbar bis: " + e.mhd : ""].filter(Boolean), e.hinweise)(beiAllgemein);
			} catch (err) { meldung("rot", err.message); }
		});
		enter("scan", () => fokus("menge"));
		enter("menge", () => fokus("ziel"));
		fokus("scan");
	}

	// ------------------------------------------------------------------ Wareneingang
	let artikelListe = [];
	async function wareneingangStart() {
		// Zuerst das Etikett des Lieferanten scannen; ohne Code den Artikel antippen
		let vorschlag = null;
		app.innerHTML = kopf("Wareneingang", true) +
			textFeld("etikett", "Etikett des Lieferanten scannen – oder Artikel unten antippen") +
			`<div id="etikett-info"></div><p>Welcher Artikel? Zeile antippen</p><div id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			artikelListe = await api("wareneingang_artikel");
			suchListe("liste", [["Artikel", "artikel"], ["Bezeichnung", "name"], ["Einheit", (r) => ein(r.stock_uom)],
				["Hinweis", (r) => [r.silo ? "Silo" : "", r.kt_freigabe_pflicht ? "Freigabe QS" : "", r.bio ? "BIO" : ""].filter(Boolean).join(", ")]],
				artikelListe, (r) => wareneingangErfassen(r, vorschlag), "Suchen: Artikelnummer oder Bezeichnung …");
		} catch (e) { meldung("rot", e.message); }
		enter("etikett", async (code, f) => {
			if (!code) return;
			try {
				const r = await api("wareneingang_scan", { code });
				const info = document.getElementById("etikett-info");
				if (r.artikel) {
					const art = artikelListe.find((a) => a.artikel === r.artikel);
					if (!art) return meldung("rot", "Artikel " + r.artikel + " ist hier nicht für den Wareneingang freigegeben.");
					return wareneingangErfassen(art, r);
				}
				vorschlag = r.gs1 || r.gtin ? { ...r, artikel: null } : { charge: r.charge };
				f.value = "";
				info.innerHTML = r.unbekannt
					? `<div class="meldung orange">Code ${esc(r.gtin)} ist keinem Artikel zugeordnet. Bitte den Artikel unten antippen.<small>Im Büro am Artikel unter „Barcodes“ eintragen (mit Einheit, z. B. Karton). Danach erkennt das Terminal ihn selbst.</small></div>`
					: `<div class="meldung orange">Kein Artikel-Code, als Charge übernommen: ${esc(r.charge)}. Bitte den Artikel unten antippen.</div>`;
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("etikett");
	}

	// Lieferanten-Etikett ins Formular übernehmen (nur Vorschlag – der Mensch prüft vor dem Buchen)
	function etikettUebernehmen(v, einheit) {
		if (!v) return "";
		const set = (id, wert) => {
			const f = document.getElementById(id);
			if (f && wert != null && wert !== "") { f.value = wert; f.dispatchEvent(new Event("input", { bubbles: true })); }
		};
		set("scan", v.charge);
		if (v.mhd) { const [y, m, d] = v.mhd.split("-"); set("mhd", `${d}.${m}.${y}`); }
		if (v.menge_je_gebinde) set("menge", String(rund(v.menge_je_gebinde, 3)).replace(".", ","));
		const teile = [v.charge ? "Charge " + v.charge : "", v.mhd ? "MHD " + datumDe(v.mhd) : "",
			v.menge_je_gebinde ? "je Gebinde " + String(rund(v.menge_je_gebinde, 3)).replace(".", ",") + (einheit ? " " + ein(einheit) : "") : ""].filter(Boolean);
		return (teile.length ? `<div class="panel">Vom Etikett gelesen: <b>${esc(teile.join(" · "))}</b><br><span class="fehlt" style="font-size:16px">Noch nicht gebucht. Bitte mit dem Etikett vergleichen.</span></div>` : "") +
			(v.unvollstaendig ? `<div class="meldung orange">Etikett nur teilweise gelesen. Bitte alle Felder prüfen.</div>` : "") +
			(v.charge_bekannt ? `<div class="meldung orange">Diese Charge ist schon gebucht. Gleiche Lieferung zweimal?</div>` : "");
	}
	function datumDe(iso) { const [y, m, d] = String(iso).split("-"); return `${d}.${m}.${y}`; }

	function wareneingangErfassen(art, vorschlag) {
		const ARTEN = ["Sack", "Fass", "IBC", "Eimer", "Karton", "Kanister", "BigBag", "Sonstiges"];
		let gebindeart = vorschlag && ARTEN.includes(vorschlag.gebindeart) ? vorschlag.gebindeart : "Sack";
		// Eigenes Etikett nur, wenn das Etikett des Lieferanten die Charge nicht im Strichcode trägt
		let etiketten = !(vorschlag && vorschlag.gs1 && vorschlag.charge && vorschlag.artikel === art.artikel);
		const lief = art.lieferanten || [];
		app.innerHTML = kopf(art.name, true) +
			(art.bio ? `<div class="panel">${kennzeichenMarken(["Bio"])} <span class="fehlt" style="font-size:16px">Nur Lieferanten mit gültigem Öko-Zertifikat.</span></div>` : "") +
			(art.bio && !lief.length ? `<div class="meldung rot">Kein Lieferant mit gültigem Öko-Zertifikat hinterlegt. Annahme als Bio nicht möglich.<small>Zertifikat beim Lieferanten im Büro eintragen.</small></div>` : "") +
			(lief.length ? `<label>Lieferant${art.bio ? "" : " (optional)"}</label><select id="lieferant" class="feld">${art.bio ? "" : `<option value="">–</option>`}${lief.map((l) => `<option value="${esc(l.lieferant)}">${esc(l.name)}${l.bio_ok ? " · Bio-zertifiziert" : ""}</option>`).join("")}</select>` : "") +
			`<div id="etikett-info"></div>` +
			textFeld("scan", "Charge des Lieferanten (Etikett scannen oder Charge eingeben)") +
			`${art.has_expiry_date ? datumFeld("mhd", "MHD", { pflicht: true, abHeute: true }) : ""}
			${art.silo ? `<label>Wohin?</label><select id="ziel" class="feld"><option value="${esc(art.silo)}">ins ${esc(art.silo)}</option><option value="">als Gebinde ins Lager</option></select>` : ""}
			<div id="gebinde-box" style="${art.silo ? "display:none" : ""}">
				<label>Gebindeart</label><div class="einheiten">${ARTEN.map((a) => `<button type="button" data-a="einheit" data-e="${a}" class="${a === gebindeart ? "an" : ""}">${a}</button>`).join("")}</div>
				${zahlFeld("anzahl", "Wie viele Gebinde?", 1)}
				<label>Eigenes Etikett je Gebinde?</label><div class="einheiten">
					<button type="button" data-a="etikett" data-e="ja" class="${etiketten ? "an" : ""}">Ja, drucken</button>
					<button type="button" data-a="etikett" data-e="nein" class="${etiketten ? "" : "an"}">Nein, Lieferanten-Etikett hat die Charge</button></div>
			</div>` +
			zahlFeld("menge", `<span id="menge-text">${art.silo ? "Menge" : "Menge je Gebinde"}</span> (${esc(ein(art.stock_uom))})`) +
			pruefFelder(art.pruefungen, "pw") +
			`<div class="reihe"><button class="knopf gruen" data-a="buchen">Buchen</button></div>`;
		const zielFeld = document.getElementById("ziel");
		if (zielFeld) zielFeld.addEventListener("change", () => {
			const silo = !!zielFeld.value;
			document.getElementById("gebinde-box").style.display = silo ? "none" : "";
			document.getElementById("menge-text").textContent = silo ? "Menge" : "Menge je Gebinde";
		});
		const info = document.getElementById("etikett-info");
		info.innerHTML = etikettUebernehmen(vorschlag, art.stock_uom);
		// Lieferanten-Charge mit Charge im Strichcode: nur dann kann die Backstube das Lieferanten-Etikett scannen
		let chargeImCode = !etiketten;
		const etikettSetzen = (ja) => {
			etiketten = ja;
			app.querySelectorAll('[data-a="etikett"]').forEach((b) => b.classList.toggle("an", (b.dataset.e === "ja") === ja));
			if (!ja && !chargeImCode) meldung("orange", "Ohne eigenes Etikett muss die Backstube die Charge eintippen – das Lieferanten-Etikett hat sie nicht im Strichcode.");
		};
		enter("scan", async (code) => {
			if (!code) return;
			try {
				const r = await api("wareneingang_scan", { code });
				if (r.artikel && r.artikel !== art.artikel) return meldung("rot", "Das Etikett gehört zu " + r.artikel + ", nicht zu " + art.artikel + ".");
				if (r.gs1 || r.gtin) {
					if (!r.charge) return meldung("orange", "Auf diesem Etikett steht keine Charge im Strichcode. Bitte die Charge abtippen.");
					document.getElementById("scan").value = "";
					info.innerHTML = etikettUebernehmen(r, art.stock_uom);
					chargeImCode = !!(r.gs1 && r.artikel === art.artikel);
					if (chargeImCode) etikettSetzen(false);
				}
			} catch (e) { return meldung("rot", e.message); }
			const m = document.getElementById("mhd");
			if (m && !m.value) m.focus(); else fokus("menge");
		});
		aktionen(async (a, d) => {
			if (a === "einheit") { gebindeart = d.e; return einheitSetzen(gebindeart); }
			if (a === "etikett") return etikettSetzen(d.e === "ja");
			if (a !== "buchen") return beiAllgemein(a);
			const knopf = app.querySelector('[data-a="buchen"]');
			if (knopf) { knopf.disabled = true; knopf.textContent = "Bucht …"; }
			try {
				const ziel = document.getElementById("ziel");
				const mhdIso = datumWert("mhd", "MHD");
				const silo = ziel ? ziel.value || null : null;
				const e = await api("wareneingang", {
					station: zustand.station,
					artikel: art.artikel,
					lieferantencharge: document.getElementById("scan").value.trim(),
					lieferant: document.getElementById("lieferant") ? document.getElementById("lieferant").value || null : null,
					menge: zahl(document.getElementById("menge").value),
					mhd: mhdIso,
					silo,
					gebinde: silo ? 0 : Math.max(1, Math.round(zahl(document.getElementById("anzahl").value))),
					gebindeart: silo ? null : gebindeart,
					etiketten: etiketten ? 1 : 0,
					pruefwerte: pruefWerte(art.pruefungen, "pw"),
				});
				if (e.abgelehnt) {
					app.innerHTML = kopf(e.name, true) + `<div class="meldung rot">Annahme verweigert<small>${e.gruende.map(esc).join("<br>")}</small></div>` +
						e.korrektur.map((k) => `<div class="meldung orange">${esc(k)}</div>`).join("") +
						`<p class="fehlt">Nichts gebucht. Die Prüfung ist protokolliert.</p><div class="reihe"><button class="knopf blau" data-a="zurueck">Fertig</button></div>`;
					ton(false);
					return aktionen(beiAllgemein);
				}
				const druck = (grund) => gebindeDrucken(e.gebinde, grund);
				if (e.gebinde && e.gebinde.length) druck("ablauf");
				ergebnis(e.name, ["Charge: " + e.charge, "Menge: " + mg(e.menge, art.stock_uom), "Ort: " + e.lager,
					e.gebinde && e.gebinde.length ? "Gebinde: " + e.gebinde.join(", ") : "", e.mhd ? "MHD: " + e.mhd : ""].filter(Boolean),
					(e.gesperrt ? ["Gesperrt bis zur Freigabe durch die QS (" + (e.sperrgrund || "") + ")"] : []).concat(e.hinweise || []),
					e.gebinde && e.gebinde.length ? `<button class="knopf" data-a="etiketten">Gebinde-Etiketten drucken</button>` : "")((a2) => (a2 === "etiketten" ? druck(null) : beiAllgemein(a2)));
			} catch (err) {
				if (knopf) { knopf.disabled = false; knopf.textContent = "Buchen"; }
				meldung("rot", err.message);
			}
		});
		enter("anzahl", () => fokus("menge"));
		enter("menge", () => {});
		const mhdFeld = document.getElementById("mhd");
		fokus(!(vorschlag && vorschlag.charge) ? "scan" : mhdFeld && !mhdFeld.value ? "mhd" : art.silo ? "menge" : "anzahl");
	}

	// ------------------------------------------------------------------ Anzahl-Dialog (Kartons/Beutel)
	// Zeigt Anzahl mit Ziffernblock und Einheiten-Wahl. fertig(anzahl, einheit) beim OK.
	function anzahlAbfragen(titel, unterzeile, einheiten, start, fertig, zurueck) {
		let einheit = start && start.einheit ? start.einheit : einheiten[0].einheit;
		app.innerHTML = kopf(titel, true) + (unterzeile ? `<div class="panel">${unterzeile}</div>` : "") +
			einheitWahl(einheiten, einheit, (einheiten.find((e) => e.faktor === 1) || {}).einheit) +
			zahlFeld("anzahl", `Wie viele <span id="einheit-text">${esc(ein(einheit))}</span>?`, start && start.anzahl != null ? rund(start.anzahl) : "");
		aktionen((a, d) => {
			if (a === "einheit") { einheit = d.e; einheitSetzen(einheit); document.getElementById("einheit-text").textContent = ein(einheit); return fokus("anzahl"); }
			if (a === "zurueck" && zurueck) return zurueck();
			beiAllgemein(a);
		});
		enter("anzahl", (v) => {
			const n = zahl(v);
			if (n <= 0) return meldung("rot", "Bitte eine Anzahl eingeben.");
			fertig(n, einheit);
		});
		fokus("anzahl");
		setTimeout(() => { const f = document.getElementById("anzahl"); if (f) f.select(); }, 40);
	}

	// ------------------------------------------------------------------ Paletten
	function palettenStart() {
		app.innerHTML = kopf("Paletten", true) + textFeld("scan", "Palette scannen (NVE)") + `
			<div class="raster" style="margin-top:16px">
				<button class="knopf blau" data-a="neu" data-typ="Lagerpalette">+ Neue Lagerpalette<small>für die Verpackung</small></button>
				<button class="knopf blau" data-a="neu" data-typ="Versandpalette">+ Neue Versandpalette<small>zum Kommissionieren</small></button>
				<button class="knopf blau" data-a="neu" data-typ="Versandkarton">+ Neuer Versandkarton<small>eigene NVE, auch auf eine Palette</small></button>
			</div>`;
		aktionen(async (a, d) => {
			if (a === "neu") {
				try {
					const p = await api("palette_neu", { station: zustand.station, typ: d.typ });
					etikettDrucken(p.nve);
					paletteZeigen(p, "Neue " + p.art + " angelegt, Etikett wird gedruckt.");
				} catch (e) { meldung("rot", e.message); }
				return;
			}
			beiAllgemein(a);
		});
		enter("scan", (v) => v && paletteLaden(v));
		fokus("scan");
	}

	async function paletteLaden(code, hinweis) {
		try { paletteZeigen(await api("palette_info", { code }), hinweis); } catch (e) { meldung("rot", e.message); }
	}

	function statusMarke(s) {
		const farbe = { Offen: "gruen", Geschlossen: "", Versendet: "orange", Leer: "" }[s] || "";
		return `<span class="marke ${farbe}">${esc(s)}</span>`;
	}

	// Versandkartons (eigene NVE) auf einer Palette; aktion = Knopf je Karton (z. B. abnehmen)
	function kartonListeHtml(p, aktion) {
		const k = p.versandkartons || [];
		if (!k.length) return "";
		return `<div class="panel"><div class="fehlt" style="font-size:16px">Versandkartons auf der Palette (${k.length})</div>${k.map((x, i) => `<div class="zeile">
			<div>Versandkarton …${esc(x.nve.slice(-6))}<br><small class="fehlt">${esc(x.nve)} · ${esc(x.inhalt)}</small></div>
			<div class="rechts">${esc(kg(x.menge))}${aktion ? ` <button class="knopf klein" data-a="${aktion}" data-i="${i}">abnehmen</button>` : ""}</div></div>`).join("")}</div>`;
	}
	function hatInhalt(p) { return !!(p.positionen.length || (p.versandkartons || []).length); }
	function positionenHtml(p, aktion) {
		if (!p.positionen.length) return (p.versandkartons || []).length ? "" : `<p class="fehlt">${p.versandkarton ? "Versandkarton" : "Palette"} ist leer.</p>`;
		return p.positionen.map((x, i) => `<button class="pos" ${aktion ? `data-a="${aktion}" data-i="${i}"` : "disabled"}>
			<span>${esc(x.name)}<small>Los ${esc(x.los || x.charge)}${x.mhd ? " · MHD " + esc(x.mhd) : ""}${x.gesperrt ? " · GESPERRT" : ""}</small></span>
			<span class="rechts">${esc(stk(x.anzahl, x.einheit))}<small>${esc(kg(x.menge))}</small></span></button>`).join("");
	}

	function paletteZeigen(p, hinweis) {
		const aktiv = p.status === "Offen" || p.status === "Geschlossen" || p.status === "Leer";
		const vk = p.versandkarton;
		app.innerHTML = kopf(vk ? "Versandkarton" : "Palette", true) + `
			<div class="panel"><div class="nve">${esc(p.nve.slice(0, -6))}<span style="color:#6ea0ff">${esc(p.nve.slice(-6))}</span> ${statusMarke(p.status)}
				<br><small>${esc(p.art)}${p.kartons ? " · " + esc(p.kartons) : ""}${p.menge ? " · " + esc(kg(p.menge)) : ""}${p.lieferschein ? " · Lieferschein " + esc(p.lieferschein) : ""}</small></div>
				${p.fuellung ? `<div style="margin-top:10px"><div style="height:14px;background:var(--panel2);border-radius:7px;overflow:hidden"><div style="height:100%;width:${Math.min(100, Math.round(p.fuellung.anteil * 100))}%;background:${p.fuellung.ueber ? "var(--rot)" : p.fuellung.voll ? "var(--gruen)" : "var(--blau)"}"></div></div>
					<div class="fehlt" style="font-size:16px;margin-top:4px">${p.fuellung.ueber ? "ÜBERLADEN · " : p.fuellung.voll ? "VOLL · " : ""}${esc(p.fuellung.text || Math.round(p.fuellung.anteil * 100) + " % voll")}</div></div>` : ""}
				${p.test ? `<div class="meldung orange">Test-NVE: Etikett nicht an Kunden geben (GS1-Basisnummer fehlt in den Einstellungen).</div>` : ""}
				${vk && p.auf_palette ? `<div class="meldung">Steht auf Palette …${esc(p.auf_palette.slice(-6))}<small>${esc(p.auf_palette)}</small></div>` : ""}
				${p.gewicht_kg || p.sendungsnummer ? `<div class="fehlt" style="font-size:16px;margin-top:6px">Paket: ${esc([p.gewicht_kg ? zahlText(p.gewicht_kg) + " kg" : "", p.sendungsnummer || ""].filter(Boolean).join(" · "))}</div>` : ""}
				${p.etikett_aktuell === false && hatInhalt(p) ? (p.status === "Offen"
					? `<div class="meldung">Etikett zeigt noch nicht den ganzen Inhalt<small>Nach dem Beladen mit Inhalt drucken.</small></div>`
					: `<div class="meldung orange">Etikett passt nicht mehr zum Inhalt<small>Neu drucken und das alte überkleben, nicht von Hand korrigieren.</small></div>`) : ""}
			</div>
			${aktiv && p.positionen.length ? `<p class="fehlt">Position antippen, um Kartons auf eine andere Palette umzupacken.</p>` : ""}
			${positionenHtml(p, aktiv ? "pos" : null)}
			${kartonListeHtml(p, aktiv ? "karton-ab" : null)}
			<div class="reihe">
				${aktiv ? `<button class="knopf blau" data-a="laden">+ Lose Kartons laden<small>${vk ? "Los scannen" : "Los oder Versandkarton scannen"}</small></button>` : ""}
				${aktiv && vk && p.positionen.length ? (p.auf_palette
					? `<button class="knopf" data-a="vom-stapel">Von der Palette nehmen<small>bleibt im Lager</small></button>`
					: `<button class="knopf" data-a="auf-palette">Auf eine Palette stellen<small>Palette scannen</small></button>`) : ""}
				<button class="knopf ${p.etikett_aktuell === false && hatInhalt(p) ? "gruen" : ""}" data-a="etikett">${p.etikett_aktuell === false ? "Etikett neu drucken" : "Etikett drucken"}</button>
				${p.status === "Offen" ? `<button class="knopf" data-a="schliessen">${vk ? "Karton" : "Palette"} schließen</button>` : ""}
				${p.status === "Geschlossen" ? `<button class="knopf" data-a="oeffnen">Wieder öffnen</button>` : ""}
			</div>`;
		if (hinweis) meldung("gruen", hinweis);
		aktionen(async (a, d) => {
			try {
				if (a === "etikett") { if (await etikettNachdrucken(p.nve)) paletteLaden(p.nve); return; }
				if (a === "schliessen") return paletteZeigen(await api("palette_schliessen", { station: zustand.station, palette: p.nve }), "Palette geschlossen.");
				if (a === "oeffnen") return paletteZeigen(await api("palette_oeffnen", { station: zustand.station, palette: p.nve }), "Palette geöffnet.");
				if (a === "laden") return kartonsLaden(p);
				if (a === "pos") return umpacken(p, p.positionen[+d.i]);
				if (a === "karton-ab") return paletteZeigen(await api("karton_abnehmen", { station: zustand.station, karton: p.versandkartons[+d.i].nve }), "Versandkarton heruntergenommen.");
				if (a === "vom-stapel") { await api("karton_abnehmen", { station: zustand.station, karton: p.nve }); return paletteLaden(p.nve, "Von der Palette genommen."); }
				if (a === "auf-palette") return kartonAufPalette(p);
			} catch (e) { return meldung("rot", e.message); }
			if (a === "zurueck") return palettenStart();
			beiAllgemein(a);
		});
	}

	function kartonsLaden(p) {
		app.innerHTML = kopf("Auf Palette …" + p.nve.slice(-6), true) + textFeld("scan", "Los scannen (Etikett am Karton)");
		aktionen((a) => (a === "zurueck" ? paletteZeigen(p) : beiAllgemein(a)));
		enter("scan", async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ === "palette" && i.versandkarton && !p.versandkarton) {
					return paletteZeigen(await api("karton_auf_palette", { station: zustand.station, karton: i.nve, palette: p.nve }), "Versandkarton …" + i.nve.slice(-6) + " aufgestellt.");
				}
				if (i.typ !== "charge") throw new Error("Bitte das Los scannen, nicht " + (i.typ === "palette" ? (p.versandkarton ? "eine Palette" : "eine Palette (nur Versandkartons kommen auf eine Palette)") : "einen Behälter") + ".");
				const einheiten = await api("einheiten", { artikel: i.artikel });
				anzahlAbfragen("Los " + i.charge, esc(i.artikelname) + (i.mhd ? " · MHD " + esc(i.mhd) : ""), einheiten, null, async (n, e) => {
					try {
						paletteZeigen(await api("palette_beladen", { station: zustand.station, palette: p.nve, code: i.charge, anzahl: n, einheit: e }), stk(n, e) + " geladen.");
					} catch (err) { meldung("rot", err.message); }
				}, () => paletteZeigen(p));
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	// Versandkarton auf eine Palette stellen: Palette scannen oder neue anlegen
	function kartonAufPalette(k) {
		app.innerHTML = kopf("Versandkarton …" + k.nve.slice(-6) + " aufstellen", true) + textFeld("scan", "Palette scannen (NVE)") +
			`<div class="reihe"><button class="knopf blau" data-a="neu">+ Neue Versandpalette<small>Etikett wird gedruckt</small></button></div>`;
		const los = async (palette) => {
			try { paletteZeigen(await api("karton_auf_palette", { station: zustand.station, karton: k.nve, palette }), "Versandkarton aufgestellt."); }
			catch (e) { meldung("rot", e.message); }
		};
		aktionen(async (a) => {
			if (a === "zurueck") return paletteZeigen(k);
			if (a === "neu") {
				try { const p = await api("palette_neu", { station: zustand.station, typ: "Versandpalette" }); etikettDrucken(p.nve); return los(p.nve); }
				catch (e) { return meldung("rot", e.message); }
			}
			beiAllgemein(a);
		});
		enter("scan", (v) => v && los(v));
		fokus("scan");
	}

	function umpacken(p, pos) {
		anzahlAbfragen("Umpacken", `${esc(pos.name)} · Los ${esc(pos.charge)}<br><span class="fehlt">Auf der Palette: ${esc(stk(pos.anzahl, pos.einheit))}</span>`,
			[{ einheit: pos.einheit, faktor: 1 }], { einheit: pos.einheit, anzahl: pos.anzahl }, (n) => {
				app.innerHTML = kopf("Umpacken: " + stk(n, pos.einheit), true) + textFeld("scan", "Zielpalette scannen") +
					`<div class="reihe"><button class="knopf blau" data-a="neu">+ Neue Versandpalette</button></div>`;
				const los = async (nach) => {
					try {
						const ziel = await api("palette_umpacken", { station: zustand.station, von: p.nve, nach, charge: pos.charge, anzahl: n, einheit: pos.einheit });
						paletteZeigen(ziel, stk(n, pos.einheit) + " umgepackt." + (ziel.hinweise && ziel.hinweise.length ? " " + ziel.hinweise.join(" ") : ""));
					} catch (e) { meldung("rot", e.message); }
				};
				aktionen(async (a) => {
					if (a === "neu") {
						try {
							const neu = await api("palette_neu", { station: zustand.station, typ: "Versandpalette" });
							etikettDrucken(neu.nve);
							return los(neu.nve);
						} catch (e) { return meldung("rot", e.message); }
					}
					if (a === "zurueck") return paletteZeigen(p);
					beiAllgemein(a);
				});
				enter("scan", (v) => v && los(v));
				fokus("scan");
			}, () => paletteZeigen(p));
	}

	// ------------------------------------------------------------------ Lieferung
	let lieferung;
	async function lieferungStart() {
		app.innerHTML = kopf("Lieferung", true) + `<p>An welchen Kunden? Zeile antippen</p><div id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = await api("kunden");
			suchListe("liste", [["Kunde", "customer_name"], ["Nr.", "name"]], liste, (k) => {
				lieferung = { kunde: k.name, titel: k.customer_name, zeilen: [], auftrag: null, positionen: [] };
				lieferAuftragWaehlen();
			}, "Suchen: Kundenname …");
		} catch (e) { meldung("rot", e.message); }
	}

	async function lieferAuftragWaehlen() {
		let liste = [];
		try { liste = await api("auftraege", { station: zustand.station, kunde: lieferung.kunde }); } catch (e) { /* ohne */ }
		const auftraege = {};
		liste.forEach((z) => { (auftraege[z.auftrag] = auftraege[z.auftrag] || []).push(z); });
		const namen = Object.keys(auftraege);
		if (!namen.length) return lieferungZeigen();
		app.innerHTML = kopf("Lieferung an " + lieferung.titel, true) + `<p>Zu welchem Kundenauftrag?</p><div class="raster">
			${namen.map((n) => `<button class="knopf blau" data-a="auftrag" data-n="${esc(n)}">${esc(n)}<small>${auftraege[n].map((z) =>
				esc(z.name) + ": " + esc(z.offen_liefern_text) + " offen").join("<br>")}${auftraege[n][0].termin ? "<br>Termin " + esc(auftraege[n][0].termin) : ""}</small></button>`).join("")}
			<button class="knopf" data-a="ohne">Ohne Auftrag</button></div>`;
		aktionen((a, d) => {
			if (a === "auftrag") { lieferung.auftrag = d.n; lieferung.positionen = auftraege[d.n]; return lieferungZeigen(); }
			if (a === "ohne") return lieferungZeigen();
			if (a === "zurueck") return lieferungStart();
			beiAllgemein(a);
		});
	}

	function lieferungZeilePlus(anfrage, positionen) {
		lieferung.zeilen.push({ anfrage, positionen });
		lieferungZeigen();
		const n = positionen.reduce((s, x) => s + x.anzahl, 0);
		meldung("gruen", "OK: " + (anfrage.ganz ? "ganze Palette " + anfrage.palette.slice(-6) : positionen[0].name) + " · " + stk(n, positionen[0].einheit));
	}

	// Verladung nach Kundenauftrag wie bei FOBIS: links alle Positionen mit Bestellt / Erledigt / ToDo und die
	// gewählte groß samt Registrierungen, rechts Herkunft (scannen), Ziel (Kunde, Auftrag) und Buchen
	function verladungMaske(gescanntJe, liste, hinweise) {
		const pos = lieferung.positionen.map((z) => {
			const f = z.faktor || 1;
			const jetzt = (gescanntJe[z.artikel] || 0) / f;
			const erledigt = rund((z.geliefert || 0) + jetzt);
			const todo = Math.max(rund(z.menge - erledigt), 0);
			return { z, jetzt, erledigt, todo, status: todo <= 1e-6 ? "Fertig" : erledigt > 0 ? "Aktiv" : "Neu" };
		});
		if (lieferung.sel == null || !pos[lieferung.sel]) lieferung.sel = Math.max(0, pos.findIndex((p) => p.status !== "Fertig"));
		const mitHinweis = pos.some((p) => p.z.hinweis);
		const zeilen = pos.map((p, i) => `<tr data-a="sel" data-i="${i}" class="${i === lieferung.sel ? "gewaehlt" : p.status === "Fertig" ? "fertig" : ""}">
			<td>${i + 1}</td><td>${esc(p.z.artikel)}</td><td>${esc(p.z.name)}</td><td>${esc(ein(p.z.einheit))}</td>
			<td class="z">${esc(zerlegen(p.z.einheiten, p.z.menge * (p.z.faktor || 1)))}</td>
			<td class="z">${p.erledigt ? esc(zerlegen(p.z.einheiten, p.erledigt * (p.z.faktor || 1))) : "–"}</td>
			<td class="z todo">${p.todo ? esc(zerlegen(p.z.einheiten, p.todo * (p.z.faktor || 1))) : "–"}</td>
			<td>${p.status === "Fertig" ? "✔ " : ""}${p.status}</td>${mitHinweis ? `<td>${esc(p.z.hinweis || "")}</td>` : ""}</tr>`).join("");
		const g = pos[lieferung.sel];
		const reg = g ? lieferung.zeilen.map((zl, i) => ({ zl, i })).filter((x) => x.zl.positionen.some((y) => y.artikel === g.z.artikel)) : [];
		const detail = g ? `<div class="m-detail"><div class="titel"><div><b>${esc(g.z.artikel)}</b> ${esc(g.z.name)}<small>${esc(ein(g.z.einheit))}${g.z.termin ? " · Termin " + esc(g.z.termin) : ""}</small></div>
				<div class="fehlt" style="font-size:16px;text-align:right">jetzt gescannt<br><b>${esc(zerlegen(g.z.einheiten, gescanntJe[g.z.artikel] || 0))}</b></div></div>
				${g.z.hinweis ? hinweisHtml([{ von: "Kundenauftrag", text: g.z.hinweis }]) : ""}
				${grossZahlen(g.z.menge, g.erledigt, g.todo, g.z.einheit, [g.z.menge, g.erledigt, g.todo].map((n) => zerlegen(g.z.einheiten, n * (g.z.faktor || 1))))}
				${reg.length ? `<div style="margin-top:8px">${reg.map((x) => x.zl.positionen.filter((y) => y.artikel === g.z.artikel).map((y, j) => `<div class="zeile"><div>Los ${esc(y.charge)}${y.palette ? " · " + (y.versandkarton ? "Versandkarton" : "Palette") + " …" + esc(y.palette.slice(-6)) : " · lose"}</div>
					<div class="rechts">${esc(stk(y.anzahl, y.einheit))}${j === 0 ? ` <button class="x" data-a="weg" data-i="${x.i}">✕</button>` : ""}</div></div>`).join("")).join("")}</div>` : ""}</div>` : "";
		const links = `<div class="einwaage"><table class="tab"><thead><tr><th>Pos</th><th>Artikel</th><th>Bezeichnung</th><th>Auftrag in</th><th class="z">Bestellt</th><th class="z">Erledigt</th><th class="z">ToDo</th><th>Status</th>${mitHinweis ? "<th>Hinweis</th>" : ""}</tr></thead>
			<tbody>${zeilen}</tbody></table></div>` + detail +
			(lieferung.zeilen.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Alle Registrierungen</div>${liste}</div>` : "");
		const offen = pos.filter((p) => p.status !== "Fertig").length;
		const rechts = gruppe("Herkunft", textFeld("scan", "Palette, Versandkarton oder Los scannen") +
				`<p class="fehlt" style="font-size:16px;margin:6px 0 0">Ganze Palette oder Versandkarton: NVE scannen. Lose Kartons: Los scannen, dann die Anzahl.</p>`) +
			gruppe("Ziel", zeileKV("Kunde", lieferung.titel) + zeileKV("Kundenauftrag", lieferung.auftrag) + zeileKV("Positionen", pos.length + " · offen " + offen)) +
			(hinweise.length ? hinweisHtml(hinweise.map((h) => ({ von: "Kundenauftrag", text: h }))) : "") +
			(lieferung.zeilen.length ? `<button class="knopf gruen" data-a="buchen">Lieferschein buchen<small>${lieferung.zeilen.length} Registrierung(en)${offen ? " · " + offen + " Position(en) noch offen" : ""}</small></button>` : "");
		return maske(links, rechts);
	}

	function lieferungZeigen() {
		const liste = lieferung.zeilen.map((z, i) => z.positionen.map((x, j) => `<div class="zeile"><div>${esc(x.name)}<br><span class="fehlt" style="font-size:16px">Los ${esc(x.charge)}${x.palette ? " · Palette …" + esc(x.palette.slice(-6)) : " · lose"}</span></div>
			<div class="rechts">${esc(stk(x.anzahl, x.einheit))} ${j === 0 ? `<button class="x" data-a="weg" data-i="${i}">✕</button>` : ""}</div></div>`).join("")).join("");
		const gescanntJe = {};
		lieferung.zeilen.forEach((z) => z.positionen.forEach((x) => { gescanntJe[x.artikel] = (gescanntJe[x.artikel] || 0) + x.menge; }));
		const hinweise = [...new Set(lieferung.positionen.map((z) => z.hinweis).filter(Boolean))];
		const auftragHtml = (lieferung.auftrag ? hinweisHtml(hinweise.map((h) => ({ von: "Kundenauftrag " + lieferung.auftrag, text: h }))) : "") + (lieferung.auftrag ? `<div class="panel"><div class="fehlt" style="font-size:16px">Kundenauftrag ${esc(lieferung.auftrag)}</div>${lieferung.positionen.map((z) => {
			const offen = (z.menge - z.geliefert) * (z.faktor || 1);
			const jetzt = gescanntJe[z.artikel] || 0;
			const fertig = jetzt >= offen - 1e-6;
			return `<div class="zeile"><div class="${fertig ? "ok" : ""}">${fertig ? "✔" : "○"} ${esc(z.name)}</div><div class="rechts ${fertig ? "ok" : "fehlt"}">${esc(zerlegen(z.einheiten, jetzt))}<br><small>von ${esc(zerlegen(z.einheiten, offen))}</small></div></div>`;
		}).join("")}</div>` : "");
		if (lieferung.auftrag) app.innerHTML = kopf("Verladung " + lieferung.auftrag + ": " + lieferung.titel, true) + verladungMaske(gescanntJe, liste, hinweise);
		else app.innerHTML = kopf("Lieferung an " + lieferung.titel, true) + auftragHtml +
			textFeld("scan", "Palette, Versandkarton oder Los scannen") +
			(lieferung.zeilen.length ? `<div class="panel">${liste}</div><div class="reihe"><button class="knopf gruen" data-a="buchen">Lieferschein buchen</button></div>` : "");
		aktionen(async (a, d) => {
			if (a === "sel") { lieferung.sel = +d.i; return lieferungZeigen(); }
			if (a === "weg") { lieferung.zeilen.splice(+d.i, 1); return lieferungZeigen(); }
			if (a !== "buchen") return beiAllgemein(a);
			const knopf = app.querySelector('[data-a="buchen"]');
			if (knopf) { knopf.disabled = true; knopf.textContent = "Bucht …"; }
			try {
				const e = await api("lieferung", { station: zustand.station, kunde: lieferung.kunde, kundenauftrag: lieferung.auftrag, zeilen: lieferung.zeilen.map((z) => z.anfrage) });
				ergebnis("Lieferung", ["Lieferschein: " + e.lieferschein, "Kunde: " + e.kunde, e.kundenauftrag ? "Kundenauftrag: " + e.kundenauftrag : "", e.positionen + " Position(en), " + kg(e.menge),
					e.paletten.length ? "Paletten: " + e.paletten.join(", ") : ""].filter(Boolean), e.hinweise)(beiAllgemein);
			} catch (err) {
				if (knopf) { knopf.disabled = false; knopf.textContent = "Lieferschein buchen"; }
				meldung("rot", err.message);
			}
		});
		enter("scan", async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ === "palette") return lieferPalette(i);
				if (i.typ !== "charge") throw new Error("Bitte eine Palette oder ein Los scannen.");
				const einheiten = await api("einheiten", { artikel: i.artikel });
				anzahlAbfragen("Lose Kartons: Los " + i.charge, esc(i.artikelname) + (i.mhd ? " · MHD " + esc(i.mhd) : ""), einheiten, null, async (n, e) => {
					const anfrage = { code: i.charge, anzahl: n, einheit: e };
					try { lieferungZeilePlus(anfrage, await api("pruefe_lieferzeile", { station: zustand.station, ...anfrage })); }
					catch (err) { lieferungZeigen(); meldung("rot", err.message); }
				}, lieferungZeigen);
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	function lieferPalette(p) {
		const aktiv = p.status === "Offen" || p.status === "Geschlossen";
		app.innerHTML = kopf("Palette …" + p.nve.slice(-6), true) +
			`<div class="panel"><div class="nve">${esc(p.nve)} ${statusMarke(p.status)}<br><small>${esc(p.kartons || "")} · ${esc(kg(p.menge || 0))}</small></div></div>` +
			(aktiv && hatInhalt(p) ? `<div class="reihe"><button class="knopf gruen" data-a="ganz">${p.versandkarton ? "Ganzen Versandkarton liefern" : "Ganze Palette liefern"}${(p.versandkartons || []).length ? `<small>mit ${p.versandkartons.length} Versandkartons</small>` : ""}</button></div>
				${p.positionen.length ? `<p class="fehlt">Oder Position antippen, um nur einzelne Kartons zu nehmen (${p.versandkarton ? "Karton" : "Palette"} wird angebrochen).</p>` : ""}` : "") +
			positionenHtml(p, aktiv ? "pos" : null) + kartonListeHtml(p, null) +
			((p.versandkartons || []).length ? `<p class="fehlt">Einen einzelnen Versandkarton liefern: seine NVE scannen.</p>` : "");
		aktionen(async (a, d) => {
			if (a === "zurueck") return lieferungZeigen();
			if (a === "ganz") {
				const anfrage = { palette: p.nve, ganz: 1 };
				try { return lieferungZeilePlus(anfrage, await api("pruefe_lieferzeile", { station: zustand.station, ...anfrage })); }
				catch (e) { return meldung("rot", e.message); }
			}
			if (a === "pos") {
				const pos = p.positionen[+d.i];
				return anzahlAbfragen("Von Palette …" + p.nve.slice(-6), `${esc(pos.name)} · Los ${esc(pos.charge)}<br><span class="fehlt">Auf der Palette: ${esc(stk(pos.anzahl, pos.einheit))}</span>`,
					[{ einheit: pos.einheit, faktor: 1 }], { einheit: pos.einheit }, async (n) => {
						const anfrage = { palette: p.nve, charge: pos.charge, anzahl: n, einheit: pos.einheit };
						try { lieferungZeilePlus(anfrage, await api("pruefe_lieferzeile", { station: zustand.station, ...anfrage })); }
						catch (e) { lieferungZeigen(); meldung("rot", e.message); }
					}, () => lieferPalette(p));
			}
			beiAllgemein(a);
		});
	}

	// ------------------------------------------------------------------ Umlagern
	let umgelagert = [];
	let umlagerNach = null;
	let umlagerZiele = [];
	async function umlagernStart(hinweis) {
		if (!umlagerNach) return umlagerZielWaehlen();
		const nach = umlagerNach.name;
		const zurueck = !!umlagerNach.zurueck;
		const titel = (zurueck ? "Zurück ins " : "Umlagern nach ") + umlagerNach.titel;
		app.innerHTML = kopf(titel, true) +
			(umlagerZiele.length > 1 ? `<div class="reihe"><button class="knopf" data-a="ziel-wechseln">Anderes Ziel wählen</button></div>` : "") +
			textFeld("scan", "Palette oder Los scannen – oder Los-Nummer eintippen") +
			`<div class="reihe"><button class="knopf blau" data-a="liste">Ohne Scanner: aus der Liste wählen</button></div>` +
			(umgelagert.length ? `<div class="panel"><div class="fehlt" style="font-size:16px">Heute hier umgelagert</div>${umgelagert.map((x) =>
				`<div class="zeile"><div>${esc(x.name)}<br><span class="fehlt" style="font-size:16px">Los ${esc(x.charge)}</span></div><div class="rechts">${esc(stk(x.anzahl, x.einheit))}</div></div>`).join("")}</div>` : "");
		if (hinweis) meldung("gruen", hinweis);
		aktionen((a) => {
			if (a === "ziel-wechseln") { umlagerNach = null; return umlagerZielWaehlen(); }
			if (a === "liste") return umlagernListe();
			beiAllgemein(a);
		});
		const buchen = async (args) => {
			try {
				const e = await api("umlagern", { station: zustand.station, nach, ...args });
				umgelagert = e.positionen.concat(umgelagert).slice(0, 12);
				umlagernStart("Umgelagert: " + e.positionen.map((x) => stk(x.anzahl, x.einheit)).join(", ") + " nach " + e.nach);
			} catch (err) { umlagernStart(); meldung("rot", err.message); }
		};
		// Schritt für Schritt ohne Scanner: Fertigware im Lager antippen (Artikel suchen, Los, lose oder Palette)
		async function umlagernListe() {
			app.innerHTML = kopf(titel + ": was?", true) +
				`<p>1. Zeile antippen (oben suchen: Artikel, Los) · 2. Anzahl eingeben · 3. OK</p><div id="ware">Lädt …</div>`;
			aktionen((a) => (a === "zurueck" ? umlagernStart() : beiAllgemein(a)));
			try {
				const liste = await api("fertigware_im_lager", { station: zustand.station, aus_verkauf: zurueck ? 1 : 0 });
				const el = document.getElementById("ware");
				if (!liste.length) { el.innerHTML = `<p class="fehlt">Keine Fertigware im Lager.</p>`; return; }
				el.innerHTML = tabelle([["Artikel", "artikel"], ["Bezeichnung", "name"], ["Los", "los"], ["MHD", "mhd"], ["Wo", "wo"], ["Bestand", "menge_text", 1]], liste, "ware");
				const f = document.createElement("input");
				f.className = "feld"; f.placeholder = "Suchen: Artikel, Bezeichnung oder Los …"; f.dataset.art = "text"; f.setAttribute("inputmode", "none");
				el.insertBefore(f, el.firstChild);
				f.addEventListener("input", () => {
					const t = f.value.trim().toLowerCase();
					el.querySelectorAll("tbody tr").forEach((tr) => { tr.style.display = !t || tr.textContent.toLowerCase().includes(t) ? "" : "none"; });
				});
				aktionen(async (a, d) => {
					if (a === "zurueck") return umlagernStart();
					if (a !== "ware") return beiAllgemein(a);
					const w = liste[+d.i];
					if (w.palette) return verarbeiten(w.palette);
					const einheiten = await api("einheiten", { artikel: w.artikel });
					anzahlAbfragen("Los " + w.los + " (lose: " + w.menge_text + ")", esc(w.name), einheiten, null, (n, e) => buchen({ code: w.charge, anzahl: n, einheit: e }), umlagernListe);
				});
			} catch (e) { meldung("rot", e.message); }
		}
		const verarbeiten = async (v) => {
			if (!v) return;
			try {
				const i = await api("info", { code: v });
				if (i.typ === "palette") {
					const p = i;
					app.innerHTML = kopf("Palette …" + p.nve.slice(-6), true) +
						`<div class="panel"><div class="nve">${esc(p.nve)} ${statusMarke(p.status)}<br><small>${esc(p.kartons || "")}</small></div></div>` +
						`<div class="reihe"><button class="knopf gruen" data-a="ganz">Ganze Palette umlagern</button></div><p class="fehlt">Oder Position antippen für einzelne Kartons.</p>` +
						positionenHtml(p, "pos");
					aktionen((a, d) => {
						if (a === "zurueck") return umlagernStart();
						if (a === "ganz") return buchen({ palette: p.nve, ganz: 1 });
						if (a === "pos") {
							const pos = p.positionen[+d.i];
							return anzahlAbfragen("Von Palette …" + p.nve.slice(-6), `${esc(pos.name)} · Los ${esc(pos.charge)}`,
								[{ einheit: pos.einheit, faktor: 1 }], { einheit: pos.einheit }, (n) => buchen({ palette: p.nve, charge: pos.charge, anzahl: n, einheit: pos.einheit }), umlagernStart);
						}
						beiAllgemein(a);
					});
					return;
				}
				if (i.typ !== "charge") throw new Error("Bitte eine Palette oder ein Los scannen.");
				const einheiten = await api("einheiten", { artikel: i.artikel });
				anzahlAbfragen("Los " + i.charge, esc(i.artikelname), einheiten, null, (n, e) => buchen({ code: i.charge, anzahl: n, einheit: e }), umlagernStart);
			} catch (e) { meldung("rot", e.message); }
		};
		enter("scan", verarbeiten);
		fokus("scan");
	}

	async function umlagerZielWaehlen() {
		app.innerHTML = kopf("Umlagern wohin?", true) + `<div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const ziele = await api("umlager_ziele", { station: zustand.station });
			umlagerZiele = ziele;
			if (!ziele.length) throw new Error("Es ist noch kein Lagerort als Umlager-Ziel eingerichtet.");
			if (ziele.length === 1) { umlagerNach = ziele[0]; return umlagernStart(); }
			document.getElementById("liste").innerHTML = ziele.map((z, i) =>
				`<button class="knopf${z.lagerverkauf ? " gruen" : ""}" data-a="ziel" data-i="${i}">${z.zurueck ? "Zurück ins " : ""}${esc(z.titel)}${z.lagerverkauf ? "<br><small>Lagerverkauf</small>" : z.zurueck ? "<br><small>Rücknahme aus dem Lagerverkauf</small>" : ""}</button>`).join("");
			aktionen((a, d) => {
				if (a === "ziel") { umlagerNach = ziele[+d.i]; return umlagernStart(); }
				beiAllgemein(a);
			});
		} catch (e) { meldung("rot", e.message); }
	}

	// ------------------------------------------------------------------ Karton anbrechen (Vorrat am Tisch)
	async function anbrechenStart(hinweis) {
		app.innerHTML = kopf("Karton anbrechen", true) + textFeld("scan", "Etikett vom neuen Karton / der neuen Rolle scannen") +
			`<p class="fehlt">Ohne Scanner: beim Vorrat auf „Wählen“ tippen.</p><div id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		if (hinweis) meldung("gruen", hinweis);
		const buchen = async (code) => {
			try {
				const e = await api("anbrechen", { station: zustand.station, code });
				anbrechenStart("Angebrochen: " + e.name + ", Charge " + e.charge + " (" + rund(e.menge) + ") → " + e.vorrat);
			} catch (err) { meldung("rot", err.message); }
		};
		enter("scan", (v) => v && buchen(v));
		fokus("scan");
		try {
			const liste = await api("vorraete", { station: zustand.station });
			document.getElementById("liste").innerHTML = tabelle([["Vorrat", "vorrat"], ["Artikel", "name"],
				["Charge dran", (v) => v.chargen.length ? v.chargen[0].charge + (v.chargen.length > 1 ? ` (+${v.chargen.length - 1} weitere)` : "") : "– leer –"], ["Bestand", (v) => mg(v.bestand, v.einheit), 1], ["", () => "Wählen ›"]], liste, "waehlen");
			aktionen(async (a, d) => {
				if (a !== "waehlen") return beiAllgemein(a);
				const v = liste[+d.i];
				app.innerHTML = kopf("Anbrechen: " + v.name, true) + `<p>Welche Charge kommt an den Tisch? (ältestes MHD zuerst)</p><div id="chargen">Lädt …</div>`;
				aktionen((b) => (b === "zurueck" ? anbrechenStart() : beiAllgemein(b)));
				const ch = await api("lager_chargen", { station: zustand.station, artikel: v.artikel });
				document.getElementById("chargen").innerHTML = ch.length
					? tabelle([["Charge", "charge"], ["Im Lager", (c) => mg(c.menge, v.einheit), 1], ["MHD", (c) => c.mhd || ""]], ch, "charge")
					: `<p class="fehlt">Keine Charge im Lager. Erst Wareneingang buchen.</p>`;
				aktionen((b, e) => (b === "charge" ? buchen(ch[+e.i].charge) : b === "zurueck" ? anbrechenStart() : beiAllgemein(b)));
			});
		} catch (e) { meldung("rot", e.message); }
	}

	// ------------------------------------------------------------------ Silo leer
	async function siloLeer() {
		app.innerHTML = kopf("Silo leer melden", true) + `<p>Welches Silo oder welcher Tank ist leer?</p><div class="raster" id="liste">Lädt …</div>`;
		aktionen(beiAllgemein);
		try {
			const liste = await api("silos", { station: zustand.station });
			document.getElementById("liste").innerHTML = liste.map((s) => `<button class="knopf" data-a="silo" data-name="${esc(s.silo)}">${esc(s.silo)}<small>rechnerisch ${esc(mg(s.bestand, s.einheit))}</small></button>`).join("") || "Keine Silos angelegt.";
			suche("liste");
			aktionen((a, d) => (a === "silo" ? siloBestaetigen(d.name) : beiAllgemein(a)));
		} catch (e) { meldung("rot", e.message); }
	}

	function siloBestaetigen(silo) {
		const box = document.createElement("div");
		box.className = "dialog";
		box.innerHTML = `<div class="panel"><p class="gross" style="font-size:26px">${esc(silo)} ist wirklich leer?</p>
			<p class="fehlt">Ein rechnerischer Rest wird als Silo-Differenz ausgebucht.</p>
			<div class="reihe"><button class="knopf" id="nein">Nein</button><button class="knopf rot" id="ja">Ja, ist leer</button></div></div>`;
		document.body.appendChild(box);
		box.querySelector("#nein").onclick = () => box.remove();
		box.querySelector("#ja").onclick = async () => {
			box.remove();
			try {
				const e = await api("silo_leer", { station: zustand.station, silo });
				ergebnis("Silo leer", [silo + " ist leer gemeldet.", "Rechnerischer Rest ausgebucht: " + kg(e.rest)], e.hinweise)(beiAllgemein);
			} catch (err) { meldung("rot", err.message); }
		};
	}

	// ------------------------------------------------------------------ Info
	function infoScan() {
		app.innerHTML = kopf("Info-Scan", true) + textFeld("scan", "Charge, Behälter, Silo oder Palette scannen") + `<div id="info"></div>`;
		aktionen(beiAllgemein);
		enter("scan", async (v, f) => {
			if (!v) return;
			f.value = "";
			try {
				const r = await api("info", { code: v });
				if (r.typ === "palette") {
					document.getElementById("info").innerHTML = `<div class="meldung gruen">${r.versandkarton ? "Versandkarton" : "Palette"} ${esc(r.nve)}</div>
						<div class="panel"><div class="zeile"><div class="fehlt">Art / Status</div><div class="rechts">${esc(r.art)} · ${esc(r.status)}</div></div>
						<div class="zeile"><div class="fehlt">Inhalt</div><div class="rechts">${esc(r.kartons || "leer")}</div></div>
						${r.auf_palette ? `<div class="zeile"><div class="fehlt">Steht auf Palette</div><div class="rechts">…${esc(r.auf_palette.slice(-6))}</div></div>` : ""}
						${r.lieferschein ? `<div class="zeile"><div class="fehlt">Lieferschein</div><div class="rechts">${esc(r.lieferschein)} · ${esc(r.kunde || "")}</div></div>` : ""}</div>` +
						`<p class="fehlt">Los antippen: Woraus besteht das?</p>` + positionenHtml(r, "herkunft-pos") + kartonListeHtml(r, null) +
						`<div class="reihe"><button class="knopf" data-a="etikett-palette">Etikett drucken</button><button class="knopf" data-a="akte">Akte</button></div>`;
					ton(true);
					aktionen((a, d) => {
						if (a === "etikett-palette") return etikettNachdrucken(r.nve);
						if (a === "akte") return akteZeigen(r.nve, infoScan);
						if (a === "herkunft-pos") return herkunftZeigen(r.positionen[+d.i].charge, infoScan);
						beiAllgemein(a);
					});
					return;
				}
				const zeilen = [];
				if (r.typ === "behaelter") zeilen.push(["Behälter", r.behaelter + " (" + r.behaelter_typ + ")"], ["Status", r.status]);
				if (r.typ === "behaelter" && r.gereinigt_am) zeilen.push(["Zuletzt gereinigt", r.gereinigt_am]);
				if (r.typ === "silo") zeilen.push(["Silo/Tank", r.silo]);
				if (r.artikelname) zeilen.push(["Artikel", r.artikelname]);
				if (r.charge) zeilen.push(["Charge", r.charge]);
				if (r.stufe) zeilen.push(["Stufe", r.stufe]);
				if (r.inhalt != null) zeilen.push(["Menge", kg(r.inhalt)]);
				if (r.backtag) zeilen.push(["Backtag", r.backtag]);
				if (r.mhd) zeilen.push(["Verwendbar bis / MHD", r.mhd + (r.abgelaufen ? " – ABGELAUFEN" : "")]);
				if (r.bestand) r.bestand.forEach((b) => zeilen.push(["Im Silo", b.charge + ": " + kg(b.menge)]));
				if (r.moeglich_enthalten && r.moeglich_enthalten.length) zeilen.push(["Möglicherweise enthalten", r.moeglich_enthalten.join(", ")]);
				const gesperrt = r.sperrstatus === "Gesperrt";
				// Leerer Behälter: zur Reinigung geben bzw. als gereinigt melden
				const reinigen = r.typ === "behaelter" && !r.charge && r.behaelter_typ !== "Gebinde" && r.status !== "Gesperrt";
				document.getElementById("info").innerHTML =
					(gesperrt ? `<div class="meldung rot">GESPERRT<small>${esc(r.sperrgrund || "")}</small></div>` : r.abgelaufen ? `<div class="meldung rot">ABGELAUFEN</div>`
						: r.status === "Reinigung" ? `<div class="meldung orange">${esc(v)} ist zur Reinigung<small>Erst nach der Meldung „gereinigt“ wieder befüllen.</small></div>` : `<div class="meldung gruen">${esc(v)}</div>`) +
					`<div class="panel">${zeilen.map(([k, w]) => `<div class="zeile"><div class="fehlt">${esc(k)}</div><div class="rechts">${esc(w)}</div></div>`).join("")}</div>` +
					(reinigen ? `<div class="reihe">${r.status === "Reinigung" ? `<button class="knopf gruen" data-a="gereinigt">Gereinigt – wieder frei</button>`
						: `<button class="knopf" data-a="zur-reinigung">Zur Reinigung</button><button class="knopf" data-a="gereinigt">Gereinigt melden</button>`}</div>` : "") +
					// Etikett nachdrucken (abgerissen, verschmutzt): Behälter und Gebinde
					(r.typ === "behaelter" ? `<div class="reihe"><button class="knopf" data-a="etikett-behaelter">Etikett drucken</button><button class="knopf" data-a="akte">Akte</button></div>` : "") +
					(r.charge ? `<div class="reihe"><button class="knopf" data-a="herkunft">Woraus besteht das?</button></div>` : "") +
					(r.fundstellen ? KtAkte.fundstellenHtml(r.fundstellen, true) : "");
				ton(!gesperrt && !r.abgelaufen);
				aktionen(async (a, d) => {
					if (a === "etikett-behaelter") return gebindeDrucken(r.behaelter, null);
					if (a === "akte") return akteZeigen(d.c || r.behaelter, infoScan);
					if (a === "herkunft") return herkunftZeigen(r.charge, infoScan);
					if (a === "fehlt") return fehltStart(r.fundstellen, +d.i, infoScan);
					if (a !== "gereinigt" && a !== "zur-reinigung") return beiAllgemein(a);
					try {
						const e = await api("behaelter_reinigung", { station: zustand.station, code: r.behaelter, gereinigt: a === "gereinigt" ? 1 : 0 });
						meldung("gruen", e.behaelter + ": " + (e.status === "Frei" ? "gereinigt, frei" : "zur Reinigung"));
						document.getElementById("info").innerHTML = "";
						fokus("scan");
					} catch (err) { meldung("rot", err.message); }
				});
			} catch (e) { meldung("rot", e.message); }
		});
		fokus("scan");
	}

	// ------------------------------------------------------------------ Akte, Herkunft, Etikett fehlt
	// Darstellung in /assets/keks_trace/js/akte_ansicht.js (gemeinsam mit der Audit-Ansicht /akte)
	async function akteZeigen(code, zurueck) {
		try {
			const a = await api("akte", { code });
			app.innerHTML = kopf("Akte", true) + `<div class="panel"><div class="gross">${esc(a.titel)}</div></div>` +
				((a.lose || []).length ? `<div class="reihe">${a.lose.map((l) => `<button class="knopf" data-a="herkunft" data-c="${esc(l.charge)}">Woraus besteht Los ${esc(l.los)}?<small>${esc(l.name || "")}</small></button>`).join("")}</div>` : "") +
				KtAkte.akteHtml(a);
			aktionen((x, d) => {
				if (x === "zurueck") return zurueck();
				if (x === "herkunft") return herkunftZeigen(d.c, () => akteZeigen(code, zurueck));
				beiAllgemein(x);
			});
		} catch (e) { meldung("rot", e.message); }
	}
	async function herkunftZeigen(code, zurueck) {
		app.innerHTML = kopf("Woraus besteht das?", true) + `<p>Lädt …</p>`;
		const zu = () => aktionen((x) => (x === "zurueck" ? zurueck() : beiAllgemein(x)));
		zu();
		try {
			const h = await api("herkunft", { code });
			app.innerHTML = kopf("Woraus besteht das?", true) + KtAkte.herkunftHtml(h);
			zu();
		} catch (e) { meldung("rot", e.message); }
	}
	// Palette ohne Etikett: aus „Wo ist dieses Los?“ nachdrucken. Damit keine NVE doppelt klebt, werden die
	// anderen Paletten mit demselben Los gescannt (sie haben ihr Etikett noch). Das Protokoll hält fest, welche.
	function fehltStart(f, i, zurueck) {
		const ziel = f.paletten[i];
		const andere = f.paletten.filter((_, j) => j !== i);
		const gesehen = new Set();
		const zeigen = () => {
			const offen = andere.length - gesehen.size;
			app.innerHTML = kopf("Etikett fehlt", true) +
				`<div class="panel"><div class="gross">Palette …${esc(ziel.nve.slice(-6))}</div><small>${esc([ziel.nve, ziel.dieses_los, ziel.gepackt, ziel.letzte].filter(Boolean).join(" · "))}</small></div>` +
				(andere.length
					? `<div class="meldung ${offen ? "orange" : "gruen"}">${offen ? `Damit keine NVE doppelt klebt: bitte die anderen Paletten mit Los ${esc(f.los)} scannen. Sie müssen ihr Etikett noch haben.<small>Noch ${offen} von ${andere.length}.</small>` : "Alle anderen Paletten haben ihr Etikett."}</div>` +
						textFeld("scan", "Andere Palette scannen") +
						`<div class="panel">${andere.map((x) => `<div class="zeile"><div>${gesehen.has(x.nve) ? "✔" : "○"} Palette …${esc(x.nve.slice(-6))}<br><small class="fehlt">${esc([x.status, x.dieses_los, x.letzte].filter(Boolean).join(" · "))}</small></div>
							<div class="rechts">${gesehen.has(x.nve) ? `<span class="ok">hat Etikett</span>` : "offen"}</div></div>`).join("")}</div>`
					: `<p>Keine anderen Paletten mit diesem Los im Lager.</p>`) +
				`<div class="reihe"><button class="knopf gruen" data-a="drucken"${offen ? " disabled" : ""}>Etikett nachdrucken</button>` +
				(offen ? `<button class="knopf" data-a="trotzdem">Andere nicht erreichbar – trotzdem drucken<small>wird im Protokoll vermerkt</small></button>` : "") + `</div>`;
			aktionen(async (a) => {
				if (a === "zurueck") return zurueck();
				if (a === "drucken" || a === "trotzdem") {
					await etikettDrucken(ziel.nve, "fehlt", [...gesehen].join(","));
					return zurueck();
				}
				beiAllgemein(a);
			});
			enter("scan", async (v, feldEl) => {
				if (!v) return;
				feldEl.value = "";
				try {
					const p = await api("palette_info", { code: v });
					if (p.nve === ziel.nve) { ton(false); return meldung("rot", "Diese Palette hat ein Etikett – dann ist sie nicht die gesuchte. Bitte nochmal prüfen."); }
					if (!andere.some((x) => x.nve === p.nve)) { ton(false); return meldung("orange", "Palette …" + p.nve.slice(-6) + " hat dieses Los nicht."); }
					gesehen.add(p.nve);
					ton(true);
					zeigen();
				} catch (e) { meldung("rot", e.message); }
			});
			fokus("scan");
		};
		zeigen();
	}

	// ------------------------------------------------------------------ Start
	async function init() {
		const station = laden("kt_station");
		if (!station) return stationWaehlen();
		try {
			const s = await api("start", { station });
			zustand.station = s.station;
			zustand.typ = s.typ;
			zustand.funktionen = s.funktionen;
			zustand.stufen = s.stufen;
			zustand.nur_fertigware = s.nur_fertigware;
			zustand.umlager_ziel = s.umlager_ziel;
			zustand.vorschlagen = s.vorschlagen;
			zustand.drucker = s.drucker || {};
			zustand.linie = s.linie;
			umlagerNach = null;
			zustand.vorraete = s.vorraete;
			startseite();
		} catch (e) {
			speichern("kt_station", "");
			stationWaehlen();
		}
	}
	init();
})();
{% endraw %}
</script>
